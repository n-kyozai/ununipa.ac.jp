<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料一覧メニュー - 自然地理学概論</title>
    <!-- Tailwind CSS の導入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 提示コードから完全にパクったステータス用カラー */
        .status-active { background-color: #a0c832; } /* 公開中：鮮やかな黄緑 */
        .status-prep { background-color: #4bc0c8; }   /* 準備中：さわやかな水色 */
        .status-out { background-color: #9ca3af; }    /* 範囲外：落ち着いたグレー */

        /* テーブル格子線を細くクリーンに統一 */
        table, th, td {
            border: 1px solid #d1d5db; /* border-gray-300 */
        }
        /* ロック表示用（範囲外の授業資料以外の網掛け） */
        .bg-stripes {
            background-image: linear-gradient(135deg, #f3f4f6 25%, transparent 25%, transparent 50%, #f3f4f6 50%, #f3f4f6 75%, transparent 75%, transparent);
            background-size: 8px 8px;
        }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto overflow-hidden">
        <div class="flex-grow pb-6">
            <!-- 提示コードを模したシンプルなH1ヘッダー -->
            <h1 class="text-xl font-bold mb-4 pb-2 border-b border-gray-300 flex justify-between items-end">
                <span>自然地理学概論 【篠倉 大樹】</span>
            </h1>

            <!-- 8列の横長データを綺麗にスクロール表示するためのコンテナ -->
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse border border-gray-300 text-center min-w-[900px]">
                    <thead class="bg-gray-100 text-gray-700 whitespace-nowrap">
                        <tr>
                            <!-- 左から：資料名、ステータス、授業資料、AI資料、論述対策、一問一答、ワーク、備考 -->
                            <th class="border border-gray-300 p-3 font-bold w-[18%] text-left pl-4">資料名</th>
                            <th class="border border-gray-300 p-3 font-normal w-[10%]">ステータス</th>
                            <th class="border border-gray-300 p-3 font-normal w-[11%]">授業資料</th>
                            <th class="border border-gray-300 p-3 font-normal w-[11%]">AI資料</th>
                            <th class="border border-gray-300 p-3 font-normal w-[11%]">論述対策</th>
                            <th class="border border-gray-300 p-3 font-normal w-[11%]">一問一答</th>
                            <th class="border border-gray-300 p-3 font-normal w-[11%]">ワーク</th>
                            <th class="border border-gray-300 p-3 font-normal text-left pl-4 w-[17%]">備考</th>
                        </tr>
                    </thead>
                    <tbody id="pdf-list-body" class="divide-y divide-gray-200">
                        <!-- ここにJavaScriptでリストが自動生成されます -->
                    </tbody>
                </table>
            </div>

            <!-- 提示コードのページネーションから矢印を省き、件数情報だけを表示するグレー帯 -->
            <div class="bg-gray-200 p-2.5 mt-2 flex justify-center items-center text-sm text-gray-600">
                <span id="total-count-label">全 13 件</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * 【講義データ設定 (GitHub管理用)】
         * 管理者はこの配列を直接書き換えることで表示・リンクを制御します。
         * 
         * ■ 設定ルール:
         * 1. 全体ステータス (status)
         *    - "active" : 公開中 (黄緑バッジ。コンテンツがactiveであればアクセス可能)
         *    - "prep"   : 準備中 (水色バッジ。コンテンツがactiveであればアクセス可能)
         *    - "out"    : 範囲外 (グレーバッジ。授業資料のみアクセス可能、その他は強制ロック)
         * 
         * 2. 各コンテンツの準備状況 (docStatus, aiStatus, essayStatus, qaStatus, workStatus)
         *    - "active" : 準備完了 (リンクが有効になり、クリック可能になります)
         *    - "prep"   : 準備中 (グレーアウトし、クリック不可になります)
         * 
         * 3. 各リンク先 (docLink, aiLink, essayLink, qaLink, workLink)
         *    - 有効なURLまたはパスを入力します。無い場合は "#" にします。
         */
        const courseData = [
            { 
                id: 2, 
                name: "第2回講義資料", 
                status: "active",                    // 全体ステータス ("active" | "prep" | "out")
                docStatus: "active", docLink: "#",    // 授業資料ステータス & リンク
                aiStatus: "prep", aiLink: "#",       // AI資料ステータス & リンク
                essayStatus: "prep", essayLink: "#", // 論述対策ステータス & リンク
                qaStatus: "prep", qaLink: "#",       // 一問一答ステータス & リンク
                workStatus: "prep", workLink: "#",   // ワークステータス & リンク
                note: "地球の形成と地質年代"          // 備考（講義テーマ）
            },
            { 
                id: 3, 
                name: "第3回講義資料", 
                status: "active", 
                docStatus: "active", docLink: "#", 
                aiStatus: "active", aiLink: "https://n-kyozai.github.io/ununipa.ac.jp/phys-geo/Global_Atmospheric_Dynamics_compressed.pdf", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "大気のはたらき" 
            },
            { 
                id: 4, 
                name: "第4回講義資料", 
                status: "active", 
                docStatus: "active", docLink: "#", 
                aiStatus: "active", aiLink: "https://n-kyozai.github.io/ununipa.ac.jp/phys-geo/Global_Atmospheric_Dynamics_compressed.pdf", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "海洋のはたらき" 
            },
            { 
                id: 5, 
                name: "第5回講義資料", 
                status: "prep", 
                docStatus: "active", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "世界の気候" 
            },
            { 
                id: 6, 
                name: "第6回講義資料", 
                status: "prep", 
                docStatus: "prep", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "日本の気候" 
            },
            { 
                id: 7, 
                name: "第7回講義資料", 
                status: "prep", 
                docStatus: "prep", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "世界の主な大地形" 
            },
            { 
                id: 8, 
                name: "第8回講義資料", 
                status: "out", 
                docStatus: "active", docLink: "#", 
                aiStatus: "active", aiLink: "#", 
                essayStatus: "active", essayLink: "#", 
                qaStatus: "active", qaLink: "#", 
                workStatus: "active", workLink: "#", 
                note: "プレートテクトニクス" 
            },
            { 
                id: 9, 
                name: "第9回講義資料", 
                status: "out", 
                docStatus: "active", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "河川と海岸の小地形" 
            },
            { 
                id: 10, 
                name: "第10回講義資料", 
                status: "out", 
                docStatus: "prep", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "扇状地と三角州" 
            },
            { 
                id: 11, 
                name: "第11回講義資料", 
                status: "out", 
                docStatus: "prep", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "火山と火山地形" 
            },
            { 
                id: 12, 
                name: "第12回講義資料", 
                status: "out", 
                docStatus: "prep", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "カルスト地形" 
            },
            { 
                id: 13, 
                name: "第13回講義資料", 
                status: "out", 
                docStatus: "prep", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "地震と災害" 
            },
            { 
                id: 14, 
                name: "第14回講義資料", 
                status: "out", 
                docStatus: "prep", docLink: "#", 
                aiStatus: "prep", aiLink: "#", 
                essayStatus: "prep", essayLink: "#", 
                qaStatus: "prep", qaLink: "#", 
                workStatus: "prep", workLink: "#", 
                note: "土壌と植生" 
            }
        ];

        /**
         * 各マテリアルに対応するボタン/リンクのフラットなHTML要素を生成
         * @param {string} type 教材区分 ('doc' | 'ai' | 'essay' | 'qa' | 'work')
         * @param {string} parentStatus 親の全体ステータス ('active' | 'prep' | 'out')
         * @param {string} contentStatus 個別の準備状態 ('active' | 'prep')
         * @param {string} url リンク先
         */
        function generateBtn(type, parentStatus, contentStatus, url) {
            // ボタン表示用のテキスト設定
            const labels = { doc: '閲覧', ai: '資料', essay: '対策', qa: 'テスト', work: 'ワーク' };
            const label = labels[type];

            // 1. 範囲外（out）の制御：授業資料（doc）以外のすべてのアクセス権をロックする
            if (parentStatus === 'out' && type !== 'doc') {
                return `
                    <button disabled class="border border-gray-200 bg-gray-50 text-gray-300 px-3 py-1 rounded text-xs cursor-not-allowed bg-stripes w-[72px]" title="範囲外のためアクセス不可">
                        ロック
                    </button>
                `;
            }

            // 2. コンテンツが「準備中（prep）」の場合の制御
            if (contentStatus === 'prep') {
                return `
                    <button disabled class="border border-gray-200 bg-gray-50 text-gray-300 px-3 py-1 rounded text-xs cursor-not-allowed w-[72px]">
                        未登録
                    </button>
                `;
            }

            // 3. コンテンツがアクティブな場合 (提示コードに寄せたお固めの枠付きボタンスタイル)
            const isDummy = url === '#' || url.startsWith('#');
            const targetAttr = isDummy ? '' : 'target="_blank" rel="noopener noreferrer"';
            
            // 提示コードの「テスト実施」青ボタンと「資料」グレーボタンのパターンを継承
            const buttonStyleClass = (type === 'qa') 
                ? 'border border-blue-400 bg-blue-50 hover:bg-blue-100 text-blue-700' 
                : 'border border-gray-400 bg-gray-100 hover:bg-gray-200 text-gray-700';

            return `
                <a href="${url}" ${targetAttr} class="inline-block px-3 py-1 rounded text-xs font-bold transition whitespace-nowrap w-[72px] ${buttonStyleClass}">
                    ${label}
                </a>
            `;
        }

        function renderTable() {
            const tbody = document.getElementById('pdf-list-body');
            tbody.innerHTML = '';

            courseData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";

                // 全体ステータスのバッジ切り替え
                let statusLabel = "公開中";
                let statusClass = "status-active"; // 黄緑 #a0c832

                if (item.status === "prep") {
                    statusLabel = "準備中";
                    statusClass = "status-prep";   // 水色 #4bc0c8
                } else if (item.status === "out") {
                    statusLabel = "範囲外";
                    statusClass = "status-out";    // 灰色 #9ca3af
                }

                // 資料名セルのテキスト表示 (提示コードのデザインに準じて青文字は使用せず、太字のシンプルな見た目)
                const docNameHtml = `<span class="text-gray-800 font-medium">${item.name}</span>`;

                // 8列のカラム構成
                tr.innerHTML = `
                    <!-- ① 資料名 -->
                    <td class="border border-gray-300 p-3 text-left pl-4 whitespace-nowrap font-medium text-gray-800">
                        ${docNameHtml}
                    </td>
                    <!-- ② ステータス -->
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        <span class="inline-block text-white text-xs px-3 py-1 rounded font-bold ${statusClass}">
                            ${statusLabel}
                        </span>
                    </td>
                    <!-- ③ 授業資料 -->
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        ${generateBtn('doc', item.status, item.docStatus, item.docLink)}
                    </td>
                    <!-- ④ AI資料 -->
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        ${generateBtn('ai', item.status, item.aiStatus, item.aiLink)}
                    </td>
                    <!-- ⑤ 論述対策 -->
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        ${generateBtn('essay', item.status, item.essayStatus, item.essayLink)}
                    </td>
                    <!-- ⑥ 一問一答 -->
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        ${generateBtn('qa', item.status, item.qaStatus, item.qaLink)}
                    </td>
                    <!-- ⑦ ワーク -->
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        ${generateBtn('work', item.status, item.workStatus, item.workLink)}
                    </td>
                    <!-- ⑧ 備考 -->
                    <td class="border border-gray-300 p-3 text-left pl-4 text-gray-600 text-xs whitespace-nowrap">
                        ${item.note}
                    </td>
                `;

                tbody.appendChild(tr);
            });

            // 総件数表示の更新
            document.getElementById('total-count-label').textContent = `登録件数: 全 ${courseData.length} 件`;
        }

        // 初期ロード時に描画処理を実行
        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
```

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF資料一覧メニュー - 自然地理学概論</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ヘッダーやアクセントのカラー */
        .header-bg { background-color: #005662; }
        .tab-bg { background-color: #e5f1f4; }
        .status-active { background-color: #a0c832; } /* 閲覧可能（黄緑） */
        .status-prep { background-color: #4bc0c8; } /* 準備中（水色） */
    </style>
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto overflow-hidden">
        <div class="flex-grow pb-6 overflow-y-auto">
            <h1 class="text-xl font-bold mb-4 pb-2 border-b border-gray-300 flex justify-between items-end">
                <span>自然地理学概論【篠倉 大樹】</span>
            </h1>

            <!-- PDF資料一覧テーブル -->
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse border border-gray-300 text-center min-w-[500px]">
                    <thead class="bg-gray-100 text-gray-700 whitespace-nowrap">
                        <tr>
                            <th class="border border-gray-300 p-2 font-normal w-1/4">
                                <div class="flex items-center justify-center gap-1 cursor-pointer hover:bg-gray-200 p-1 rounded transition-colors inline-flex">
                                    資料名
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
                                    </svg>
                                </div>
                            </th>
                            <th class="border border-gray-300 p-3 font-normal w-1/6">AI資料</th>
                            <th class="border border-gray-300 p-3 font-normal w-1/6">確認テスト</th>
                            <th class="border border-gray-300 p-3 font-normal w-1/6">ステータス</th>
                            <th class="border border-gray-300 p-3 font-normal w-1/4">備考</th>
                        </tr>
                    </thead>
                    <tbody id="pdf-list-body">
                        <!-- ここにJavaScriptでリストが生成されます -->
                    </tbody>
                </table>
            </div>

            <!-- ページネーション -->
            <div class="bg-gray-200 p-2 mt-2 flex justify-center items-center text-sm text-gray-600 gap-4">
                <span id="pagination-info">14件 (1/1)</span>
                <div class="flex gap-3">
                    <span class="text-gray-500">&lt;</span>
                    <span class="text-gray-700 font-bold">1</span>
                    <span class="text-gray-500">&gt;</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 【講義データ】
         * docStatus: 資料名リンクの有効化 (active / prep)
         * docLink: 資料名の遷移先URL
         * aiStatus: AI資料ボタンの有効化 (active / prep)
         * aiLink: AI資料の遷移先URL
         * testStatus: 確認テストボタンの有効化 (active / prep)
         * testLink: 確認テストの遷移先URL
         * status: 全体ステータスラベルの表示 (active: テスト受付中, prep: 準備中)
         */
        const courseData = [
            { id: 1, name: "第2回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test01/index.html", status: "prep", note: "地形の形成と地質年代" },
            { id: 2, name: "第3回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "active", testLink: "./test02/index.html", status: "active", note: "大気のはたらき" },
            { id: 3, name: "大気のはたらきと大循環［復習］", docStatus: "prep", docLink: "#", aiStatus: "active", aiLink: "https://n-kyozai.github.io/ununipa.ac.jp/phys-geo/Global_Atmospheric_Dynamics_compressed.pdf", testStatus: "prep", testLink: "./test03/index.html", status: "prep", note: "大気のはたらきと大循環［復習］" },
            { id: 4, name: "第4回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test04/index.html", status: "prep", note: "海洋のはたらき" },
            { id: 5, name: "第5回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test05/index.html", status: "prep", note: "世界の気候" },
            { id: 6, name: "第6回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test06/index.html", status: "prep", note: "日本の気候" },
            { id: 7, name: "第7回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test07/index.html", status: "prep", note: "世界の大地形" },
            { id: 8, name: "第8回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test08/index.html", status: "prep", note: "プレートテクトニクス" },
            { id: 9, name: "第9回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test09/index.html", status: "prep", note: "河川と海岸の小地形" },
            { id: 10, name: "第10回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test10/index.html", status: "prep", note: "扇状地と三角州" },
            { id: 11, name: "第11回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test11/index.html", status: "prep", note: "カルスト地形" },
            { id: 12, name: "第12回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test12/index.html", status: "prep", note: "火山と火山地形" },
            { id: 13, name: "第13回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test13/index.html", status: "prep", note: "地震と災害" },
            { id: 14, name: "第14回講義資料", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test14/index.html", status: "prep", note: "土壌と植生" },
            { id: 15, name: "まとめのテスト", docStatus: "prep", docLink: "#", aiStatus: "prep", aiLink: "#", testStatus: "prep", testLink: "./test14/index.html", status: "prep", note: "まとめのテスト対策です。" }
        ];

        // ページネーション情報の動的更新
        document.getElementById('pagination-info').textContent = `${courseData.length}件 (1/1)`;

        // テーブル本体を生成する処理
        const tbody = document.getElementById('pdf-list-body');

        courseData.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition-colors";

            // 全体ステータスラベルの分岐
            const isStatusActive = item.status === "active";
            const statusLabel = isStatusActive ? "テスト受付中" : "準備中";
            const statusClass = isStatusActive ? "status-active" : "status-prep";

            // 個別ステータスの判定
            const isDocActive = item.docStatus === "active";
            const isAiActive = item.aiStatus === "active";
            const isTestActive = item.testStatus === "active";
            
            // 資料名のHTML生成 (prepの場合はリンクなしのグレー文字)
            const docHtml = isDocActive
                ? `<a href="${item.docLink}" class="text-blue-600 hover:text-blue-800 hover:underline transition-colors">${item.name}</a>`
                : `<span class="text-gray-500">${item.name}</span>`;

            // AI資料ボタンのHTML生成（アイコンなし）
            const aiBtnHtml = isAiActive
                ? `<a href="${item.aiLink}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1 border border-gray-400 bg-white hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm">
                    資料
                   </a>`
                : `<button disabled class="inline-flex items-center justify-center gap-1 border border-gray-200 bg-gray-50 text-gray-400 px-3 py-1.5 rounded text-xs cursor-not-allowed">
                    資料
                   </button>`;

            // 確認テストボタンのHTML生成（アイコンなし）
            const testBtnHtml = isTestActive
                ? `<a href="${item.testLink}" class="inline-flex items-center justify-center gap-1 border border-blue-400 bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm">
                    テスト実施
                   </a>`
                : `<button disabled class="inline-flex items-center justify-center gap-1 border border-gray-200 bg-gray-50 text-gray-400 px-3 py-1.5 rounded text-xs cursor-not-allowed">
                    テスト実施
                   </button>`;

            tr.innerHTML = `
                <td class="border border-gray-300 p-3 text-left pl-4 whitespace-nowrap text-gray-800 font-medium">
                    ${docHtml}
                </td>
                <td class="border border-gray-300 p-2 whitespace-nowrap text-center">
                    ${aiBtnHtml}
                </td>
                <td class="border border-gray-300 p-2 whitespace-nowrap text-center">
                    ${testBtnHtml}
                </td>
                <td class="border border-gray-300 p-2 whitespace-nowrap text-center">
                    <span class="inline-block text-white text-xs px-3 py-1 rounded ${statusClass}">
                        ${statusLabel}
                    </span>
                </td>
                <td class="border border-gray-300 p-2 text-gray-600 whitespace-nowrap text-left text-sm">
                    ${item.note}
                </td>
            `;

            tbody.appendChild(tr);
        });
    </script>
</body>
</html>

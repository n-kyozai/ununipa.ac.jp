    <style>
        @import url('https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        
        :root {
            --bg-app: #F3EFE6;         /* 少し深い温かみのあるベージュ（アプリ背景用） */
            --bg-slide: #FAF7F0;       /* image_4b0c41.png から抽出した極上ベージュ（スライド背景用） */
            --color-text: #2F2924;      /* 深いウォームダークブラウン（抜群の可読性） */
            --color-accent-red: #A83E4C; /* 落ち着いたえんじ色（問い・警告用） */
            --color-accent-green: #2E6F40; /* 落ち着いた深い緑（答え・成功用） */
            --border-beige: #E6DFD3;    /* 境界線用の穏やかなベージュ */
        }

        body {
            font-family: 'Noto Sans JP', 'BIZ UDGothic', sans-serif;
            background-color: var(--bg-app);
            color: var(--color-text);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* スライドの基準解像度は1024x576(16:9) */
        .slide-canvas-scaled {
            width: 1024px;
            height: 576px;
            padding: 30px 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background-color: var(--bg-slide);
            border-radius: 12px;
            position: absolute;
        }

        .slide-outer-wrapper {
            position: relative;
            overflow: hidden;
            background-color: var(--bg-slide);
            border: 1px solid var(--border-beige);
            box-shadow: 0 4px 12px rgba(47, 41, 36, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease-out;
        }

        /* 通常時のハイライト表示 */
        .red-sheet-hide {
            background-color: #FEE2E2;
            color: #A83E4C;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 700;
            transition: all 0.15s ease-in-out;
            border-bottom: 2px solid #FCA5A5;
            cursor: pointer;
            display: inline-block;
        }

        /* 赤シートがONのときの目隠し（スマホ・PC共通） */
        .red-sheet-active .red-sheet-hide {
            background-color: #EF4444 !important;
            color: #EF4444 !important; /* 文字を赤と同化させて完全に隠す */
            border-bottom: 2px solid #B91C1C !important;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.15);
        }

        /* 赤シートON状態で、ホバー、タッチ中（:active）、タップされた後（.revealed）は極上に見えるようにする */
        .red-sheet-active .red-sheet-hide:hover,
        .red-sheet-active .red-sheet-hide:active,
        .red-sheet-active .red-sheet-hide.revealed {
            background-color: #FEE2E2 !important;
            color: #A83E4C !important; /* 明確に視認可能なえんじ色 */
            border-bottom: 2px solid #FCA5A5 !important;
            box-shadow: none !important;
            transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
        }

        /* カスタムスクロールバー */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(47, 41, 36, 0.03);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(47, 41, 36, 0.15);
            border-radius: 2px;
        }
    </style>
</head>

                <button onclick="toggleRedSheetMode()" id="btn-red-sheet-switch" class="bg-[#A83E4C] hover:bg-[#8B2635] text-white text-[11px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition duration-150 active:scale-95 shadow-sm">

    </main>

        /**
         * モバイルの縦横回転、PCリサイズに連動して、高さを突き破らない等倍変形
         */
        function resizeSlideCanvas() {
            const wrapper = elements.slideWrapper;
            const canvas = elements.slideCanvas;
            if (!wrapper || !canvas || activeTabIndex !== "present") return;

            const baseWidth = 1024;
            const baseHeight = 576;
            const baseRatio = baseWidth / baseHeight; // 16:9 ≒ 1.777

            // 親コンテナの横幅限界
            const parentWidth = wrapper.parentElement.clientWidth;

            // 回転（縦・横）した際のために、画面高さ（window.innerHeight）から、ヘッダー、コントロール、解説エリアの占有高さを差し引いてリアルに算定
            const headerHeight = document.querySelector('header').offsetHeight || 50;
            const controlsHeight = document.getElementById('slide-controls-area').offsetHeight || 50;
            const notesHeight = (showSpeakerNotes && elements.notesArea && !elements.notesArea.classList.contains('hidden')) 
                                ? elements.notesArea.offsetHeight 
                                : 0;
            
            // 安全用余白パディング
            const extraGap = 24; 
            const maxAvailableHeight = window.innerHeight - headerHeight - controlsHeight - notesHeight - extraGap;

            const currentRatio = parentWidth / maxAvailableHeight;

            let scale = 1;

            if (currentRatio > baseRatio) {
                // 画面が十分に横長（モバイル横画面またはPC大画面）→ 高さが制限因子になる
                scale = maxAvailableHeight / baseHeight;
            } else {
                // 画面が縦長（モバイル縦画面）→ 横幅が制限因子になる
                scale = parentWidth / baseWidth;
            }

            // 極端な極小化を防ぐ（下限値を設定）
            scale = Math.max(scale, 0.28);
            // 無駄な大画面拡大によるぼやけを防ぐ（上限値を設定）
            scale = Math.min(scale, 1.1);

            // CSS Transformで完全等倍変形をかける
            canvas.style.transform = `scale(${scale})`;
            canvas.style.transformOrigin = "center center";

            // 親ラッパーにスケール後の実寸バウンディングを上書きして余計な余白やスクロールバーを絶滅させる
            wrapper.style.width = `${baseWidth * scale}px`;
            wrapper.style.height = `${baseHeight * scale}px`;
        }

        // Resize hook
        window.addEventListener("resize", resizeSlideCanvas);

                            <!-- Answer container (Supports seamless interactive click to reveal) -->
                            <div class="space-y-1">
                                <h4 class="text-[9px] font-black tracking-wider text-[#2E6F40] uppercase">論述記述の模範解答</h4>
                                <div class="bg-[#2E6F40]/5 border-l-4 border-[#2E6F40] p-2.5 rounded-r-lg">
                                    <p class="text-xs text-[#2F2924] font-bold leading-relaxed">
                                        ${attachInteractiveRedSheet(aSlide.content)}
                                    </p>
                                </div>
                            </div>

                            <!-- Scientific detailed background comments -->
                            <div class="pt-2 border-t border-[#E6DFD3]/40">
                                <h4 class="text-[9px] font-black tracking-wider text-slate-400 uppercase mb-0.5">背景解説（加点プロセス）</h4>
                                <p class="text-[10px] text-[#5C534C] leading-relaxed bg-[#FAF7F0]/40 p-2.5 rounded border border-[#E6DFD3]/30">${aSlide.explanation}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            elements.studyContainer.innerHTML = html;

            // Math parser implementation inside study tab
            renderMathInElement(elements.studyContainer, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }

        function attachInteractiveRedSheet(text) {
            // Adds seamless click toggle action directly to matching tags for perfect mobile touchscreen support
            return text.replace(/class='red-sheet-hide'/g, "class='red-sheet-hide' onclick='this.classList.toggle(\"revealed\")'");
        }

        function toggleQuizAccordion(qNum) {
            const body = document.getElementById(`body-acc-${qNum}`);
            const icon = document.getElementById(`icon-acc-${qNum}`);
            const label = document.getElementById(`label-acc-${qNum}`);

            if (body.classList.contains("hidden")) {
                body.classList.remove("hidden");
                icon.classList.add("rotate-180");
                label.textContent = "閉じる";
            } else {
                body.classList.add("hidden");
                icon.classList.remove("rotate-180");
                label.textContent = "開く";
            }
        }

        function toggleRedSheetMode() {
            isRedSheetActive = !isRedSheetActive;
            const container = document.getElementById("study-interactive-wrapper");
            
            if (isRedSheetActive) {
                if (container) container.classList.add("red-sheet-active");
                elements.btnRedSheetSwitch.innerHTML = `<i class="fa-solid fa-eye"></i> <span>赤シート: ON</span>`;
                elements.btnRedSheetSwitch.className = "bg-[#A83E4C] hover:bg-[#8B2635] text-white text-[11px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition duration-150 active:scale-95 shadow-sm";
                triggerToast("赤シートを配置。隠し部分をタップすると解答が表示されます。");
            } else {
                if (container) container.classList.remove("red-sheet-active");
                elements.btnRedSheetSwitch.innerHTML = `<i class="fa-solid fa-eye-slash"></i> <span>赤シート: OFF</span>`;
                elements.btnRedSheetSwitch.className = "bg-[#2E6F40] hover:bg-[#20512D] text-white text-[11px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition duration-150 active:scale-95 shadow-sm";
            }
        }

        // Window load bootstrap initialization
        window.onload = function() {
            renderSlide();
            renderStudyView();
            setTimeout(resizeSlideCanvas, 150);
        };
    </script>
</body>
</html>

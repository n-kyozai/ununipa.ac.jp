<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テスト一覧メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ヘッダーやアクセントのカラー */
        .header-bg { background-color: #005662; }
        .tab-bg { background-color: #e5f1f4; }
        .status-active { background-color: #a0c832; } /* テスト受付中（黄緑） */
        .status-prep { background-color: #4bc0c8; } /* テスト準備中（水色） */
        .status-untested { background-color: #9ca3af; } /* テスト未実施（目立たないグレー） */
    </style>
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto overflow-hidden">
        <div class="flex-grow pb-6 overflow-y-auto">
            <h1 class="text-xl font-bold mb-2 flex justify-between items-end">
                <span>教育制度論 8/3(月)テスト</span>
            </h1>

            <!-- タブメニュー -->
            <div class="flex border-b border-gray-300 mb-4">
                <button id="tab-comprehensive" onclick="switchTab('comprehensive')" class="tab-btn px-6 py-2 font-bold text-gray-800 border-b-2 border-blue-600 transition-colors">
                    総合テスト
                </button>
                <button id="tab-assignments" onclick="switchTab('assignments')" class="tab-btn px-6 py-2 font-bold text-gray-500 hover:text-gray-800 border-b-2 border-transparent transition-colors">
                    課題
                </button>
            </div>

            <!-- 総合テスト用の説明書き -->
            <div id="comprehensive-desc" class="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded mb-4 text-sm">
                💡 <strong>総合テストについて</strong><br>
                レベルが上がるほど、出題される範囲や問題数が増えて、難易度が上がっていきます。
            </div>

            <!-- ドキュメントへのリンク -->
            <div class="mb-4">
                <a href="https://docs.google.com/document/d/1Ot9KxjfHEaz_9TNB7oVWWzTTaRTo9g6RBLF_NHQtsB4/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-4 py-2 bg-gray-50 border border-gray-300 rounded-md text-blue-600 hover:bg-gray-100 hover:text-blue-800 transition-colors text-sm font-bold shadow-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    参考ドキュメントを開く
                </a>
            </div>

            <!-- テスト一覧テーブル -->
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse border border-gray-300 text-center min-w-[500px]">
                    <thead class="bg-gray-100 text-gray-700 whitespace-nowrap">
                        <tr>
                            <th class="border border-gray-300 p-3 font-normal w-1/3">テスト名</th>
                            <th class="border border-gray-300 p-3 font-normal">ステータス</th>
                            <th class="border border-gray-300 p-3 font-normal">合格点数</th>
                            <th class="border border-gray-300 p-3 font-normal">実施</th>
                        </tr>
                    </thead>
                    <tbody id="test-list-body">
                        <!-- ここにJavaScriptでリストが生成されます -->
                    </tbody>
                </table>
            </div>

            <!-- ページネーション -->
            <div class="bg-gray-200 p-2 mt-2 flex justify-center items-center text-sm text-gray-600 gap-4">
                <span id="pagination-info">13件 (1/1)</span>
                <div class="flex gap-3">
                    <span class="text-gray-500">&lt;</span>
                    <span class="text-gray-700 font-bold">1</span>
                    <span class="text-gray-500">&gt;</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 【データ定義】
         * タブごとに表示するデータを分けて管理します。
         */
        const testsData = {
            // 課題タブのデータ
            assignments: [
                { id: 1, name: "第1回課題", status: "active", link: "./test01/index.html", passScore: "5点" },
                { id: 2, name: "第2回課題", status: "active", link: "./test02/index.html", passScore: "5点" },
                { id: 3, name: "第3回課題", status: "active", link: "./test03/index.html", passScore: "5点" },
                { id: 4, name: "第4回課題", status: "active", link: "./test04/index.html", passScore: "5点" },
                { id: 5, name: "第5回課題", status: "active", link: "./test05/index.html", passScore: "5点" },
                { id: 6, name: "第6回課題", status: "active", link: "./test06/index.html", passScore: "10点" },
                { id: 7, name: "第7回課題", status: "active", link: "./test07/index.html", passScore: "10点" },
                { id: 8, name: "第8回課題", status: "active", link: "./test08/index.html", passScore: "10点" },
                { id: 9, name: "第9回課題", status: "active", link: "./test09/index.html", passScore: "10点" },
                { id: 10, name: "第10回課題", status: "active", link: "./test10/index.html", passScore: "10点" },
                { id: 11, name: "第11回課題", status: "active", link: "./test11/index.html", passScore: "20点" },
                { id: 12, name: "第12回課題", status: "active", link: "./test12/index.html", passScore: "20点" },
                { id: 13, name: "第13回課題", status: "active", link: "./test13/index.html", passScore: "20点" },
            ],
            // 総合テストタブのデータ
            comprehensive: [
                { id: "comp_1", name: "レベル1", status: "active", link: "./comp01/index.html", passScore: "5" },
                { id: "comp_2", name: "レベル2", status: "active", link: "./comp02/index.html", passScore: "16" },
                { id: "comp_3", name: "レベル3", status: "active", link: "./comp03/index.html", passScore: "22" },
                { id: "comp_4", name: "レベル4", status: "active", link: "./comp04/index.html", passScore: "33" },
                { id: "comp_5", name: "レベル5", status: "active", link: "./comp05/index.html", passScore: "41" },
                { id: "comp_6", name: "レベル6", status: "active", link: "./comp06/index.html", passScore: "48" },
                { id: "comp_7", name: "レベル7", status: "active", link: "./comp07/index.html", passScore: "52" },
                // レベル8のステータスを "untested" に変更
                { id: "comp_8", name: "レベル8", status: "untested", link: "./comp08/index.html", passScore: "-" },
                { id: "comp_9", name: "レベル9", status: "active", link: "./comp09/index.html", passScore: "61" },
                { id: "comp_10", name: "レベル10", status: "active", link: "./comp10/index.html", passScore: "68" },
                { id: "comp_11", name: "レベル11", status: "active", link: "./comp11/index.html", passScore: "76" },
                { id: "comp_12", name: "レベル12", status: "active", link: "./comp12/index.html", passScore: "85" },
            ]
        };

        // --- テーブル描画・タブ切り替えロジック ---
        let currentTab = 'comprehensive'; // 初期表示するタブを総合テストに変更
        const tbody = document.getElementById('test-list-body');
        const paginationInfo = document.getElementById('pagination-info');

        // テーブルを描画する関数
        function renderTable() {
            tbody.innerHTML = ''; // テーブルの中身を一度リセット
            const currentData = testsData[currentTab]; // 選択中のタブのデータを取得

            currentData.forEach(test => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";

                // ステータスに応じたラベルとクラスの切り分け
                let statusLabel = "テスト準備中";
                let statusClass = "status-prep";
                
                // 各ステータスの判定
                const isActive = test.status === "active";
                const isUntested = test.status === "untested";
                
                // テスト実施可能（リンク有効）とするのは「受付中(active)」のみに制限
                const isAvailable = isActive;

                if (isActive) {
                    statusLabel = "テスト受付中";
                    statusClass = "status-active";
                } else if (isUntested) {
                    statusLabel = "テスト未実施";
                    statusClass = "status-untested";
                }
                
                // 実施不可（準備中・未実施）の場合はリンクを無効化するクラスを付与
                const linkTagOpen = isAvailable 
                    ? `<a href="${test.link}" class="text-blue-600 underline hover:text-blue-800 font-bold">` 
                    : `<span class="text-gray-400 underline cursor-not-allowed">`;
                const linkTagClose = isAvailable ? `</a>` : `</span>`;

                // 実施ボタンのHTML生成（実施可能な場合は有効、それ以外は無効化）
                const btnHtml = isAvailable
                    ? `<a href="${test.link}" class="inline-block border border-gray-400 bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1 rounded text-xs font-bold transition">テスト実施</a>`
                    : `<button disabled class="border border-gray-200 bg-gray-50 text-gray-300 px-4 py-1 rounded text-xs cursor-not-allowed">テスト実施</button>`;

                tr.innerHTML = `
                    <td class="border border-gray-300 p-2 text-left pl-4 whitespace-nowrap">
                        ${linkTagOpen}${test.name}${linkTagClose}
                    </td>
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        <span class="inline-block text-white text-xs px-3 py-1 rounded ${statusClass}">
                            ${statusLabel}
                        </span>
                    </td>
                    <td class="border border-gray-300 p-2 text-gray-600 whitespace-nowrap">
                        ${test.passScore}
                    </td>
                    <td class="border border-gray-300 p-2 whitespace-nowrap">
                        ${btnHtml}
                    </td>
                `;

                tbody.appendChild(tr);
            });

            // ページネーションの件数表示を更新
            paginationInfo.textContent = `${currentData.length}件 (1/1)`;
        }

        // タブをクリックしたときに呼ばれる関数
        function switchTab(tabId) {
            currentTab = tabId;
            
            // すべてのタブの装飾を非アクティブ（グレー）にリセット
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-gray-800', 'border-blue-600');
                btn.classList.add('text-gray-500', 'border-transparent');
            });
            
            // クリックされたタブをアクティブ（青線・黒文字）にする
            const activeBtn = document.getElementById(`tab-${tabId}`);
            activeBtn.classList.remove('text-gray-500', 'border-transparent');
            activeBtn.classList.add('text-gray-800', 'border-blue-600');
            
            // 総合テストタブの場合のみ説明書きを表示
            const descEl = document.getElementById('comprehensive-desc');
            if (tabId === 'comprehensive') {
                descEl.classList.remove('hidden');
            } else {
                descEl.classList.add('hidden');
            }
            
            // テーブルを再描画
            renderTable();
        }

        // ページ読み込み時の初期描画
        renderTable();
    </script>
</body>
</html>

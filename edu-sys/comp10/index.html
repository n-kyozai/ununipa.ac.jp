<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育制度論 レベル10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* フォントサイズ手動切り替え用のスケール変数 */
        :root {
            --font-scale: 1;
        }
        /* htmlの基本フォントサイズをスケールさせることで、Tailwindのrem単位が全体的に拡大縮小する */
        html {
            font-size: calc(16px * var(--font-scale));
        }

        /* ヘッダーやアクセントのカラー */
        .header-bg { background-color: #005b82; }
        
        /* タイマー枠の固定 */
        .timer-box {
            font-variant-numeric: tabular-nums;
        }

        /* 記述式の入力欄スタイル */
        .blank-input {
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 8px 12px;
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            outline: none;
            color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .blank-input:focus {
            border-color: #005b82;
            box-shadow: 0 0 0 2px rgba(0, 91, 130, 0.2);
        }

        /* 選択式のセレクトボックススタイル */
        .blank-select {
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 8px 32px 8px 12px;
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            outline: none;
            color: #333;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            transition: border-color 0.2s;
        }
        .blank-select:focus {
            border-color: #005b82;
        }

        /* サイドバー用カスタムスクロールバー */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Typography classes */
        .fs-base { font-size: calc(1rem * var(--font-scale)) !important; line-height: calc(1.5rem * var(--font-scale)) !important; }
        .fs-lg { font-size: calc(1.125rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-xl { font-size: calc(1.25rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-2xl { font-size: calc(1.5rem * var(--font-scale)) !important; line-height: calc(2rem * var(--font-scale)) !important; }
        .fs-5xl { font-size: calc(3rem * var(--font-scale)) !important; line-height: calc(1) !important; }
        .fs-sm { font-size: calc(0.875rem * var(--font-scale)) !important; line-height: calc(1.25rem * var(--font-scale)) !important; }
    </style>
</head>
<body class="bg-[#e8ecef] text-gray-800 font-sans min-h-screen flex flex-col fs-base transition-none">

    <!-- ドロワーメニュー用オーバーレイ (モバイル用) -->
    <div id="drawer-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity"></div>

    <!-- ドロワーメニュー本体 (モバイル用) -->
    <nav id="drawer-menu" class="fixed inset-y-0 left-0 w-64 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col md:hidden">
        <div class="header-bg text-white p-4 flex justify-between items-center">
            <span class="font-bold fs-base">問題リスト</span>
            <button id="close-menu-btn" class="p-1 hover:bg-white hover:bg-opacity-20 rounded focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <ul id="drawer-list" class="flex-1 overflow-y-auto p-2 custom-scrollbar">
            <!-- JSでリストを生成 -->
        </ul>
    </nav>

    <!-- メインコンテンツ領域 -->
    <main class="flex-1 py-8 px-4 md:px-8 max-w-5xl mx-auto w-full">
        
        <!-- ================= スタート画面 ================= -->
        <section id="start-screen" class="w-full mx-auto">
            
            <div class="bg-white border border-gray-300 w-full mb-6 flex flex-col shadow-sm">
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#005b82] text-white p-3 font-bold flex items-center fs-sm">テスト名</div>
                    <div class="w-2/3 md:w-3/4 p-3 font-bold fs-sm">レベル10</div>
                </div>
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#005b82] text-white p-3 font-bold flex items-center fs-sm">テスト範囲</div>
                    <div class="w-2/3 md:w-3/4 p-3 leading-relaxed fs-sm">第10回授業内容まで</div>
                </div>
                <!-- 出題数のプルダウン選択 -->
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#005b82] text-white p-3 font-bold flex items-center fs-sm">出題数</div>
                    <div class="w-2/3 md:w-3/4 p-3 fs-sm">
                        <select id="question-count-select" class="border border-gray-300 rounded p-1.5 focus:border-[#005b82] outline-none fs-sm">
                            <option value="5">5問</option>
                            <option value="10" selected>10問</option>
                            <option value="20">20問</option>
                            <option value="40">40問</option>
                            <option value="all">全問（68問）</option>
                        </select>
                    </div>
                </div>
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#005b82] text-white p-3 font-bold flex items-center fs-sm">満点</div>
                    <div id="display-score" class="w-2/3 md:w-3/4 p-3 fs-sm">計算中...</div>
                </div>
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#005b82] text-white p-3 font-bold flex items-center fs-sm">テスト時間</div>
                    <div id="display-test-time" class="w-2/3 md:w-3/4 p-3 fs-sm">計算中...</div>
                </div>
                <div class="flex">
                    <div class="w-1/3 md:w-1/4 bg-[#005b82] text-white p-3 font-bold flex items-center fs-sm">問題出題形式</div>
                    <div class="w-2/3 md:w-3/4 p-3 fs-sm">ランダム</div>
                </div>
            </div>

            <div class="mb-8 flex justify-center gap-6 bg-white p-4 rounded border border-gray-200 shadow-sm">
                <span class="font-bold text-gray-700 fs-base">解答形式：</span>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="test-mode" value="descriptive" class="w-4 h-4 text-[#005b82] focus:ring-[#005b82]" checked>
                    <span class="ml-2 text-gray-800 font-medium fs-base">記述式（直接入力）</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="test-mode" value="multiple-choice" class="w-4 h-4 text-[#005b82] focus:ring-[#005b82]">
                    <span class="ml-2 text-gray-800 font-medium fs-base">選択式（ドロップダウン）</span>
                </label>
            </div>

            <div class="flex justify-center gap-4">
                <a href="https://n-kyozai.github.io/ununipa.ac.jp/edu-sys/index.html" class="bg-[#6c757d] hover:bg-gray-600 text-white font-bold py-2.5 px-6 rounded shadow transition fs-base inline-block">
                    テスト一覧へ
                </a>
                <button id="start-btn" class="header-bg hover:bg-[#00476b] text-white font-bold py-2.5 px-8 rounded shadow transition fs-base">
                    テスト開始
                </button>
            </div>
        </section>

        <!-- ================= テスト画面 ================= -->
        <section id="test-screen" class="hidden flex-col md:flex-row gap-4 lg:gap-8 items-start w-full">
            
            <!-- デスクトップ用 左サイドバー -->
            <div id="desktop-sidebar" class="hidden md:flex flex-col gap-2 w-48 shrink-0 max-h-[calc(100vh-8rem)] overflow-y-auto custom-scrollbar pr-2 sticky top-8">
                <!-- JSでサイドバーのボタンを生成 -->
            </div>

            <!-- 右側 メインエリア -->
            <div class="flex-1 w-full flex flex-col">
                
                <!-- ヘッダーバー (レベル10 & 残り時間) -->
                <div class="bg-[#e2e8f0] p-2 md:p-3 rounded border border-gray-300 mb-4 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-2">
                        <!-- モバイル用メニューボタン -->
                        <button id="menu-btn" class="md:hidden p-1.5 rounded bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 transition" aria-label="メニューを開く">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                        <span class="font-bold text-gray-700 ml-1 fs-base">レベル10</span>
                    </div>
                    
                    <div class="flex items-center gap-2 sm:gap-3">
                        <!-- フォントサイズ切り替えボタン -->
                        <button id="font-size-btn" class="border border-gray-400 bg-white rounded px-2 py-1 flex items-center justify-center font-bold text-gray-700 shadow-sm hover:bg-gray-100 focus:outline-none transition" style="font-size: 14px; line-height: 1.2;">
                            ぁあ
                        </button>
                        
                        <!-- 残り時間表示 -->
                        <div class="bg-white px-3 py-1 rounded border border-gray-300 font-bold text-gray-800 flex items-center justify-center timer-container tabular-nums w-32 md:w-40 shrink-0 fs-lg">
                            残り時間 <span id="timer-text" class="ml-1 md:ml-2 font-mono">00:00</span>
                        </div>
                    </div>
                </div>

                <!-- 問題枠 -->
                <div class="bg-white rounded border border-gray-300 shadow-sm flex flex-col mb-4">
                    <!-- タイトル -->
                    <div class="bg-[#e0f2fe] p-3 md:p-4 border-b border-gray-300">
                        <h2 id="question-number-title" class="font-bold text-gray-800 fs-base">
                            <!-- JSで生成 -->
                        </h2>
                    </div>
                    <!-- 問題文と解答欄 -->
                    <div class="p-6 md:p-8 flex flex-col gap-6 md:gap-8">
                        <div id="question-body" class="text-gray-800 leading-relaxed min-h-[60px] fs-lg">
                            <!-- JSで生成 -->
                        </div>
                        
                        <!-- 解答エリア (グレー枠) -->
                        <div class="bg-[#f8fafc] border border-gray-200 rounded p-4 md:p-6">
                            <p id="input-instruction" class="text-gray-700 mb-3 font-medium fs-sm">（　　　）に入る言葉を記述してください：</p>
                            <div id="input-area">
                                <!-- JSで input/select を挿入 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- フッターナビゲーション -->
                <div class="flex justify-between items-center mt-2">
                    <button id="prev-btn" class="bg-[#94a3b8] hover:bg-[#64748b] text-white font-bold py-2 px-8 rounded shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed fs-base">
                        前へ
                    </button>
                    <div class="flex items-center gap-6">
                        <span id="question-progress" class="text-gray-600 font-bold fs-base">1 / 5</span>
                        <button id="next-btn" class="header-bg hover:bg-[#00476b] text-white font-bold py-2 px-8 rounded shadow-sm transition fs-base">
                            次へ
                        </button>
                        <button id="submit-confirm-btn" class="bg-[#a17f1a] hover:bg-[#856814] text-white font-bold py-2 px-8 rounded shadow-sm transition hidden fs-base">
                            テスト提出
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 確認モーダル ================= -->
        <div id="submit-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex justify-center items-center backdrop-blur-sm px-4">
            <div class="bg-white rounded p-8 max-w-sm w-full shadow-2xl text-center mx-4 border border-gray-200">
                <p class="font-bold text-gray-800 mb-8 fs-lg">テストを提出して採点しますか？</p>
                <div class="flex justify-center gap-4">
                    <button id="modal-cancel-btn" class="bg-[#cbd5e1] hover:bg-[#94a3b8] text-gray-800 font-bold py-2.5 px-8 rounded transition fs-base">
                        いいえ
                    </button>
                    <button id="modal-submit-btn" class="bg-[#fbbf24] hover:bg-[#f59e0b] text-gray-900 font-bold py-2.5 px-8 rounded transition fs-base">
                        はい
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= 結果画面 ================= -->
        <section id="result-screen" class="hidden">
            <div class="bg-white rounded-lg shadow-md p-6 md:p-10 text-center mb-6 border border-gray-200">
                <h2 class="font-bold text-gray-800 mb-2 border-b-2 border-[#005b82] pb-2 fs-2xl">採点結果</h2>
                <p class="text-gray-600 mb-2 fs-lg mt-6">あなたの得点</p>
                <div class="font-bold text-[#005b82] mb-4 fs-5xl" id="score-display">
                    -- / --
                </div>
                <p id="time-taken" class="text-gray-600 mb-6 font-medium fs-lg">残り時間: --:--</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-4 md:p-8 mb-8 border border-gray-200">
                <h3 class="font-bold border-b border-gray-300 pb-2 mb-4 fs-lg">詳細</h3>
                <div id="result-details" class="flex flex-col gap-4">
                    <!-- JSで結果詳細を生成 -->
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <a href="https://n-kyozai.github.io/ununipa.ac.jp/edu-sys/index.html" class="bg-[#6c757d] hover:bg-gray-600 text-white font-bold py-3 px-8 rounded shadow transition fs-base inline-block">
                    テスト一覧へ
                </a>
                <button onclick="location.reload();" class="header-bg hover:bg-[#00476b] text-white font-bold py-3 px-8 rounded shadow transition fs-base">
                    もう一度挑戦する
                </button>
            </div>
        </section>

    </main>

    <script>
        // --- データ定義 ---
        // これまでの問題に加え、第10回相当の内容を追加した全68問
        const baseQuestions = [
            // 日本国憲法26条1項
            { title: "日本国憲法第26条 第1項", text: "すべて国民は、法律の定めるところにより、その[HOLE]に応じて、ひとしく教育を受ける権利を有する。", correctAnswer: "能力" },
            { title: "日本国憲法第26条 第1項", text: "すべて国民は、法律の定めるところにより、その能力に応じて、[HOLE]教育を受ける権利を有する。", correctAnswer: "ひとしく" },

            { title: "日本国憲法第26条 第2項", text: "すべて国民は、法律の定めるところにより、その保護する子女に[HOLE]を受けさせる義務を負ふ。", correctAnswer: "普通教育" },
            { title: "日本国憲法第26条 第2項", text: "[HOLE]教育は、これを無償とする。", correctAnswer: "義務" },
            { title: "日本国憲法第26条 第2項", text: "義務教育は、これを[HOLE]とする。", correctAnswer: "無償" },

            // 教育基本法5条
            { title: "教育基本法第5条", text: "国民は、その保護する子に、別に法律で定めるところにより、[HOLE]を受けさせる義務を負う。", correctAnswer: "普通教育" },

            // 教育基本法16条2
            { title: "教育基本法第16条 第2項", text: "国は、全国的な[HOLE]と教育水準の維持向上を図るため、教育に関する施策を総合的に策定し、実施しなければならない。", correctAnswer: "教育の機会均等" },
            { title: "教育基本法第16条 第2項", text: "国は、全国的な教育の機会均等と[HOLE]を図るため、教育に関する施策を総合的に策定し、実施しなければならない。", correctAnswer: "教育水準の維持向上" },
            { title: "教育基本法第16条 第2項", text: "国は、全国的な教育の[HOLE]と教育水準の維持向上を図るため、教育に関する施策を総合的に策定し、実施しなければならない。", correctAnswer: "機会均等" },

            // 学校教育法33条
            { title: "学校教育法第33条", text: "小学校の[HOLE]に関する事項は、第二十九条及び第三十条の規定に従い、文部科学大臣が定める。", correctAnswer: "教育課程" },
            { title: "学校教育法第33条", text: "小学校の教育課程に関する事項は、第二十九条及び第三十条の規定に従い、[HOLE]が定める。", correctAnswer: "文部科学大臣" },

            // 学校教育法34条
            { title: "学校教育法第34条", text: "小学校においては、文部科学大臣の[HOLE]を経た教科用図書又は文部科学省が著作の名義を有する教科用図書を使用しなければならない。", correctAnswer: "検定" },

            // 教科書の発行に関する臨時措置法2条
            { title: "教科書の発行に関する臨時措置法第2条", text: "この法律において「教科書」とは、…教育課程の構成に応じて[HOLE]された教科の主たる教材として、…文部科学大臣の検定を経たもの又は文部科学省が著作の名義を有するものをいう。", correctAnswer: "組織排列" },

            { title: "教科書の発行に関する臨時措置法第2条", text: "この法律において「教科書」とは、…教授の用に供せられる児童又は生徒用図書であつて、文部科学大臣の[HOLE]を経たもの又は文部科学省が著作の名義を有するものをいう。", correctAnswer: "検定" },

            // 義務教育費国庫負担法2条

            { title: "教育基本法第10条 第1項", text: "父母その他の保護者は、子の教育について第一義的責任を有するものであって、生活のために必要な[HOLE]を身に付けさせるとともに、自立心を育成し、心身の調和のとれた発達を図るよう努めるものとする。", correctAnswer: "習慣" },
            { title: "教育基本法第10条 第1項", text: "父母その他の保護者は、子の教育について第一義的責任を有するものであって、生活のために必要な習慣を身に付けさせるとともに、[HOLE]を育成し、心身の調和のとれた発達を図るよう努めるものとする。", correctAnswer: "自立心" },

        // --- 設定値 ---

        // --- 初期化 ---
        function initApp() {
            // 出題数選択の変更イベント
            els.qCountSelect.addEventListener('change', updateStartScreen);
            updateStartScreen(); // 初期表示の反映

            // イベントリスナー登録
            document.getElementById('start-btn').addEventListener('click', startTest);
            
            els.prevBtn.addEventListener('click', () => navigateQuestion(-1));
            els.nextBtn.addEventListener('click', () => navigateQuestion(1));
            
            // モーダル関連
            els.submitConfirmBtn.addEventListener('click', () => {
                els.submitModal.classList.remove('hidden');
            });
            els.modalCancelBtn.addEventListener('click', () => {
                els.submitModal.classList.add('hidden');
            });
            els.modalSubmitBtn.addEventListener('click', () => {
                els.submitModal.classList.add('hidden');
                finishTest();
            });
            
            els.menuBtn.addEventListener('click', openDrawer);
            els.closeMenuBtn.addEventListener('click', closeDrawer);
            els.drawerOverlay.addEventListener('click', closeDrawer);

            // フォントサイズ切り替えイベント
            els.fontSizeBtn.addEventListener('click', () => {
                currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
                const scaleMap = {
                    'normal': 1,
                    'small': 0.85,
                    'xsmall': 0.7,
                    'large': 1.15
                };
                document.documentElement.style.setProperty('--font-scale', scaleMap[fontSizes[currentFontSizeIndex]]);
            });
        }

        // --- スタート画面の表示更新 ---
        function updateStartScreen() {
            const val = els.qCountSelect.value;
            const count = val === 'all' ? baseQuestions.length : parseInt(val, 10);
            
            els.displayScore.textContent = `${count}点`;
            
            totalTimeLimit = count * TIME_PER_QUESTION;
            const minutes = Math.floor(totalTimeLimit / 60);
            const seconds = totalTimeLimit % 60;
            els.displayTestTime.textContent = `${minutes}分${seconds > 0 ? seconds + '秒' : ''}`;
        }

        // --- テスト開始処理 ---
        function startTest() {
            const modeRadios = document.getElementsByName('test-mode');
            for (const radio of modeRadios) {
                if (radio.checked) testMode = radio.value;
            }

            generateQuestions();

            if (parsedQuestions.length === 0) {
                alert("出題可能な問題がありません。");
                return;
            }

            screens.start.classList.add('hidden');
            screens.test.classList.remove('hidden');
            screens.test.classList.add('flex');

            currentQuestionIndex = 0;
            renderQuestion(currentQuestionIndex);
            updateNavigations();
            
            startTimer();
        }

        // --- 問題データの生成 ---
        function generateQuestions() {
            parsedQuestions = [];
            userAnswers = [];

            // すべての正解リスト（ダミー選択肢生成用）
            const allAnswersArray = Array.from(new Set(baseQuestions.map(q => q.correctAnswer)));

            const val = els.qCountSelect.value;
            const count = val === 'all' ? baseQuestions.length : parseInt(val, 10);

            // 問題をランダムにシャッフルして指定数取得
            const shuffledData = [...baseQuestions].sort(() => Math.random() - 0.5);
            const selectedData = shuffledData.slice(0, count);

            selectedData.forEach((q) => {
                let options = [];
                if (q.options) {
                    // 専用の選択肢（分数の問題など）が定義されていればそれを使用
                    options = [...q.options];
                } else {
                    // 定義がなければ正解＋ランダムなダミー3つで4択を作成
                    options = [q.correctAnswer];
                    const dummyOptions = allAnswersArray.filter(a => a !== q.correctAnswer).sort(() => Math.random() - 0.5);
                    options = options.concat(dummyOptions.slice(0, 3)); 
                    options.sort(() => Math.random() - 0.5); 
                }

                parsedQuestions.push({
                    title: q.title,
                    text: q.text,
                    correctAnswer: q.correctAnswer,
                    options: options,
                    forceSelect: q.forceSelect || false
                });
                
                userAnswers.push(""); 
            });
        }

        // --- 問題の描画 ---
        function renderQuestion(index) {
            const q = parsedQuestions[index];
            
            els.qNumberTitle.innerHTML = `【問題 ${index + 1}】<span class="text-sm ml-2 font-normal text-gray-700">（1点）</span>`;
            // プレースホルダー [HOLE] を（　　　）に置換して表示
            const displayText = q.text.replace('[HOLE]', `<span class="font-bold px-1">（　　　）</span>`).replace(/\n/g, '<br>');
            els.qBody.innerHTML = displayText;
            els.qProgress.textContent = `${index + 1} / ${parsedQuestions.length}`;

            // 解答枠の生成
            els.inputArea.innerHTML = '';
            
            // 記述式モードであっても、forceSelectがtrueならプルダウンを強制
            if (testMode === 'descriptive' && !q.forceSelect) {
                els.inputInstruction.textContent = "（　　　）に入る言葉を記述してください：";
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'blank-input fs-base';
                input.value = userAnswers[index];
                
                input.addEventListener('input', (e) => {
                    userAnswers[index] = e.target.value;
                    updateNavigations();
                });
                els.inputArea.appendChild(input);
            } else {
                els.inputInstruction.textContent = "（　　　）に入る言葉を選択してください：";
                const select = document.createElement('select');
                select.className = 'blank-select fs-base';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                defaultOption.textContent = "選択してください";
                select.appendChild(defaultOption);

                q.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (userAnswers[index] === opt) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                select.addEventListener('change', (e) => {
                    userAnswers[index] = e.target.value;
                    updateNavigations();
                });
                els.inputArea.appendChild(select);
            }

            // ボタンの表示制御
            els.prevBtn.disabled = index === 0;
            if (index === parsedQuestions.length - 1) {
                els.nextBtn.classList.add('hidden');
                els.submitConfirmBtn.classList.remove('hidden');
            } else {
                els.nextBtn.classList.remove('hidden');
                els.submitConfirmBtn.classList.add('hidden');
            }
        }

        function navigateQuestion(step) {
            const newIndex = currentQuestionIndex + step;
            if (newIndex >= 0 && newIndex < parsedQuestions.length) {
                currentQuestionIndex = newIndex;
                renderQuestion(currentQuestionIndex);
                updateNavigations(); 
            }
        }

        // --- UIの更新 ---
        function updateNavigations() {
            updateSidebarList();
            updateDrawerList();
        }

        function updateSidebarList() {
            els.desktopSidebar.innerHTML = '';
            parsedQuestions.forEach((q, idx) => {
                const button = document.createElement('button');
                const isActive = idx === currentQuestionIndex;
                
                let baseClass = "text-center px-4 py-2.5 rounded font-medium transition border shadow-sm fs-base ";
                if (isActive) {
                    baseClass += "bg-[#bfdbfe] text-black border-[#93c5fd]"; 
                } else {
                    baseClass += "bg-[#e2e8f0] text-gray-700 border-[#cbd5e1] hover:bg-[#cbd5e1]";
                }
                
                button.className = baseClass;
                button.innerHTML = `【問題${idx + 1}】`;
                
                button.addEventListener('click', () => {
                    currentQuestionIndex = idx;
                    renderQuestion(currentQuestionIndex);
                    updateNavigations();
                });
                
                els.desktopSidebar.appendChild(button);
            });
        }

        function updateDrawerList() {
            els.drawerList.innerHTML = '';
            parsedQuestions.forEach((q, idx) => {
                const li = document.createElement('li');
                const isActive = idx === currentQuestionIndex;
                
                li.className = `p-3 mb-1 rounded cursor-pointer transition fs-base ${isActive ? 'bg-[#bfdbfe] font-bold text-black border border-[#93c5fd]' : 'bg-[#e2e8f0] border border-[#cbd5e1] hover:bg-[#cbd5e1] text-gray-700'}`;
                li.innerHTML = `<div class="text-center">【問題${idx + 1}】</div>`;
                
                li.addEventListener('click', () => {
                    currentQuestionIndex = idx;
                    renderQuestion(currentQuestionIndex);
                    closeDrawer(); 
                    updateNavigations();
                });
                
                els.drawerList.appendChild(li);
            });
        }

        function openDrawer() {
            els.drawerMenu.classList.remove('-translate-x-full');
            els.drawerOverlay.classList.remove('hidden');
        }

        function closeDrawer() {
            els.drawerMenu.classList.add('-translate-x-full');
            els.drawerOverlay.classList.add('hidden');
        }

        // --- タイマー処理 ---
        function startTimer() {
            timeLeft = totalTimeLimit; 
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 10) {
                    els.timerContainer.classList.add('text-red-600');
                    els.timerContainer.classList.remove('text-gray-800');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    els.submitModal.classList.add('hidden'); // モーダルが開いていれば閉じる
                    alert("制限時間終了です！自動的に採点します。");
                    finishTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
            const s = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
            els.timerText.textContent = `${m}:${s}`;
        }

        function normalizeString(str) {
            if (!str) return "";
            return str.replace(/[\s　]/g, '').toLowerCase();
        }

        // --- テスト終了・採点処理 ---
        function finishTest() {
            clearInterval(timerInterval);
            
            let correctCount = 0;
            els.resultDetails.innerHTML = '';

            parsedQuestions.forEach((q, idx) => {
                const userAnswer = userAnswers[idx];
                const isCorrect = normalizeString(userAnswer) === normalizeString(q.correctAnswer);
                if (isCorrect) correctCount++;

                const resultCard = document.createElement('div');
                resultCard.className = `p-4 rounded border-l-4 ${isCorrect ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`;
                
                const icon = isCorrect 
                    ? `<span class="text-green-600 font-bold fs-xl">○ 正解</span>` 
                    : `<span class="text-red-600 font-bold fs-xl">× 不正解</span>`;

                // 正解を埋め込んだテキストを生成
                const correctHtmlText = q.text.replace('[HOLE]', `<span class="font-bold border-b-2 border-gray-400 px-1 text-black">（ ${q.correctAnswer} ）</span>`).replace(/\n/g, '<br>');

                const displayUserAnswer = userAnswer.trim() === "" ? "（未解答）" : userAnswer;

                resultCard.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-gray-800 fs-base">問題 ${idx + 1}: <span class="font-normal text-gray-600 fs-sm">${q.title}</span></h4>
                        ${icon}
                    </div>
                    <div class="text-gray-700 bg-white p-3 rounded border border-gray-200 mb-2 fs-lg">
                        ${correctHtmlText}
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2 fs-sm">
                        <div class="bg-white p-2 rounded border border-gray-100 shadow-sm">
                            <span class="text-gray-500 block fs-sm">あなたの解答</span>
                            <span class="font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}">${displayUserAnswer}</span>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-100 shadow-sm">
                            <span class="text-gray-500 block fs-sm">正解</span>
                            <span class="font-bold text-blue-700">${q.correctAnswer}</span>
                        </div>
                    </div>
                `;
                els.resultDetails.appendChild(resultCard);
            });

            els.scoreDisplay.textContent = `${correctCount}点 / ${parsedQuestions.length}点`;
            
            const timeTakenSec = totalTimeLimit - Math.max(0, timeLeft);
            const tm = Math.floor(timeTakenSec / 60);
            const ts = timeTakenSec % 60;
            els.timeTaken.textContent = `所要時間: ${tm}分 ${ts}秒`;

            screens.test.classList.add('hidden');
            screens.test.classList.remove('flex');
            screens.result.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育法規のふりかえりテスト - 第13回</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ベースとなる青色（第1回からの統一カラー） */
        .theme-bg { background-color: #005682; }
        .theme-text { color: #005682; }
        /* 選択状態用の明るめの青 */
        .theme-bg-light { background-color: #bfdbfe; border-color: #60a5fa; }
        
        /* フォントサイズ手動切り替え用 */
        :root {
            --font-scale: 1;
        }
        .fs-base { font-size: calc(1rem * var(--font-scale)) !important; line-height: calc(1.5rem * var(--font-scale)) !important; }
        .fs-lg { font-size: calc(1.125rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-xl { font-size: calc(1.25rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-2xl { font-size: calc(1.5rem * var(--font-scale)) !important; line-height: calc(2rem * var(--font-scale)) !important; }
        .fs-5xl { font-size: calc(3rem * var(--font-scale)) !important; line-height: calc(1) !important; }
        .fs-sm { font-size: calc(0.875rem * var(--font-scale)) !important; line-height: calc(1.25rem * var(--font-scale)) !important; }

        /* ご要望：答え合わせ（採点結果）画面用の少し小さめのフォントサイズ設定 */
        .result-screen-font {
            font-size: calc(0.875rem * var(--font-scale)) !important;
            line-height: calc(1.35rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-title {
            font-size: calc(1.125rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-score {
            font-size: calc(2.25rem * var(--font-scale)) !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10 fs-base">

    <!-- スタート画面 -->
    <div id="start-screen" class="max-w-5xl mx-auto p-4 pt-8">
        <div class="bg-white border border-gray-300 shadow-sm mb-6">
            <table class="w-full border-collapse">
                <tbody>
                    <tr><th class="w-1/4 theme-bg text-white p-3 border border-gray-300 text-left fs-sm">テスト名</th><td class="p-3 border border-gray-300 font-bold fs-sm">第13回課題</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">テスト説明</th><td class="p-3 border border-gray-300 fs-sm">今週までの教育法規のふりかえり。<br>何回でもできる設定にしているので、必ず満点にすること。</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">合格点数</th><td id="start-pass-score" class="p-3 border border-gray-300 fs-sm">--</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">テスト時間</th><td class="p-3 border border-gray-300 fs-sm">6分</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">問題表示区分</th><td class="p-3 border border-gray-300 fs-sm">一問題表示</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">問題出題形式</th><td class="p-3 border border-gray-300 fs-sm">ランダム</td></tr>
                </tbody>
            </table>
        </div>
        <div class="text-center mt-8 flex justify-center gap-4">
            <a href="https://n-kyozai.github.io/ununipa.ac.jp/edu-sys/index.html" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded shadow transition duration-200 inline-block fs-base">テスト一覧へ</a>
            <button id="start-btn" class="theme-bg hover:bg-blue-800 text-white font-bold py-3 px-12 rounded shadow transition duration-200 fs-base">テスト開始</button>
        </div>
    </div>

    <!-- テスト画面 -->
    <div id="test-screen" class="hidden max-w-5xl mx-auto p-4 flex flex-col md:flex-row gap-6">
        <!-- 左側：問題リスト (PC用) -->
        <div class="hidden md:block w-48 shrink-0">
            <div id="question-nav-list" class="flex flex-col gap-1 max-h-[70vh] overflow-y-auto">
                <!-- JSで生成 -->
            </div>
        </div>

        <!-- 右側：問題エリア -->
        <div class="flex-grow">
            <!-- ヘッダー部分 -->
            <div class="flex justify-between items-center mb-4 bg-gray-200 p-3 rounded border border-gray-300">
                <div class="flex items-center gap-2">
                    <!-- モバイル用メニュー開閉ボタン -->
                    <button id="mobile-menu-btn" class="md:hidden text-gray-700 hover:text-gray-900 focus:outline-none p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <div class="font-bold text-gray-700 fs-base">第13回課題</div>
                </div>
                
                <div class="flex items-center gap-2 sm:gap-3">
                    <!-- フォントサイズ切り替えボタン -->
                    <button id="font-size-btn" class="border border-gray-400 bg-white rounded px-2 py-1 flex items-center justify-center font-bold text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none" style="font-size: 14px; line-height: 1.2;">
                        ぁあ
                    </button>
                    <!-- タイマー位置固定（初期表示を 6:00 に設定） -->
                    <div id="timer-display" class="text-gray-800 font-bold fs-lg bg-white px-3 py-1 rounded shadow-sm border border-gray-300 whitespace-nowrap shrink-0 w-36 text-center tabular-nums">残り時間 6:00</div>
                </div>
            </div>
            
            <div class="border border-gray-300 rounded shadow-sm bg-white mb-6">
                <div id="question-number" class="bg-blue-100 px-4 py-3 border-b border-gray-300 text-gray-800 font-bold fs-base">
                    <!-- 問題番号 -->
                </div>
                <div class="p-6">
                    <p id="question-text" class="mb-8 leading-relaxed fs-lg"></p>
                    <div class="mb-4 bg-gray-50 p-4 border rounded" id="input-container">
                        <!-- JSで入力欄を生成 -->
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center border-t pt-4">
                <button id="prev-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded transition disabled:opacity-50 disabled:cursor-not-allowed fs-base">前へ</button>
                <div class="flex items-center">
                    <span id="progress-text" class="mr-6 text-gray-600 font-bold fs-base">-- / --</span>
                    <button id="next-btn" class="theme-bg hover:bg-blue-800 text-white font-bold py-2 px-6 rounded transition fs-base">次へ</button>
                    <button id="finish-btn" class="hidden bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-2 px-6 rounded shadow transition fs-base">テスト提出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- モバイル用問題一覧ドロワー (左側からスライドイン) -->
    <div id="mobile-nav-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden transition-opacity duration-300"></div>
    <div id="mobile-nav-drawer" class="fixed inset-y-0 left-0 transform -translate-x-full transition-transform duration-300 ease-in-out bg-gray-100 w-64 shadow-xl z-50 md:hidden flex flex-col">
        <div class="flex justify-between items-center p-4 border-b border-gray-300 bg-white">
            <span class="font-bold text-gray-800 fs-base">問題一覧</span>
            <button id="mobile-nav-close" class="text-gray-500 hover:text-gray-800 focus:outline-none p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="mobile-nav-list" class="p-4 flex flex-col gap-2 overflow-y-auto flex-grow">
            <!-- JSで生成 -->
        </div>
    </div>

    <!-- 採点結果画面 (result-screen-fontクラスで全体フォントサイズをやや縮小) -->
    <div id="result-screen" class="hidden max-w-5xl mx-auto p-4 result-screen-font">
        <h2 class="font-bold mb-6 text-gray-800 border-b-2 border-blue-800 pb-2 res-title">採点結果</h2>
        
        <div class="bg-white border border-gray-300 rounded shadow-sm p-6 mb-8 text-center">
            <p class="text-gray-600 mb-2">あなたの得点</p>
            <p id="total-score" class="font-bold theme-text mb-2 res-score">--点 / --点</p>
            <p id="pass-status" class="font-bold"></p>
        </div>

        <div id="result-list" class="space-y-6">
            <!-- JSで結果を生成 -->
        </div>

        <div class="text-center mt-12 mb-8">
            <button id="retry-btn" class="theme-bg hover:bg-blue-800 text-white font-bold py-3 px-12 rounded shadow transition duration-200">もう一度テストを行う（再テスト）</button>
        </div>
    </div>

    <!-- 確認モーダル -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full mx-4">
            <p class="mb-6 text-center font-bold text-gray-800 fs-lg">テストを提出して採点しますか？</p>
            <div class="flex justify-center gap-4">
                <button id="modal-cancel-btn" class="px-6 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition font-bold fs-base">いいえ</button>
                <button id="modal-ok-btn" class="px-6 py-2 bg-yellow-400 text-gray-900 rounded hover:bg-yellow-500 transition font-bold fs-base">はい</button>
            </div>
        </div>
    </div>

    <script>
        // 問題データ（第13回：前半10問 + 後半10問 = 全20問）
        const originalQuestions = [
            { 
                id: 1, 
                type: "text", 
                text: "国及び地方公共団体は、家庭教育の（　　　）を尊重しつつ、保護者に対する学習の機会及び情報の提供その他の家庭教育を支援するために必要な施策を講ずるよう努めなければならない。", 
                answer: "自主性" 
            },
            { 
                id: 2, 
                type: "text", 
                text: "対象学校の校長は、当該対象学校の運営に関して、教育課程の編成その他教育委員会規則で定める事項について基本的な方針を作成し、当該対象学校の学校運営協議会の（　　　）を得なければならない。", 
                answer: "承認" 
            },
            { 
                id: 3, 
                type: "text", 
                text: "すべて国民は、法律の定めるところにより、その（　　　）に応じて、ひとしく教育を受ける権利を有する。", 
                answer: "能力" 
            },
            { 
                id: 4, 
                type: "text", 
                text: "誰一人取り残されず、全ての人の可能性を引き出す（　　　）の実現に向けた教育の推進", 
                answer: "共生社会" 
            },
            { 
                id: 5, 
                type: "text", 
                text: "小学校の（　　　）に関する事項は、第二十九条及び第三十条の規定に従い、文部科学大臣が定める。", 
                answer: "教育課程" 
            },
            { 
                id: 6, 
                type: "text", 
                text: "政府は、教育の振興に関する施策の総合的かつ計画的な推進を図るため、教育の（　　　）に関する施策についての基本的な方針及び講ずべき施策その他必要な事項について、基本的な計画を定め、これを国会に報告するとともに、公表しなければならない。", 
                answer: "振興" 
            },
            { 
                id: 7, 
                type: "text", 
                text: "学校運営協議会は、対象学校の職員の採用その他の（　　　）に関して教育委員会規則で定める事項について、当該職員の任命権者に対して意見を述べることができる。", 
                answer: "任用" 
            },
            { 
                id: 8, 
                type: "text", 
                text: "幼児期の教育は、生涯にわたる（　　　）の基礎を培う重要なものであることにかんがみ、国及び地方公共団体は、幼児の健やかな成長に資する良好な環境の整備その他適当な方法によって、その振興に努めなければならない。", 
                answer: "人格形成" 
            },
            { 
                id: 9, 
                type: "text", 
                text: "校長は、校務をつかさどり、所属職員を（　　　）する。", 
                answer: "監督" 
            },
            { 
                id: 10, 
                type: "text", 
                text: "我々日本国民は、たゆまぬ努力によって築いてきた（　　　）で文化的な国家を更に発展させるとともに、世界の平和と人類の福祉の向上に貢献することを願うものである。", 
                answer: "民主的" 
            },
            { 
                id: 11, 
                type: "text", 
                text: "教育委員会は、教育委員会規則で定めるところにより、その所管に属する学校ごとに、当該学校の運営及び当該運営への必要な支援に関して協議する機関として、（　　　）を置くように努めなければならない。", 
                answer: "学校運営協議会" 
            },
            { 
                id: 12, 
                type: "text", 
                text: "すべて国民は、法律の定めるところにより、その保護する子女に（　　　）を受けさせる義務を負ふ。", 
                answer: "普通教育" 
            },
            { 
                id: 13, 
                type: "text", 
                text: "国は、全国的な教育の（　　　）と教育水準の維持向上を図るため、教育に関する施策を総合的に策定し、実施しなければならない", 
                answer: "機会均等" 
            },
            { 
                id: 14, 
                type: "text", 
                text: "教頭は、校長を助け、校務を（　　　）し、及び必要に応じ児童の教育をつかさどる。", 
                answer: "整理" 
            },
            { 
                id: 15, 
                type: "text", 
                text: "この法律で、学校とは、幼稚園、小学校、中学校、義務教育学校、高等学校、（　　　）、特別支援学校、大学及び高等専門学校とする。", 
                answer: "中等教育学校" 
            },
            { 
                id: 16, 
                type: "text", 
                text: "父母その他の保護者は、子の教育について（　　　）を有するものであって、生活のために必要な習慣を身に付けさせるとともに、自立心を育成し、心身の調和のとれた発達を図るよう努めるものとする。", 
                answer: "第一義的責任" 
            },
            { 
                id: 17, 
                type: "text", 
                text: "国民一人一人が、自己の人格を磨き、豊かな人生を送ることができるよう、その生涯にわたって、あらゆる機会に、あらゆる場所において学習することができ、その（　　　）を適切に生かすことのできる社会の実現が図られなければならない。", 
                answer: "成果" 
            },
            { 
                id: 18, 
                type: "text", 
                text: "小学校には、設置者の定めるところにより、校長の職務の円滑な執行に資するため、（　　　）を置くことができる。", 
                answer: "職員会議" 
            },
            { 
                id: 19, 
                type: "text", 
                text: "小学校においては、文部科学大臣の（　　　）を経た教科用図書又は文部科学省が著作の名義を有する教科用図書を使用しなければならない。", 
                answer: "検定" 
            },
            { 
                id: 20, 
                type: "text", 
                text: "国は、全国的な教育の機会均等と教育水準の（　　　）を図るため、教育に関する施策を総合的に策定し、実施しなければならない", 
                answer: "維持向上" 
            }
        ];

        // 状態変数 (制限時間 6分 = 360秒)
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let timeLeft = 360; 
        let timerInterval = null;
        let currentInputElement = null;

        // フォントサイズ切り替え用の設定
        const fontSizes = ['normal', 'small', 'xsmall', 'large'];
        let currentFontSizeIndex = 0;

        // DOM要素の抽出
        const startScreen = document.getElementById('start-screen');
        const testScreen = document.getElementById('test-screen');
        const resultScreen = document.getElementById('result-screen');
        const inputContainer = document.getElementById('input-container');
        const questionNavList = document.getElementById('question-nav-list');
        const confirmModal = document.getElementById('confirm-modal');
        const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
        const mobileNavDrawer = document.getElementById('mobile-nav-drawer');
        const mobileNavList = document.getElementById('mobile-nav-list');

        // スタート画面に合格満点を動的に割り当て
        document.getElementById('start-pass-score').innerText = `${originalQuestions.length}点`;

        // フォントサイズ切り替えイベント
        document.getElementById('font-size-btn').addEventListener('click', () => {
            currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
            const scaleMap = {
                'normal': 1,
                'small': 0.85,
                'xsmall': 0.7,
                'large': 1.15
            };
            document.documentElement.style.setProperty('--font-scale', scaleMap[fontSizes[currentFontSizeIndex]]);
        });

        // モバイル用メニューの開閉イベント
        function openMobileMenu() {
            mobileNavOverlay.classList.remove('hidden');
            setTimeout(() => {
                mobileNavDrawer.classList.remove('-translate-x-full');
            }, 10);
        }

        function closeMobileMenu() {
            mobileNavDrawer.classList.add('-translate-x-full');
            setTimeout(() => {
                mobileNavOverlay.classList.add('hidden');
            }, 300);
        }

        document.getElementById('mobile-menu-btn').addEventListener('click', openMobileMenu);
        document.getElementById('mobile-nav-close').addEventListener('click', closeMobileMenu);
        mobileNavOverlay.addEventListener('click', closeMobileMenu);

        // 配列をランダムにシャッフル
        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function startTest() {
            questions = shuffleArray(originalQuestions);
            currentQuestionIndex = 0;
            userAnswers = {};
            timeLeft = 360; // 6分設定
            
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            testScreen.classList.remove('hidden');

            renderNavList();
            renderQuestion();
            startTimer();
        }

        // ナビゲーションリスト生成
        function renderNavList() {
            questionNavList.innerHTML = '';
            mobileNavList.innerHTML = '';

            questions.forEach((_, index) => {
                // PC用ナビリスト
                const navItem = document.createElement('div');
                navItem.className = `p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base ${index === currentQuestionIndex ? 'theme-bg-light text-blue-900 border-blue-400' : 'bg-gray-200 border-gray-300 hover:bg-gray-300'}`;
                navItem.innerText = `【問題${index + 1}】`;
                
                navItem.addEventListener('click', () => {
                    if (currentQuestionIndex !== index) {
                        saveAnswer();
                        currentQuestionIndex = index;
                        renderQuestion();
                    }
                });
                questionNavList.appendChild(navItem);

                // モバイル用ドロワー内のナビボタン
                const mobileBtn = document.createElement('button');
                mobileBtn.className = `w-full p-2 border rounded font-bold text-center transition-colors fs-base mb-2 ${index === currentQuestionIndex ? 'bg-blue-100 border-blue-400 text-blue-800' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'}`;
                mobileBtn.innerText = `【問題${index + 1}】`;
                
                mobileBtn.addEventListener('click', () => {
                    if (currentQuestionIndex !== index) {
                        saveAnswer();
                        currentQuestionIndex = index;
                        renderQuestion();
                    }
                    closeMobileMenu(); // タップ後にドロワーを閉じる
                });
                mobileNavList.appendChild(mobileBtn);
            });
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question-number').innerText = `【問題${currentQuestionIndex + 1}】（1点）`;
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${questions.length}`;

            // 解答入力フィールドの構成
            inputContainer.innerHTML = '';
            const label = document.createElement('label');
            label.className = 'block font-bold text-gray-700 mb-2 fs-sm';
            label.innerText = '（　　　）に入る言葉を解答してください：';
            inputContainer.appendChild(label);

            if (q.type === 'select') {
                currentInputElement = document.createElement('select');
                currentInputElement.className = 'shadow-sm border border-gray-400 rounded w-full md:w-1/2 py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 bg-white cursor-pointer fs-base';
                
                q.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt === "選択してください" ? "" : opt;
                    option.innerText = opt;
                    currentInputElement.appendChild(option);
                });
            } else {
                currentInputElement = document.createElement('input');
                currentInputElement.type = 'text';
                currentInputElement.setAttribute('autocomplete', 'new-password'); // モバイルキーボードの自動ポップアップ制限
                currentInputElement.className = 'shadow-sm appearance-none border border-gray-400 rounded w-full md:w-1/2 py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 fs-base';
                
                currentInputElement.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (currentQuestionIndex < questions.length - 1) {
                            document.getElementById('next-btn').click();
                        } else {
                            document.getElementById('finish-btn').click();
                        }
                    }
                });
            }

            currentInputElement.value = userAnswers[q.id] || "";
            currentInputElement.addEventListener('change', saveAnswer);
            currentInputElement.addEventListener('input', saveAnswer);
            inputContainer.appendChild(currentInputElement);
            
            // ナビゲーションの配色の更新
            Array.from(questionNavList.children).forEach((el, idx) => {
                if (idx === currentQuestionIndex) {
                    el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base theme-bg-light text-blue-900 border-blue-400';
                } else {
                    el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base bg-gray-200 border-gray-300 hover:bg-gray-300';
                }
            });
            Array.from(mobileNavList.children).forEach((btn, idx) => {
                if (idx === currentQuestionIndex) {
                    btn.className = 'w-full p-2 border rounded font-bold text-center transition-colors fs-base bg-blue-100 border-blue-400 text-blue-800';
                } else {
                    btn.className = 'w-full p-2 border rounded font-bold text-center transition-colors fs-base bg-white border-gray-300 text-gray-700 hover:bg-gray-50';
                }
            });

            // ボタンの出し分け処理
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === questions.length - 1) {
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('finish-btn').classList.remove('hidden');
            } else {
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('finish-btn').classList.add('hidden');
            }
        }

        function saveAnswer() {
            if (!currentInputElement) return;
            const qId = questions[currentQuestionIndex].id;
            userAnswers[qId] = currentInputElement.value;
        }

        function updateTimerDisplay() {
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            document.getElementById('timer-display').innerText = `残り時間 ${min}:${sec.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    saveAnswer();
                    executeScoring();
                }
            }, 1000);
        }

        function executeScoring() {
            if (timerInterval) clearInterval(timerInterval);
            
            testScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            confirmModal.classList.add('hidden');

            let score = 0;
            const resultContainer = document.getElementById('result-list');
            resultContainer.innerHTML = '';

            // 各問題の丸付け表示とご要望の「少し小さいフォントサイズ」への反映
            questions.forEach((q, index) => {
                const userAnswer = (userAnswers[q.id] || "").trim();
                const isCorrect = userAnswer === q.answer;
                if (isCorrect) score++;

                const itemHtml = `
                    <div class="border border-gray-300 rounded shadow-sm bg-white overflow-hidden">
                        <div class="bg-blue-50 px-4 py-2 border-b border-gray-300 text-gray-800 font-bold flex items-center">
                            ${isCorrect ? '<span class="text-red-600 font-bold mr-2 text-lg">○</span>' : '<span class="text-blue-600 font-bold mr-2 text-lg">×</span>'}
                            【問題${index + 1}】（1点）
                        </div>
                        <div class="p-4 md:p-5">
                            <p class="mb-4 text-gray-800 font-medium">${q.text}</p>
                            <table class="w-full border-collapse">
                                <tbody>
                                    <tr>
                                        <th class="w-1/3 md:w-1/4 theme-bg text-white p-2 border border-gray-300 text-left text-xs">正解</th>
                                        <td class="p-2 border border-gray-300 font-bold text-xs">${q.answer}</td>
                                    </tr>
                                    <tr>
                                        <th class="theme-bg text-white p-2 border border-gray-300 text-left text-xs">学習者解答</th>
                                        <td class="p-2 border border-gray-300 text-xs ${isCorrect ? '' : 'text-red-600 font-bold'}">${userAnswer === "" ? "<span class='text-gray-400'>未解答</span>" : userAnswer}</td>
                                    </tr>
                                    <tr>
                                        <th class="theme-bg text-white p-2 border border-gray-300 text-left text-xs">点数</th>
                                        <td class="p-2 border border-gray-300 text-xs">${isCorrect ? '1' : '0'}点／1点</td>
                                    </tr>
                                    <tr>
                                        <th class="theme-bg text-white p-2 border border-gray-300 text-left text-xs">問題解説</th>
                                        <td class="p-2 border border-gray-300 text-gray-500 text-xs"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                resultContainer.insertAdjacentHTML('beforeend', itemHtml);
            });

            document.getElementById('total-score').innerText = `${score}点 / ${questions.length}点`;
            
            const passStatus = document.getElementById('pass-status');
            if (score === questions.length) {
                passStatus.innerText = "合格！満点です。";
                passStatus.className = "font-bold text-green-600 text-lg";
            } else {
                passStatus.innerText = "不合格。満点を目指して再テストしましょう。";
                passStatus.className = "font-bold text-red-600 text-lg";
            }
        }

        // 各種ボタンのイベントバインド
        document.getElementById('start-btn').addEventListener('click', startTest);
        
        document.getElementById('retry-btn').addEventListener('click', () => {
            startScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            saveAnswer();
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            saveAnswer();
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        document.getElementById('finish-btn').addEventListener('click', () => {
            saveAnswer();
            confirmModal.classList.remove('hidden');
        });
        document.getElementById('modal-cancel-btn').addEventListener('click', () => {
            confirmModal.classList.add('hidden');
        });
        document.getElementById('modal-ok-btn').addEventListener('click', () => {
            executeScoring();
        });

    </script>
</body>
</html>

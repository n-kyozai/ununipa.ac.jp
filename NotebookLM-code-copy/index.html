【最重要ルール（根拠・正確性）】
- 根拠は「NotebookLMに読み込まれたソース」だけ。外部知識・一般論・推測で補完しない。
- ソースに書かれていない固有名詞・数値・日付・断定は作らない。
- 必要情報がソース内にない場合は「ソース内で確認できない」と明記する。

【カスタマイズ（試験対策用デフォルト）】
- 聴衆：教員採用試験の受験生（自分）、および教職を目指す友人
- 目的：試験直前の知識の定着、論理構造（因果関係）の理解、記述問題対策

【スライドデザイン：エリート・スタディ・グラフィック】

- 配色：水彩パステルカラー基調。色が重なる部分に透明感を持たせる
- 強調要素：カラフルな「斜めに貼った手書き風の付箋（黄色、ピンク、青、緑など）」に最重要キーワードを配置

【スライド構成ルール（フロー構造の厳守）】

━━━━━━━━━━━━━━━━━━━━

■前提（必ず理解してから実行すること）

        let toastTimeout;

        function copyPrompt(type) {
            const textToCopy = prompts[type];
            
            // モバイルブラウザなどの制限を回避するため、textareaを使用した確実なコピー手法を採用
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            
            // 画面のスクロールを防ぐためのスタイリング
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.opacity = '0';
            
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                // コピー実行
                const successful = document.execCommand('copy');
                if (successful) {
                    const label = type === 'slide' ? 'スライド用' : 'インフォグラフィック用';
                    showToast(`${label}プロンプトをコピーしました！`);
                } else {
                    alert('コピーに失敗しました。');
                }
            } catch (err) {
                console.error('コピーエラー:', err);
                alert('お使いのブラウザではコピー機能がサポートされていません。');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = message;
            
            // クラスをリセットして再適用
            toast.classList.remove('hidden', 'toast-enter');
            void toast.offsetWidth; // リフローを強制
            toast.classList.add('toast-enter');

            // 既存のタイマーをクリア
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            // 2.5秒後に非表示
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 2500);
        }
    </script>

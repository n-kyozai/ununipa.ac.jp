<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM プロンプトコピー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムアニメーション */
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center justify-center font-sans text-slate-800 overflow-hidden">

    <div class="text-center mb-8 px-4">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-700 mb-2">NotebookLM プロンプトツール</h1>
        <p class="text-sm md:text-base text-slate-500">ボタンを押すだけでプロンプトをクリップボードにコピーします</p>
    </div>

    <div class="w-full max-w-md px-6 space-y-4">
        
        <!-- スライド生成用ボタン -->
        <button onclick="copyPrompt('slide')" class="w-full group relative flex items-center justify-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 border-2 border-blue-100 hover:border-blue-400 focus:outline-none focus:ring-4 focus:ring-blue-100 overflow-hidden">
            <div class="absolute inset-0 bg-blue-50 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
            <div class="relative flex flex-col items-center space-y-3">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                </div>
                <div class="text-center">
                    <h2 class="text-lg font-bold text-slate-700">スライド生成用</h2>
                    <p class="text-xs text-slate-500 mt-1">エリート・スタディ・グラフィック</p>
                </div>
            </div>
        </button>

        <!-- インフォグラフィック生成用ボタン -->
        <button onclick="copyPrompt('info')" class="w-full group relative flex items-center justify-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 border-2 border-emerald-100 hover:border-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-100 overflow-hidden">
            <div class="absolute inset-0 bg-emerald-50 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
            <div class="relative flex flex-col items-center space-y-3">
                <div class="p-3 bg-emerald-100 text-emerald-600 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
                </div>
                <div class="text-center">
                    <h2 class="text-lg font-bold text-slate-700">インフォグラフィック用</h2>
                    <p class="text-xs text-slate-500 mt-1">高密度情報アーキテクチャ</p>
                </div>
            </div>
        </button>

    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm flex items-center space-x-2 hidden z-50 transition-colors duration-300">
        <!-- 成功アイコン -->
        <svg id="toast-icon-normal" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400"><path d="M20 6 9 17l-5-5"/></svg>
        <!-- エラーアイコン -->
        <svg id="toast-icon-error" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-300 hidden"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span id="toast-message">コピーしました</span>
    </div>

    <script>
        // プロンプトデータの定義 (バッククォートをエスケープして修正)
        const prompts = {
            slide: `NotebookLM用カスタム指示文：エリート・スタディ・グラフィック・プロトコル
本指示文は、視覚的な美しさと論理的な分かりやすさを両立させた「エリート・スタディ・グラフィック」スタイルのスライドを生成するためのガイドラインです。

1. デザイン・コンセプト（Design Style）
質感と背景
背景: 「ルーズリーフ（罫線入り）」または「キャンバス地」の温かみのあるテクスチャをベースとする。

描画スタイル: すべての図形、枠線、矢印は「ペンによる手描きスケッチ風」の揺らぎを持たせ、完全な直線や直角を避ける（CSSのborder-radiusによる歪みを使用）。

配色と強調
基本配色: 「水彩パステルカラー」を基調とし、色が重なる部分に透明感（rgba）のある表現を用いる。

最重要キーワード: 「斜めに貼った黄色の付箋」のデザイン内に配置する。

補足・注意点: 「色鉛筆による波線（ピンクや水色）」や「手描き風の吹き出し」を用いて表現する。

2. 構造的ルール（Structural Rules）
フロー構造の厳守
論理の流れ: 時間軸や論理展開がある場合は、必ず「左から右」または「上から下」へのフロー図として構成する。

結合: 各要素は「手書き風の矢印（→）」を用いて論理的に結合し、飛躍がないようにする。

スライド構成の構成要素
タイトルスライド: 学習テーマを象徴するタイトルと、学習者の期待を高めるサブタイトル。

導入スライド: この学習の目的や、現実社会・実務との繋がり（Why it matters）を提示。

メイン解説（フロー）: 概念やプロセスを、段階的なフロー図と手書きイラスト風の図解で説明。

コラム/深掘り: 大手参考書にあるような「豆知識」「歴史的背景」「応用的な視点」を別枠のコラムとして設ける。

重要事項のまとめ: 最後に、覚えておくべき最重要ポイントをチェックリスト形式で整理。

3. コンテンツの質（Content Standard）
大手参考書レベルの専門性: 単なる用語解説ではなく、因果関係（なぜそうなるか）を深く掘り下げて記述する。

論理的網羅性: 提示されたトピックに対し、前提条件から帰結までを漏れなくカバーする。

トーン: 知的で丁寧ながら、学習者の知的好奇心を刺激し、背中を押すような親しみやすい語り口。

4. HTML/CSS実装要件（技術的指示）
基本仕様
レイアウト: 1280px × 720px の固定。

フォント:

見出し：『Yuji Syuku』(Google Fonts) または 『Noto Serif JP』。

本文：『Noto Sans JP』。

CSS装飾ディレクティブ
付箋エフェクト: transform: rotate(-3deg); による自然な傾きと、わずかな box-shadow。

手書き風枠線: border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; などを用いて、手描きの不完全さを再現。

テクスチャ再現:

background-image で微細な紙の質感を付与。

ルーズリーフを模す場合は repeating-linear-gradient で青い横線を、左側に一本の赤い縦線を入れる。

色の透明度: background-color: rgba(x, y, z, 0.7); を多用し、マーカーで塗ったような質感を出す。`,

            // infoプロパティへのカンマを追加し、構文エラーを解消
            info: `# NotebookLM用カスタム指示文：エリート・スタディ・グラフィック・プロトコル

本指示文は、視覚的な美しさと論理的な分かりやすさを両立させた「エリート・スタディ・グラフィック」スタイルのインフォグラフィックを生成するためのガイドラインです。

---

## 1. デザイン・コンセプト（Design Style）

### 質感と背景
- **背景**: 「ルーズリーフ」または「キャンバス地」の温かみのあるテクスチャをベースとする。
- **描画スタイル**: すべての図形、枠線、矢印は「ペンによる手描きスケッチ風」の揺らぎを持たせ、完全な直線や直角を避ける。

### 配色と強調
- **基本配色**: 「水彩パステルカラー」を基調とし、色が重なる部分に透明感のある表現を用いる。
- **最重要キーワード**: 「斜めに貼った黄色の付箋」のデザイン内に配置する。
- **補足・注意点**: 「色鉛筆による波線（ピンクや水色）」や「手描き風の吹き出し」を用いて表現する。

---

## 2. 構造的ルール（Structural Rules）

### フロー構造の厳守
- **論理の流れ**: 時間軸や論理展開がある場合は、必ず「左から右」または「上から下」へのフロー図として構成する。
- **結合**: 各要素は「手書き風の矢印（→）」を用いて論理的に結合し、飛躍がないようにする。

---

## 3. コンテンツの質（Content Standard）

- **大手参考書レベルの専門性**: 単なる用語解説ではなく、因果関係（なぜそうなるか）を深く掘り下げる。
- **実践的アプローチ**: 「現在の理解を助ける図解」に加え、「試験や実務でどう問われるか」という視点を盛り込む。
- **トーン**: 知的で丁寧ながら、学習者の背中を押すような親しみやすい語り口。

---

## 4. HTML/CSS実装要件（技術的指示）

- **レイアウト**: 1280px × 720px の固定。
- **フォント**: 見出しは『Yuji Syuku』や『Noto Serif JP』、本文は『Noto Sans JP』を使用。
- **CSS効果**: 
    - 付箋の \`transform: rotate(-3deg);\` による傾き。
    - 枠線の \`border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;\` 等による手書き風の歪み。
    - \`background-image\` を使用したキャンバス/ルーズリーフのテクスチャ再現。`
        };

        let toastTimeout;

        function copyPrompt(type) {
            const textToCopy = prompts[type];
            
            // モバイルブラウザなどの制限を回避するため、textareaを使用した確実なコピー手法を採用
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            
            // 画面のスクロールを防ぐためのスタイリング
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.opacity = '0';
            
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                // コピー実行
                const successful = document.execCommand('copy');
                if (successful) {
                    const label = type === 'slide' ? 'スライド用' : 'インフォグラフィック用';
                    showToast(`${label}プロンプトをコピーしました！`);
                } else {
                    showToast('コピーに失敗しました。', true);
                }
            } catch (err) {
                console.error('コピーエラー:', err);
                showToast('お使いのブラウザではコピー機能がサポートされていません。', true);
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const iconNormal = document.getElementById('toast-icon-normal');
            const iconError = document.getElementById('toast-icon-error');
            
            toastMessage.textContent = message;
            
            // エラー状態に応じてスタイルとアイコンを切り替え
            if (isError) {
                toast.classList.remove('bg-slate-800');
                toast.classList.add('bg-red-600');
                iconNormal.classList.add('hidden');
                iconError.classList.remove('hidden');
            } else {
                toast.classList.add('bg-slate-800');
                toast.classList.remove('bg-red-600');
                iconError.classList.add('hidden');
                iconNormal.classList.remove('hidden');
            }

            // クラスをリセットしてアニメーションを再適用
            toast.classList.remove('hidden', 'toast-enter');
            void toast.offsetWidth; // リフローを強制
            toast.classList.add('toast-enter');

            // 既存のタイマーをクリア
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            // 2.5秒後に非表示
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 2500);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM プロンプトコピー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムアニメーション */
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center justify-center font-sans text-slate-800 overflow-hidden">

    <!-- ヘッダー部分 -->
    <div class="text-center mb-8 px-4">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-700 mb-2">NotebookLM プロンプトツール</h1>
        <p class="text-sm md:text-base text-slate-500">ボタンを押すだけでプロンプトをクリップボードにコピーします</p>
    </div>

    <!-- ボタンコンテナ -->
    <div class="w-full max-w-md px-6 space-y-4">
        
        <!-- スライド生成用ボタン -->
        <button onclick="copyPrompt('slide')" class="w-full group relative flex items-center justify-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 border-2 border-blue-100 hover:border-blue-400 focus:outline-none focus:ring-4 focus:ring-blue-100 overflow-hidden">
            <div class="absolute inset-0 bg-blue-50 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
            <div class="relative flex flex-col items-center space-y-3">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                </div>
                <div class="text-center">
                    <h2 class="text-lg font-bold text-slate-700">スライド生成用</h2>
                    <p class="text-xs text-slate-500 mt-1">エリート・スタディ・グラフィック</p>
                </div>
            </div>
        </button>

        <!-- インフォグラフィック生成用ボタン -->
        <button onclick="copyPrompt('info')" class="w-full group relative flex items-center justify-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 border-2 border-emerald-100 hover:border-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-100 overflow-hidden">
            <div class="absolute inset-0 bg-emerald-50 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
            <div class="relative flex flex-col items-center space-y-3">
                <div class="p-3 bg-emerald-100 text-emerald-600 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
                </div>
                <div class="text-center">
                    <h2 class="text-lg font-bold text-slate-700">インフォグラフィック用</h2>
                    <p class="text-xs text-slate-500 mt-1">高密度情報アーキテクチャ</p>
                </div>
            </div>
        </button>

    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm flex items-center space-x-2 hidden z-50">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400"><path d="M20 6 9 17l-5-5"/></svg>
        <span id="toast-message">コピーしました</span>
    </div>

    <script>
        // プロンプトデータの定義
        const prompts = {
            slide: `あなたは教員採用試験の学習メンターであり、プレゼンテーションの専門家です。NotebookLMに読み込まれている「ソース（資料・議事録・記事・メモ等）」のみを根拠に、試験直前の復習が完結する「エリート・スタディ・グラフィック」スタイルのスライド・読み原稿を一括で作成してください。※事前の分析や構成案（講義メモ等）はチャット上には出力せず、最終成果物のみを出力してください。【最重要ルール（根拠・正確性）】根拠は「NotebookLMに読み込まれたソース」だけ。外部知識・一般論・推測で補完しない。ソースに書かれていない固有名詞・数値・日付・断定は作らない。必要情報がソース内にない場合は「ソース内で確認できない」と明記する。重要な主張にはどのソースに基づくか根拠を添える。【カスタマイズ（試験対策用デフォルト）】聴衆：教員採用試験の受験生（自分）、および教職を目指す友人目的：試験直前の知識の定着、論理構造（因果関係）の理解、記述問題対策トーン：知的で丁寧ながら、学習者の背中を押す親しみやすい語り口【スライドデザイン：エリート・スタディ・グラフィック】背景：ルーズリーフやキャンバス地の温かみのあるテクスチャスタイル：すべての図形や矢印に「ペンによる手描きスケッチ風」の揺らぎを持たせる配色：水彩パステルカラー基調。色が重なる部分に透明感を持たせる強調要素：カラフルな「斜めに貼った手書き風の付箋（黄色、ピンク、青、緑など）」に最重要キーワードを配置補足要素：色鉛筆による波線や、手描き風の吹き出しを活用【スライド構成ルール（フロー構造の厳守）】時間軸や論理展開は必ず「左から右」または「上から下」へのフロー図とし、以下の構成で組み立てること。タイトル＆導入：学習の目的と全体像メイン解説（フロー）：概念や因果関係をフロー図で説明コラム（深掘り）：歴史的背景などの豆知識演習問題：ソースから出題が予想される記述問題や選択問題を提示解答・解説：答えだけでなく解法のプロセスをフローで解説まとめ：重要事項のチェックリスト━━━━━━━━━━━━━━━━━━━━【内部処理プロセス】（※出力不要・AIの内部思考でのみ実行）━━━━━━━━━━━━━━━━━━━━スライド設計プロセス各スライドについて以下を構成（上記の「スライド構成ルール」に沿うこと）：1）スライドタイトル　2）伝える要点（1〜2行＋根拠）　3）つなぎ（次のスライドへの誘導）
※自己点検を行い、構成を確認したうえで「確定スライド一覧」を内部で保持すること。━━━━━━━━━━━━━━━━━━━━━━━━━━━━【出力指示】★Studio連携の核心★━━━━━━━━━━━━━━━━━━━━━━━━━━━━■前提（必ず理解してから実行すること）事前の「分析メモ」や「プレゼン設計図（講義メモ）」などをチャット欄へ出力することは禁止します。Studio機能はチャットの過去出力を参照できないため、内部処理で作成した確定スライド一覧の全文を、以下の各パラメータ内に直接・完全に書き出すこと。省略・「上記参照」は絶対禁止。■出力1：読み原稿（Studioテーラードレポート生成用）パラメータ：report_type: テレプロンプター読み原稿report_description: プレゼン発表用読み上げ原稿language_code: jadocument_directive: 以下の構成で組み立てるdocument_directiveの構成：（1）冒頭指示：「以下の確定一覧とルールに従い読み原稿を作成せよ。」（2）【原稿ルール】：聴衆・目的・トーンは上記指定を反映。連続テキスト、段落分け。箇条書き不可。新論点の追加禁止。（3）【確定スライド一覧】：内部設計で確定した一覧を一字一句そのまま書き写す。■出力2：スライドデック（Studio生成用）パラメータ：deck_type: presentationlength: dynamiclanguage_code: jauser_steering_prompt: 以下の構成で組み立てるuser_steering_promptの構成：（1）冒頭指示：「以下の確定スライド一覧に厳密に従いスライドを作成せよ。つなぎはスライドに含めないこと。」（2）【デザイン指定】：上記の【スライドデザイン：エリート・スタディ・グラフィック】の内容をそのまま書き写す。HTML/CSSで出力する場合は、transform: rotate(-3deg); や border-radius のランダム値を用いて手書き感と付箋の傾きを実装すること。（3）【確定スライド一覧】：出力1と同一の内容をそのまま書き写す。出力1→出力2の順に実行すること。`,

            info: `あなたは教員採用試験の学習メンターであり、インフォグラフィック作成の専門家です。NotebookLMに読み込まれている「ソース（資料・議事録・記事・メモ等）」のみを根拠に、試験直前の復習が完結する「エリート・スタディ・インフォグラフィック」スタイルの解説グラフィックと読み原稿を一括で作成してください。※事前の分析や構成案（講義メモ等）はチャット上には出力せず、最終成果物のみを出力してください。【最重要ルール（根拠・正確性）】根拠は「NotebookLMに読み込まれたソース」だけ。外部知識・一般論・推測で補完しない。ソースに書かれていない固有名詞・数値・日付・断定は作らない。必要情報がソース内にない場合は「ソース内で確認できない」と明記する。重要な主張にはどのソースに基づくか根拠を添える。【カスタマイズ（試験対策用デフォルト）】聴衆：教員採用試験の受験生（自分）、および教職を目指す友人目的：試験直前の知識の定着、論理構造（因果関係）の理解、全体像の俯瞰トーン：知的で丁寧ながら、学習者の背中を押す親しみやすい語り口【グラフィックデザイン：エリート・スタディ・インフォグラフィック】構造：1枚の縦長キャンバス（スクロールして読む形式）背景：方眼紙やドットグリッドのさりげないパターン（学習ノート風）スタイル：アイソメトリック（等角投影法）を用いた立体的なアイコンや、フラットデザインによるスッキリとした図解配色：信頼感のあるブルーやグリーンを基調とし、アクセントカラー（オレンジや赤）で重要ポイントを強調強調要素：数字（統計データなど）を大きく配置し、視覚的なインパクトを与える補足要素：概念のつながりを示す太い実線や点線の矢印、ポイントをまとめた枠線（角丸）【グラフィック構成ルール（縦スクロール構造の厳守）】視線誘導は必ず「上から下」へのフローとし、以下のセクション構成で組み立てること。ヘッダー：テーマと、このグラフィックで学ぶコアメッセージ（一言で）全体像（マップ）：取り上げる概念の相関図やポジショニングマップメイン解説（フロー/ステップ）：歴史的変遷や因果関係、手順などを上から下へ展開データ/事例（ズームイン）：ソース内の具体的な数値データや事例をアイコンと共に紹介演習・確認：重要なキーワードの穴埋めや、記述ポイントの整理フッター：まとめのチェックリストと、次へのアクション━━━━━━━━━━━━━━━━━━━━【内部処理プロセス】（※出力不要・AIの内部思考でのみ実行）━━━━━━━━━━━━━━━━━━━━グラフィック設計プロセス各セクションについて以下を構成（上記の「グラフィック構成ルール」に沿うこと）：1）セクション見出し　2）配置する図解イメージ（例：AからBへの矢印）　3）伝える要点（1〜2行＋根拠）※自己点検を行い、構成を確認したうえで「確定セクション一覧」を内部で保持すること。━━━━━━━━━━━━━━━━━━━━━━━━━━━━【出力指示】★Studio連携の核心★━━━━━━━━━━━━━━━━━━━━━━━━━━━━■前提（必ず理解してから実行すること）事前の「分析メモ」や「設計図（講義メモ）」などをチャット欄へ出力することは禁止します。Studio機能はチャットの過去出力を参照できないため、内部処理で作成した確定セクション一覧の全文を、以下の各パラメータ内に直接・完全に書き出すこと。省略・「上記参照」は絶対禁止。■出力1：読み原稿（Studioテーラードレポート生成用）パラメータ：report_type: テレプロンプター読み原稿report_description: インフォグラフィック解説用読み上げ原稿language_code: jadocument_directive: 以下の構成で組み立てるdocument_directiveの構成：（1）冒頭指示：「以下の確定一覧とルールに従い読み原稿を作成せよ。」（2）【原稿ルール】：聴衆・目的・トーンは上記指定を反映。グラフィックを上から下へ指差しながら解説するような口調。連続テキスト、段落分け。箇条書き不可。新論点の追加禁止。（3）【確定セクション一覧】：内部設計で確定した一覧を一字一句そのまま書き写す。■出力2：インフォグラフィック（Studio生成用）パラメータ：deck_type: documentlength: dynamiclanguage_code: jauser_steering_prompt: 以下の構成で組み立てるuser_steering_promptの構成：（1）冒頭指示：「以下の確定セクション一覧に厳密に従い、1枚のインフォグラフィックを作成せよ。」（2）【デザイン指定】：上記の【グラフィックデザイン：エリート・スタディ・インフォグラフィック】の内容をそのまま書き写す。HTML/CSSで出力する場合は、各セクションが視覚的に区別できるように背景色や境界線を工夫すること。（3）【確定セクション一覧】：出力1と同一の内容をそのまま書き写す。出力1→出力2の順に実行すること。`
        };

        let toastTimeout;

        function copyPrompt(type) {
            const textToCopy = prompts[type];
            
            // モバイルブラウザなどの制限を回避するため、textareaを使用した確実なコピー手法を採用
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            
            // 画面のスクロールを防ぐためのスタイリング
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.opacity = '0';
            
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                // コピー実行
                const successful = document.execCommand('copy');
                if (successful) {
                    const label = type === 'slide' ? 'スライド用' : 'インフォグラフィック用';
                    showToast(`${label}プロンプトをコピーしました！`);
                } else {
                    alert('コピーに失敗しました。');
                }
            } catch (err) {
                console.error('コピーエラー:', err);
                alert('お使いのブラウザではコピー機能がサポートされていません。');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = message;
            
            // クラスをリセットして再適用
            toast.classList.remove('hidden', 'toast-enter');
            void toast.offsetWidth; // リフローを強制
            toast.classList.add('toast-enter');

            // 既存のタイマーをクリア
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            // 2.5秒後に非表示
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 2500);
        }
    </script>
</body>
</html>

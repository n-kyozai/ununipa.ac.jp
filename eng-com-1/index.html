    <script>

            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

        /* ご要望：切り替えはスムーズNG。一瞬でフォントサイズを切り替えるため、
           フォントサイズ関連にはtransitionを一切設定せず、即時適用します。 */
        html, body, p, span, h1, h2, h3, button, div, td, th {
            transition: none !important;
        }

        /* フォントサイズ定義（htmlのベースサイズを変更することで、remを使用しているすべての文字サイズが連動して一瞬で変わります） */
        html.size-normal { font-size: 16px; }
        html.size-small { font-size: 14px; }
        html.size-xsmall { font-size: 11.5px; }
        html.size-large { font-size: 20px; }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        
        /* タブレット向けタップ時ハイライトの抑制 */
        button, a, div {
            -webkit-tap-highlight-color: transparent;
        }
    </style>

        // 3. UI生成機能

        function generateUnitButtons() {
            const container = document.getElementById('unit-buttons-container');
            container.innerHTML = '';
            
            wordData.forEach(item => {
                const button = document.createElement('button');
                button.id = `unit-btn-${item.unit}`;
                button.onclick = () => {
                    selectUnit(item.unit);
                    toggleSidebar(false); // 選択したら自動でサイドバーを閉じる
                };
                button.className = 'w-full px-4 py-3 text-sm rounded-xl text-left whitespace-nowrap flex items-center justify-between bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700 font-bold border border-slate-200/60 dark:border-slate-700 transition-all duration-150';
                
                let shortTitle = item.title;
                if(shortTitle.length > 25) {
                    shortTitle = shortTitle.substring(0, 22) + '...';
                }

                button.innerHTML = `
                    <span>U${item.unit} ${shortTitle.split(' ').slice(2).join(' ')}</span>
                    <span class="text-xs bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full font-medium">${item.words.length}</span>
                `;
                container.appendChild(button);
            });
        }

                u.words.forEach(w => {
                    filteredWords.push({ ...w, unitNum: u.unit });
                });
            }

                const q = searchQuery.toLowerCase().trim();

                    <!-- カード中央区切り線 -->
                    <div class="w-full h-px bg-slate-100 dark:bg-slate-800/80 my-2"></div>

                    <!-- カード下部: 日本語 -->
                    <div class="mt-1">
                        <span class="text-slate-700 dark:text-slate-200 text-sm md:text-base font-bold leading-relaxed break-words block">
                            ${w.japanese}
                        </span>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        // 4. 操作機能

        // ユニット切り替え
        function selectUnit(unitId) {
            currentUnit = unitId;
            
            // アクティブボタンのスタイル調整
            document.querySelectorAll('#unit-buttons-container button').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'dark:bg-blue-600', 'border-transparent');
                btn.classList.add('bg-slate-50', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-slate-100', 'border-slate-200/60', 'dark:border-slate-700');
            });

            const activeBtn = document.getElementById(`unit-btn-${unitId}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-50', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-slate-100', 'border-slate-200/60', 'dark:border-slate-700');
                activeBtn.classList.add('bg-blue-600', 'text-white', 'border-transparent');
            }

            // 右側の状態表示タイトルの変更
            const viewTitle = document.getElementById('view-title');
            const u = wordData.find(u => u.unit === unitId);
            if (u) {
                viewTitle.innerText = u.title;
            }

            renderWords();
            
            // タブレットでスクロール位置を最上部にリセット
            const container = document.getElementById('cards-container');
            container.scrollTop = 0;
        }

        // サイドバーの開閉トグル
        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (open) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                overlay.classList.add('hidden');
            }
        }

        // 5. フォントサイズの循環変更機能 ("あぁ" ボタン用)
        // 段階：標準(normal) -> 小(small) -> 極小(xsmall) -> 大(large) -> 標準に戻る
        function cycleFontSize() {
            let nextSize = 'normal';
            if (fontSizeMode === 'normal') {
                nextSize = 'small';
            } else if (fontSizeMode === 'small') {
                nextSize = 'xsmall';
            } else if (fontSizeMode === 'xsmall') {
                nextSize = 'large';
            } else if (fontSizeMode === 'large') {
                nextSize = 'normal';
            }

            applyFontSize(nextSize);
        }

        function applyFontSize(size) {
            fontSizeMode = size;
            localStorage.setItem('com_font_size', size);

            // html要素に設定された全てのサイズクラスを一旦削除
            document.documentElement.classList.remove('size-normal', 'size-small', 'size-xsmall', 'size-large');
            
            // クラスを即座に適用（スムーズなし・アニメーションなし）
            document.documentElement.classList.add(`size-${size}`);

            // UI上のインジケーターテキスト更新
            const badge = document.getElementById('font-size-badge');
            if (size === 'normal') badge.innerText = "標準";
            if (size === 'small') badge.innerText = "小";
            if (size === 'xsmall') badge.innerText = "極小";
            if (size === 'large') badge.innerText = "大";
        }

        // 6. 検索処理
        function handleSearch() {
            const input = document.getElementById('search-input');
            searchQuery = input.value;
            
            const clearBtn = document.getElementById('clear-search-btn');
            if (searchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            renderWords();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            searchQuery = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            renderWords();
        }

        // 7. その他のユーティリティ

        // ダークモード切り替え
        // toggleDarkMode() で、Tailwindの「class」ベースのダークモードを瞬時に切り替えます。
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('com_dark', isDark);
        }

        // 簡易トースト表示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 1200);
        }

        // Web Speech API による音声読み上げ (英語)
        function speak(text) {
            if (!('speechSynthesis' in window)) {
                showToast("音声合成に非対応のブラウザです");
                return;
            }

            window.speechSynthesis.cancel();

            let speakText = text.replace(/\(.*\)/g, '').replace(/\.\.\./g, '').trim();
            
            const utterance = new SpeechSynthesisUtterance(speakText);
            utterance.lang = 'en-US';
            utterance.rate = 0.95; // 授業で聞き取りやすいよう、少しだけゆっくりめ

            const voices = window.speechSynthesis.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith('en'));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>

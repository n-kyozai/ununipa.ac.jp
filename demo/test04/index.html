<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第4回 人口学小テスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 画像に合わせた深緑色をテーマカラーに設定 */
        .theme-bg { background-color: #005c42; }
        .theme-bg-hover:hover { background-color: #004531; }
        .theme-text { color: #005c42; }
        .theme-border { border-color: #005c42; }
        .theme-ring:focus { 
            --tw-ring-color: #005c42; 
            border-color: #005c42; 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10">

    <!-- スタート画面 -->
    <div id="start-screen" class="max-w-5xl mx-auto p-4 pt-8">
        <div class="bg-white border border-gray-300 shadow-sm mb-6">
            <table class="w-full text-sm border-collapse">
                <tbody>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left w-1/4">テスト名</th><td class="p-3 border border-gray-300">第4回 人口学小テスト</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left">テスト説明</th><td class="p-3 border border-gray-300">授業終了後、復習問題に取り組んで下さい。</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left">満点</th><td class="p-3 border border-gray-300">3点</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left">コース</th><td class="p-3 border border-gray-300">人口学 (5026)</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left">目次</th><td class="p-3 border border-gray-300">【2026/05/12 5限】</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left">問題表示区分</th><td class="p-3 border border-gray-300">一問題表示</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left">問題出題形式</th><td class="p-3 border border-gray-300">同一</td></tr>
                </tbody>
            </table>
        </div>
        <div class="text-center mt-8 flex justify-center gap-4">
            <a href="https://n-kyozai.github.io/ununipa.ac.jp/demo/index.html" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded shadow transition duration-200 inline-block">テスト一覧へ</a>
            <button id="start-btn" class="theme-bg theme-bg-hover text-white font-bold py-3 px-12 rounded shadow transition duration-200">テスト開始</button>
        </div>
    </div>

    <!-- テスト画面 -->
    <div id="test-screen" class="hidden max-w-5xl mx-auto p-4 flex flex-col md:flex-row gap-6">
        <!-- 左側：問題リスト -->
        <div class="hidden md:block w-48 shrink-0">
            <div id="question-nav-list" class="flex flex-col gap-1">
                <!-- JSで生成 -->
            </div>
        </div>

        <!-- 右側：問題エリア -->
        <div class="flex-grow">
            <!-- 制限時間表示を削除し、タイトルのみ配置 -->
            <div class="mb-4 bg-gray-200 p-3 rounded border border-gray-300">
                <div class="font-bold text-gray-700">第4回 人口学小テスト</div>
            </div>
            
            <div class="border border-gray-300 rounded shadow-sm bg-white mb-6">
                <div id="question-number" class="bg-emerald-50 px-4 py-3 border-b border-gray-300 text-gray-800 font-bold">
                    <!-- 問題番号 -->
                </div>
                <div class="p-6">
                    <p id="question-text" class="text-lg mb-8 leading-relaxed whitespace-pre-wrap"></p>
                    <div class="mb-4 bg-gray-50 p-4 border rounded" id="answer-container">
                        <!-- JSで入力・選択欄を生成 -->
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center border-t pt-4">
                <button id="prev-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded transition disabled:opacity-50 disabled:cursor-not-allowed">前へ</button>
                <div class="flex items-center">
                    <span id="progress-text" class="mr-6 text-gray-600 font-bold">1 / 6</span>
                    <button id="next-btn" class="theme-bg theme-bg-hover text-white font-bold py-2 px-6 rounded transition">次へ</button>
                    <button id="finish-btn" class="hidden bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-2 px-6 rounded shadow transition">テスト提出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 採点結果画面 -->
    <div id="result-screen" class="hidden max-w-5xl mx-auto p-4">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b-2 theme-border pb-2">採点結果</h2>
        
        <div class="bg-white border border-gray-300 rounded shadow-sm p-6 mb-8 text-center">
            <p class="text-lg text-gray-600 mb-2">あなたの得点</p>
            <p id="total-score" class="text-5xl font-bold theme-text mb-2">0点 / 3点</p>
            <p id="pass-status" class="text-xl font-bold"></p>
        </div>

        <div id="result-list" class="space-y-8">
            <!-- JSで結果を生成 -->
        </div>

        <div class="text-center mt-12 mb-8">
            <button id="retry-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-12 rounded shadow transition duration-200">テスト一覧へ戻る</button>
        </div>
    </div>

    <!-- 確認モーダル -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full mx-4">
            <p class="mb-6 text-center text-lg font-bold text-gray-800">テストを提出して採点しますか？</p>
            <div class="flex justify-center gap-4">
                <button id="modal-cancel-btn" class="px-6 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition font-bold">いいえ</button>
                <button id="modal-ok-btn" class="px-6 py-2 bg-yellow-400 text-gray-900 rounded hover:bg-yellow-500 transition font-bold">はい</button>
            </div>
        </div>
    </div>

    <script>
        // 人口学 第4回の問題データ (〇×問題)
        const originalQuestions = [
            { 
                id: 1, 
                point: 0.5,
                pointPerItem: 0.5,
                inputCount: 1,
                ordered: true,
                type: "select",
                options: ["〇", "×"],
                text: "以下の文が正しい場合は〇を、また、以下の文が間違っている場合は×を選択して下さい。\n\n平均年齢は全ての人を若い順に並べて全体のちょうど半分となる人の年齢である。", 
                answer: ["×"],
                displayAnswer: "×",
                explanation: ""
            },
            { 
                id: 2, 
                point: 0.5,
                pointPerItem: 0.5,
                inputCount: 1,
                ordered: true,
                type: "select",
                options: ["〇", "×"],
                text: "以下の文が正しい場合は〇を、また、以下の文が間違っている場合は×を選択して下さい。\n\n人口中央値を求める際に加える少数の値は「0.35」である。", 
                answer: ["×"],
                displayAnswer: "×",
                explanation: ""
            },
            { 
                id: 3, 
                point: 0.5,
                pointPerItem: 0.5,
                inputCount: 1,
                ordered: true,
                type: "select",
                options: ["〇", "×"],
                text: "以下の文が正しい場合は〇を、また、以下の文が間違っている場合は×を選択して下さい。\n\n平均年齢を求める際の分母は「人口×人口中央値」である。", 
                answer: ["×"],
                displayAnswer: "×",
                explanation: ""
            },
            { 
                id: 4, 
                point: 0.5,
                pointPerItem: 0.5,
                inputCount: 1,
                ordered: true,
                type: "select",
                options: ["〇", "×"],
                text: "以下の文が正しい場合は〇を、また、以下の文が間違っている場合は×を選択して下さい。\n\n一般的に、「真の中位数年齢」は不明である。\n※「真の中位数年齢」とは、例えば、No.6の例における2508番目の人の年齢の事である。", 
                answer: ["〇"],
                displayAnswer: "〇",
                explanation: ""
            },
            { 
                id: 5, 
                point: 0.5,
                pointPerItem: 0.5,
                inputCount: 1,
                ordered: true,
                type: "select",
                options: ["〇", "×"],
                text: "以下の文が正しい場合は〇を、また、以下の文が間違っている場合は×を選択して下さい。\n\n中位数年齢を求めるには、中位数所在年齢階級を求める必要がある。", 
                answer: ["〇"],
                displayAnswer: "〇",
                explanation: ""
            },
            { 
                id: 6, 
                point: 0.5,
                pointPerItem: 0.5,
                inputCount: 1,
                ordered: true,
                type: "select",
                options: ["〇", "×"],
                text: "以下の文が正しい場合は〇を、また、以下の文が間違っている場合は×を選択して下さい。\n\n中位数年齢は全ての人を若い順に並べて全体のちょうど半分となる人の年齢である。", 
                answer: ["〇"],
                displayAnswer: "〇",
                explanation: ""
            }
        ];

        // 状態変数
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {}; 

        // DOM要素
        const startScreen = document.getElementById('start-screen');
        const testScreen = document.getElementById('test-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const answerContainer = document.getElementById('answer-container');
        const questionNavList = document.getElementById('question-nav-list');
        const confirmModal = document.getElementById('confirm-modal');

        // テスト開始処理
        function startTest() {
            questions = [...originalQuestions];
            currentQuestionIndex = 0;
            userAnswers = {};
            
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            testScreen.classList.remove('hidden');

            renderNavList();
            renderQuestion();
        }

        // 左側の問題ナビゲーション
        function renderNavList() {
            questionNavList.innerHTML = '';
            questions.forEach((_, index) => {
                const navItem = document.createElement('div');
                navItem.className = `p-2 border rounded font-bold text-center cursor-pointer transition-colors ${index === currentQuestionIndex ? 'bg-emerald-100 border-emerald-400 theme-text' : 'bg-gray-200 border-gray-300 hover:bg-gray-300'}`;
                // 第4回用に【問題1-1】などのフォーマットに変更
                navItem.innerText = `【問題1-${index + 1}】`;
                
                navItem.addEventListener('click', () => {
                    if (currentQuestionIndex !== index) {
                        saveAnswer();
                        currentQuestionIndex = index;
                        renderQuestion();
                    }
                });

                questionNavList.appendChild(navItem);
            });
        }

        // 問題の表示
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question-number').innerText = `【問題1-${currentQuestionIndex + 1}】（${q.point}点）`;
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${questions.length}`;

            // 入力欄の生成
            answerContainer.innerHTML = '';
            const label = document.createElement('label');
            label.className = 'block text-sm font-bold text-gray-700 mb-3';
            label.innerText = q.type === "select" ? '選択肢から回答を選んでください：' : '解答を順番に記述してください：';
            answerContainer.appendChild(label);

            if (q.inputCount) {
                for(let i = 0; i < q.inputCount; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'flex items-center mb-3 w-full';

                    if (q.inputPrefixes && q.inputPrefixes[i]) {
                        const prefix = document.createElement('span');
                        prefix.className = 'font-bold mr-3 text-gray-700 w-6 text-center';
                        prefix.innerText = q.inputPrefixes[i];
                        wrapper.appendChild(prefix);
                    }

                    if (q.type === "select") {
                        const select = document.createElement('select');
                        select.className = 'answer-input multi-input shadow-sm appearance-none border border-gray-400 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-1 theme-ring bg-white cursor-pointer';
                        
                        const defaultOption = document.createElement('option');
                        defaultOption.value = "";
                        defaultOption.innerText = "選択してください";
                        select.appendChild(defaultOption);

                        q.options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt;
                            option.innerText = opt;
                            if (userAnswers[q.id] && userAnswers[q.id][i] === opt) {
                                option.selected = true;
                            }
                            select.appendChild(option);
                        });
                        wrapper.appendChild(select);
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'answer-input multi-input shadow-sm appearance-none border border-gray-400 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-1 theme-ring';
                        input.placeholder = '解答を入力';
                        input.value = (userAnswers[q.id] && userAnswers[q.id][i]) ? userAnswers[q.id][i] : "";
                        wrapper.appendChild(input);
                    }
                    
                    answerContainer.appendChild(wrapper);
                }
            }

            // ナビゲーションの色を更新
            Array.from(questionNavList.children).forEach((el, idx) => {
                if (idx === currentQuestionIndex) {
                    el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors bg-emerald-100 border-emerald-400 theme-text';
                } else {
                    el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors bg-gray-200 border-gray-300 hover:bg-gray-300';
                }
            });

            // ボタンの表示切り替え
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === questions.length - 1) {
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('finish-btn').classList.remove('hidden');
            } else {
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('finish-btn').classList.add('hidden');
            }
        }

        function saveAnswer() {
            const q = questions[currentQuestionIndex];
            if (q.inputCount) {
                const inputs = answerContainer.querySelectorAll('.multi-input');
                userAnswers[q.id] = Array.from(inputs).map(input => input.value);
            }
        }

        function executeScoring() {
            testScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            confirmModal.classList.add('hidden');

            let score = 0;
            let totalPoints = 0;
            const resultContainer = document.getElementById('result-list');
            resultContainer.innerHTML = '';

            questions.forEach((q, index) => {
                totalPoints += q.point;
                let earnedPoint = 0;
                let isCorrect = false;
                let displayUserAnswer = "";

                if (q.inputCount) {
                    const userAnsArray = userAnswers[q.id] || Array(q.inputCount).fill("");
                    let matchCount = 0;

                    if (q.ordered) {
                        q.answer.forEach((correctWord, i) => {
                            const normalize = str => str.replace(/[\s　]/g, '');
                            if (normalize(userAnsArray[i] || "") === normalize(correctWord)) {
                                matchCount++;
                            }
                        });
                    }
                    
                    earnedPoint = matchCount * q.pointPerItem;
                    isCorrect = earnedPoint === q.point; 

                    displayUserAnswer = userAnsArray.map((ans, i) => {
                        const prefix = (q.inputPrefixes && q.inputPrefixes[i]) ? `${q.inputPrefixes[i]} ` : '';
                        const ansText = ans.trim() === "" ? "<span class='text-gray-400'>未解答</span>" : ans;
                        return `${prefix}${ansText}`;
                    }).join('\n');
                }
                
                score += earnedPoint;

                let markHtml = '';
                if (earnedPoint === q.point) {
                    markHtml = '<span class="text-red-600 font-bold text-xl mr-2">○</span>';
                } else if (earnedPoint > 0) {
                    markHtml = '<span class="text-yellow-600 font-bold text-xl mr-2">△</span>';
                } else {
                    markHtml = '<span class="text-blue-600 font-bold text-xl mr-2">×</span>';
                }

                // 解説がない場合は行ごと非表示にする処理を追加
                const explanationHtml = q.explanation ? `
                    <tr>
                        <th class="theme-bg text-white p-2 border border-gray-300 text-left w-1/4">問題解説</th>
                        <td class="p-2 border border-gray-300 text-gray-700 leading-relaxed whitespace-pre-wrap bg-gray-50">${q.explanation}</td>
                    </tr>
                ` : '';

                const itemHtml = `
                    <div class="border border-gray-300 rounded shadow-sm bg-white overflow-hidden">
                        <div class="bg-emerald-50 px-4 py-2 border-b border-gray-300 text-gray-800 font-bold flex items-center">
                            ${markHtml}
                            【問題1-${index + 1}】（${q.point}点）
                        </div>
                        <div class="p-4 md:p-6">
                            <p class="mb-6 text-gray-800 whitespace-pre-wrap">${q.text}</p>
                            <table class="w-full border-collapse text-sm">
                                <tbody>
                                    <tr>
                                        <th class="w-1/4 theme-bg text-white p-2 border border-gray-300 text-left">正解</th>
                                        <td class="p-2 border border-gray-300 font-bold whitespace-pre-wrap">${q.displayAnswer}</td>
                                    </tr>
                                    <tr>
                                        <th class="theme-bg text-white p-2 border border-gray-300 text-left">学習者解答</th>
                                        <td class="p-2 border border-gray-300 whitespace-pre-wrap ${isCorrect ? '' : (earnedPoint > 0 ? 'text-yellow-700 font-bold' : 'text-red-600 font-bold')}">${displayUserAnswer}</td>
                                    </tr>
                                    <!-- 画像に合わせて点数行は非表示にするか、残すか。ここでは残します -->
                                    ${explanationHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                resultContainer.insertAdjacentHTML('beforeend', itemHtml);
            });

            document.getElementById('total-score').innerText = `${score}点 / ${totalPoints}点`;
            
            const passStatus = document.getElementById('pass-status');
            if (score === totalPoints) {
                passStatus.innerText = "満点です。お疲れ様でした。";
                passStatus.className = "text-xl font-bold text-green-600";
            } else {
                passStatus.innerText = "テスト完了です。解説を読んで復習しましょう。";
                passStatus.className = "text-xl font-bold text-gray-800";
            }
        }

        // イベントリスナー
        document.getElementById('start-btn').addEventListener('click', startTest);
        
        document.getElementById('retry-btn').addEventListener('click', () => {
            window.location.href = "https://n-kyozai.github.io/ununipa.ac.jp/demo/index.html";
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            saveAnswer();
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            saveAnswer();
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        answerContainer.addEventListener('change', (e) => {
            if (e.target.classList.contains('answer-input')) {
                saveAnswer();
            }
        });
        
        answerContainer.addEventListener('input', (e) => {
            if (e.target.classList.contains('answer-input') && e.target.tagName !== 'SELECT') {
                saveAnswer();
            }
        });

        document.getElementById('finish-btn').addEventListener('click', () => {
            saveAnswer();
            confirmModal.classList.remove('hidden');
        });

        document.getElementById('modal-cancel-btn').addEventListener('click', () => {
            confirmModal.classList.add('hidden');
        });

        document.getElementById('modal-ok-btn').addEventListener('click', () => {
            executeScoring();
        });

    </script>
</body>
</html>

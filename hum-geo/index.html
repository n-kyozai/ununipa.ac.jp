<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF資料一覧メニュー - 人文地理学概論</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ヘッダーやアクセントのカラー */
        .header-bg { background-color: #005662; }
        .tab-bg { background-color: #e5f1f4; }
        .status-active { background-color: #a0c832; } /* 閲覧可能（黄緑） */
        .status-prep { background-color: #4bc0c8; } /* 準備中（水色） */
    </style>
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto overflow-hidden">
        <div class="flex-grow pb-6 overflow-y-auto">
            <h1 class="text-xl font-bold mb-4 pb-2 border-b border-gray-300 flex justify-between items-end">
                <span>人文地理学概論【篠倉 大樹】</span>
            </h1>

            <!-- PDF資料一覧テーブル -->
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse border border-gray-300 text-center min-w-[500px]">
                    <thead class="bg-gray-100 text-gray-700 whitespace-nowrap">
                        <tr>
                            <th class="border border-gray-300 p-2 font-normal w-1/4">
                                <div class="flex items-center justify-center gap-1 cursor-pointer hover:bg-gray-200 p-1 rounded transition-colors inline-flex">
                                    資料名
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
                                    </svg>
                                </div>
                            </th>
                            <th class="border border-gray-300 p-3 font-normal w-1/6">AI資料</th>
                            <th class="border border-gray-300 p-3 font-normal w-1/6">確認テスト</th>
                            <th class="border border-gray-300 p-3 font-normal w-1/6">ステータス</th>
                            <th class="border border-gray-300 p-3 font-normal w-1/4">備考</th>
                        </tr>
                    </thead>
                    <tbody id="pdf-list-body">
                        <!-- ここにJavaScriptでリストが生成されます -->
                    </tbody>
                </table>
            </div>

            <!-- ページネーション -->
            <div class="bg-gray-200 p-2 mt-2 flex justify-center items-center text-sm text-gray-600 gap-4">
                <span id="pagination-info">14件 (1/1)</span>
                <div class="flex gap-3">
                    <span class="text-gray-500">&lt;</span>
                    <span class="text-gray-700 font-bold">1</span>
                    <span class="text-gray-500">&gt;</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 【講義データ】
         * active: テスト受付中（解説とテストへのリンクが有効）
         * prep: 準備中（リンク無効）
         */
        const courseData = [
            { id: 1, name: "第1回講義資料", status: "active", expLink: "./materials/01_guidance.pdf", testLink: "./test01/index.html", note: "ガイダンス・人文地理学とは" },
            { id: 2, name: "第2回講義資料", status: "active", expLink: "./materials/02_population.pdf", testLink: "./test02/index.html", note: "人口地理学：人口分布と動態" },
            { id: 3, name: "第3回講義資料", status: "active", expLink: "./materials/03_settlement.pdf", testLink: "./test03/index.html", note: "集落地理学：村落と都市" },
            { id: 4, name: "第4回講義資料", status: "prep", expLink: "./materials/04_urban.pdf", testLink: "./test04/index.html", note: "都市地理学：都市システムと内部構造" },
            { id: 5, name: "第5回講義資料", status: "prep", expLink: "./materials/05_agriculture.pdf", testLink: "./test05/index.html", note: "経済地理学：農業と食料" },
            { id: 6, name: "第6回講義資料", status: "prep", expLink: "./materials/06_industry.pdf", testLink: "./test06/index.html", note: "経済地理学：工業と立地" },
            { id: 7, name: "第7回講義資料", status: "prep", expLink: "./materials/07_commerce.pdf", testLink: "./test07/index.html", note: "経済地理学：商業とサービス業" },
            { id: 8, name: "第8回講義資料", status: "prep", expLink: "./materials/08_transportation.pdf", testLink: "./test08/index.html", note: "交通・通信地理学：空間的相互作用" },
            { id: 9, name: "第9回講義資料", status: "prep", expLink: "./materials/09_political.pdf", testLink: "./test09/index.html", note: "政治地理学：国家と国境" },
            { id: 10, name: "第10回講義資料", status: "prep", expLink: "./materials/10_culture.pdf", testLink: "./test10/index.html", note: "文化地理学：言語と宗教" },
            { id: 11, name: "第11回講義資料", status: "prep", expLink: "./materials/11_social.pdf", testLink: "./test11/index.html", note: "社会地理学：生活空間と不平等" },
            { id: 12, name: "第12回講義資料", status: "prep", expLink: "./materials/12_tourism.pdf", testLink: "./test12/index.html", note: "観光地理学：観光地とツーリズム" },
            { id: 13, name: "第13回講義資料", status: "prep", expLink: "./materials/13_environment.pdf", testLink: "./test13/index.html", note: "環境と人間生活：景観と環境問題" },
            { id: 14, name: "第14回講義資料", status: "prep", expLink: "./materials/14_globalization.pdf", testLink: "./test14/index.html", note: "グローバリゼーションと地域課題" },
        ];

        // ページネーション情報の動的更新
        document.getElementById('pagination-info').textContent = `${courseData.length}件 (1/1)`;

        // テーブル本体を生成する処理
        const tbody = document.getElementById('pdf-list-body');

        courseData.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition-colors";

            // ステータスに応じた処理の分岐
            const isActive = item.status === "active";
            const statusLabel = isActive ? "テスト受付中" : "準備中";
            const statusClass = isActive ? "status-active" : "status-prep";
            
            // 解説閲覧ボタンのHTML生成
            const expBtnHtml = isActive
                ? `<a href="${item.expLink}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1 border border-gray-400 bg-white hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm">
                    資料
                   </a>`
                : `<button disabled class="inline-flex items-center justify-center gap-1 border border-gray-200 bg-gray-50 text-gray-400 px-3 py-1.5 rounded text-xs cursor-not-allowed">
                    資料
                   </button>`;

            // 確認テストボタンのHTML生成
            const testBtnHtml = isActive
                ? `<a href="${item.testLink}" class="inline-flex items-center justify-center gap-1 border border-blue-400 bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm">
                    テスト実施
                   </a>`
                : `<button disabled class="inline-flex items-center justify-center gap-1 border border-gray-200 bg-gray-50 text-gray-400 px-3 py-1.5 rounded text-xs cursor-not-allowed">
                    テスト実施
                   </button>`;
                   
            // 下の階層へのリンクURLを動的に生成（例: ./lecture01/）
            const lectureLink = `./lecture${String(item.id).padStart(2, '0')}/`;

            tr.innerHTML = `
                <td class="border border-gray-300 p-3 text-left pl-4 whitespace-nowrap text-gray-800 font-medium">
                    <a href="${lectureLink}" class="text-blue-600 hover:text-blue-800 hover:underline transition-colors">${item.name}</a>
                </td>
                <td class="border border-gray-300 p-2 whitespace-nowrap text-center">
                    ${expBtnHtml}
                </td>
                <td class="border border-gray-300 p-2 whitespace-nowrap text-center">
                    ${testBtnHtml}
                </td>
                <td class="border border-gray-300 p-2 whitespace-nowrap text-center">
                    <span class="inline-block text-white text-xs px-3 py-1 rounded ${statusClass}">
                        ${statusLabel}
                    </span>
                </td>
                <td class="border border-gray-300 p-2 text-gray-600 whitespace-nowrap text-left text-sm">
                    ${item.note}
                </td>
            `;

            tbody.appendChild(tr);
        });
    </script>
</body>
</html>

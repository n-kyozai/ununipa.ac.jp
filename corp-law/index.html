<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テスト一覧メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ヘッダーやアクセントのカラー（既存のカラー設定を継承・拡張） */
        .header-bg { background-color: #005662; }
        .tab-bg { background-color: #e5f1f4; }
        .status-active { background-color: #a0c832; } /* テスト受付中（黄緑） */
        .status-prep { background-color: #4bc0c8; }   /* テスト準備中（水色） */
        
        /* ワーク・ワーク解答用のステータス表示 */
        .work-btn-active {
            background-color: #005662;
            color: #ffffff;
        }
        .work-btn-active:hover {
            background-color: #003d46;
        }

        /* 横スクロールバーの常時表示とスタイリング */
        .custom-scrollbar {
            overflow-x: scroll !important;
            -webkit-overflow-scrolling: touch;
        }
        /* Webkit (Chrome, Safari, Edge) 用スクロールバー設定 */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            display: block;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #005662;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #003d46;
        }
        /* Firefox用スクロールバー設定 */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #005662 #e2e8f0;
        }

        /* モバイル表示時の表示倍率・余白最適化（画面幅が狭い場合に全列が収まるよう自動縮小） */
        @media (max-width: 640px) {
            .mobile-compact-table {
                font-size: 11px;
                line-height: 1.2;
            }
            .mobile-compact-table th,
            .mobile-compact-table td {
                padding: 6px 2px !important;
            }
            .mobile-compact-btn {
                padding: 3px 6px !important;
                font-size: 10px !important;
                white-space: nowrap;
            }
            .mobile-badge {
                padding: 2px 5px !important;
                font-size: 10px !important;
            }
            /* アイコンの縮小 */
            .mobile-icon {
                width: 12px !important;
                height: 12px !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-2 sm:p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-2 sm:p-4 md:p-6">
        <div class="flex-grow pb-2">
            <!-- タイトルヘッダー -->
            <h1 class="text-lg sm:text-xl font-bold mb-4 sm:mb-6 pb-2 sm:pb-3 border-b-2 border-teal-800 text-teal-900">
                会社法 8/4(火)テスト
            </h1>

            <!-- テスト一覧テーブル (スクロールバー常時表示クラス custom-scrollbar を追加) -->
            <div class="w-full custom-scrollbar pb-2">
                <table class="w-full text-xs sm:text-sm border-collapse border border-gray-300 text-center min-w-[520px] mobile-compact-table">
                    <thead class="bg-gray-100 text-gray-700 whitespace-nowrap">
                        <tr>
                            <!-- 1. テスト名 -->
                            <th class="border border-gray-300 p-1.5 sm:p-3 font-medium text-left pl-3 sm:pl-4">
                                <div class="flex items-center gap-0.5 sm:gap-1 cursor-pointer hover:bg-gray-200 p-0.5 sm:p-1 rounded transition-colors inline-flex">
                                    テスト名
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 sm:h-4 sm:w-4 text-gray-400 mobile-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
                                    </svg>
                                </div>
                            </th>
                            <!-- 2. ステータス -->
                            <th class="border border-gray-300 p-1.5 sm:p-3 font-medium w-20 sm:w-28 whitespace-nowrap">ステータス</th>
                            <!-- 3. 満点 -->
                            <th class="border border-gray-300 p-1.5 sm:p-3 font-medium w-12 sm:w-20 whitespace-nowrap">満点</th>
                            <!-- 4. ワーク -->
                            <th class="border border-gray-300 p-1.5 sm:p-3 font-medium w-20 sm:w-32 whitespace-nowrap">ワーク</th>
                            <!-- 5. ワーク解答 -->
                            <th class="border border-gray-300 p-1.5 sm:p-3 font-medium w-20 sm:w-32 whitespace-nowrap">ワーク解答</th>
                            <!-- 6. テスト実施 -->
                            <th class="border border-gray-300 p-1.5 sm:p-3 font-medium w-24 sm:w-36 whitespace-nowrap">テスト実施</th>
                        </tr>
                    </thead>
                    <tbody id="test-list-body">
                        <!-- JavaScriptにより動的に行が追加されます -->
                    </tbody>
                </table>
            </div>

            <!-- ページネーション -->
            <div class="bg-gray-100 p-2 sm:p-3 mt-4 rounded flex justify-between items-center text-xs sm:text-sm text-gray-600">
                <span id="item-count-info" class="text-[11px] sm:text-sm">全15件 (1/1ページ)</span>
                <div class="flex items-center gap-2 sm:gap-3">
                    <button class="px-2 py-0.5 sm:py-1 border border-gray-300 rounded bg-white text-gray-400 cursor-not-allowed" disabled>&lt;</button>
                    <span class="text-gray-800 font-bold px-2 py-0.5 sm:py-1 bg-teal-50 border border-teal-500 rounded">1</span>
                    <button class="px-2 py-0.5 sm:py-1 border border-gray-300 rounded bg-white text-gray-400 cursor-not-allowed" disabled>&gt;</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 【テストデータ構成】
         * - id: 一意のID
         * - name: テスト名
         * - status: テスト実施のステータス ("active" | "prep")
         * - passScore: 満点
         * - link: テスト実施のリンク
         * - workStatus: ワークのステータス ("prep" | "active") *デフォルト: prep
         * - workLink: ワークファイルのリンク
         * - workAnsStatus: ワーク解答のステータス ("prep" | "active") *デフォルト: prep
         * - workAnsLink: ワーク解答ファイルのリンク
         */
        const testsData = [
            { 
                id: 1, 
                name: "第1回授業の復習", 
                status: "active", 
                passScore: "10点", 
                link: "./test01/index.html", 
                workStatus: "active", 
                workLink: "https://drive.google.com/file/d/1clcHyDRbCSIpeDEjjygbmInqLDsUpfTg/view?usp=sharing", 
                workAnsStatus: "active", 
                workAnsLink: "https://drive.google.com/file/d/15WcGYNMWsDGwKRTgBgp5LsvRgiydrNKJ/view?usp=sharing" 
            },
            { 
                id: 2, 
                name: "第2回授業の復習", 
                status: "active", 
                passScore: "10点", 
                link: "./test02/index.html", 
                workStatus: "active", 
                workLink: "https://drive.google.com/file/d/1ibBQ8daxeypoLsgLE_HaiZS89ZZ115h3/view?usp=sharing", 
                workAnsStatus: "active", 
                workAnsLink: "https://drive.google.com/file/d/1UzlgBhsNeVFC9dPFXffltbImYiNAd4eI/view?usp=sharing" 
            },
            { 
                id: 3, 
                name: "第3回授業の復習", 
                status: "active", 
                passScore: "10点", 
                link: "./test03/index.html", 
                workStatus: "active", 
                workLink: "https://drive.google.com/file/d/1_GW7zDm6OtVFomBdXFtGOptO3NjlAFEU/view?usp=sharing", 
                workAnsStatus: "active", 
                workAnsLink: "https://drive.google.com/file/d/1Ow66wGyE2V6PRuBAFsxpvPl5wZG8DPp7/view?usp=sharing" 
            },
            { id: 4, name: "第4回授業の復習", status: "active", passScore: "10点", link: "./test04/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1O3TkmdcZTuIjHoyCWDtlKPNWtYyrEGO2/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/1eWMZV4b-tydhxH_ol21Bgl5oAGAg7I_G/view?usp=sharing" },
            { id: 5, name: "第5回授業の復習", status: "active", passScore: "10点", link: "./test05/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1Yw96CTzq86cZ4sqoY1e4oEFs6u5YnVxt/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/1tBb0GEkk9OXryY3hXAPitZGfqB7lvJXd/view?usp=sharing" },
            { id: 6, name: "第6回授業の復習", status: "active", passScore: "10点", link: "./test06/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/10Zc5xUfTVkw-oaTkoQpdpNF4kTAM4H2-/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/1xpwmPccgA7mxLjyrbZUUmXahn24h8gN6/view?usp=sharing" },
            { id: 7, name: "第7回授業の復習", status: "prep", passScore: "10点", link: "./test07/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1u8dgLOs9bLVtJsMHMGZcjQdRS7Tu8ttP/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/1kpjBz4KJ5rDoREoCqdMqX2ieqaDZCH-C/view?usp=sharing" },
            { id: 8, name: "第8回授業の復習", status: "active", passScore: "10点", link: "./test08/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1k12jSa7fP8hFxeIx657v3QcZHMcEsFOb/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/13RzoaY4LVd14aa4G9j_5ck1swUbf7CzH/view?usp=sharing" },
            { id: 9, name: "第9回授業の復習", status: "active", passScore: "10点", link: "./test09/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1c7X5WADna7YsNPTHiX-DvFepCsgZ4XXG/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/1O_b6_IFBIx98othyWs_PKwyJqT9zX9Ar/view?usp=sharing" },
            { id: 10, name: "第10回授業の復習", status: "active", passScore: "10点", link: "./test10/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/17hwidFEmSZeUFS32c0uRj5IkxxICMWgi/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/1BW3OmGneeENo7BuR2His5rWtrQp--8aN/view?usp=sharing" },
            { id: 11, name: "第11回授業の復習", status: "active", passScore: "10点", link: "./test11/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1Iz95R4ny8Urm85Dgmf6xCO5KQPXHCxc3/view?usp=sharing", workAnsStatus: "active", workAnsLink: "https://drive.google.com/file/d/1dzgIb0cJJI42tLCROtUU5PhsTLqsI-y9/view?usp=sharing" },
            { id: 12, name: "第12回授業の復習", status: "active", passScore: "10点", link: "./test12/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1S1tEI3ukNtx-P2NDboVuw2YB5QcNKyEB/view?usp=sharing", workAnsStatus: "prep", workAnsLink: "https://drive.google.com/file/d/1OX3JJgXQ-h02j0r-RiyxymIdGTdAk5d2/view?usp=sharing" },
            { id: 13, name: "第13回授業の復習", status: "active", passScore: "10点", link: "./test13/index.html", workStatus: "active", workLink: "https://drive.google.com/file/d/1EgrLhnZKZU4HEo6kDacgyj3r7zz6cAtE/view?usp=sharing", workAnsStatus: "prep", workAnsLink: "https://drive.google.com/file/d/1k4uXyNOuU_jq9E58aI7MlP9VyBJ5Dux2/view?usp=sharing" },
            { id: 14, name: "第14回授業の復習", status: "prep", passScore: "10点", link: "./test14/index.html", workStatus: "prep", workLink: "#", workAnsStatus: "prep", workAnsLink: "#" },
            { id: 15, name: "まとめのテスト対策", status: "prep", passScore: "-", link: "./test15/index.html", workStatus: "prep", workLink: "#", workAnsStatus: "prep", workAnsLink: "#" },
        ];

        const tbody = document.getElementById('test-list-body');

        testsData.forEach(test => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-teal-50/40 transition-colors border-b border-gray-200";

            // 1. テスト実施ステータスの判定
            const isTestActive = test.status === "active";
            const statusLabel = isTestActive ? "受付中" : "準備中";
            const statusClass = isTestActive ? "status-active" : "status-prep";

            // テスト名のリンク判定
            const testNameHtml = isTestActive 
                ? `<a href="${test.link}" class="text-blue-600 underline hover:text-blue-800 font-bold transition-colors">${test.name}</a>` 
                : `<span class="text-gray-600">${test.name}</span>`;

            // 2. ワーク（課題）ボタンの生成（prep / active）
            const isWorkActive = (test.workStatus || "prep") === "active";
            const workBtnHtml = isWorkActive
                ? `<a href="${test.workLink || '#'}" target="_blank" class="inline-flex items-center justify-center gap-0.5 sm:gap-1 work-btn-active text-xs font-medium px-2 sm:px-3 py-1 sm:py-1.5 rounded transition shadow-sm mobile-compact-btn">
                    <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5 mobile-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    ワーク
                   </a>`
                : `<span class="inline-block border border-gray-200 bg-gray-100 text-gray-400 text-xs px-2 sm:px-3 py-1 sm:py-1.5 rounded mobile-compact-btn">準備中</span>`;

            // 3. ワーク解答ボタンの生成（prep / active）
            const isWorkAnsActive = (test.workAnsStatus || "prep") === "active";
            const workAnsBtnHtml = isWorkAnsActive
                ? `<a href="${test.workAnsLink || '#'}" target="_blank" class="inline-flex items-center justify-center gap-0.5 sm:gap-1 border border-teal-600 text-teal-700 hover:bg-teal-50 text-xs font-medium px-2 sm:px-3 py-1 sm:py-1.5 rounded transition shadow-sm mobile-compact-btn">
                    <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5 mobile-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    解答
                   </a>`
                : `<span class="inline-block border border-gray-200 bg-gray-100 text-gray-400 text-xs px-2 sm:px-3 py-1 sm:py-1.5 rounded mobile-compact-btn">準備中</span>`;

            // 4. テスト実施ボタンの生成
            const testBtnHtml = isTestActive
                ? `<a href="${test.link}" class="inline-block border border-gray-400 bg-gray-100 hover:bg-gray-200 text-gray-800 px-2 sm:px-4 py-1 sm:py-1.5 rounded text-xs font-bold transition shadow-sm mobile-compact-btn">テスト実施</a>`
                : `<button disabled class="border border-gray-200 bg-gray-50 text-gray-300 px-2 sm:px-4 py-1 sm:py-1.5 rounded text-xs cursor-not-allowed mobile-compact-btn">テスト実施</button>`;

            // テーブルセルを順序通り組み立て
            tr.innerHTML = `
                <!-- 1. テスト名 -->
                <td class="border border-gray-300 p-1.5 sm:p-3 text-left pl-2 sm:pl-4">
                    ${testNameHtml}
                </td>
                <!-- 2. ステータス -->
                <td class="border border-gray-300 p-1 sm:p-2 whitespace-nowrap">
                    <span class="inline-block text-white text-xs px-2 sm:px-3 py-0.5 sm:py-1 rounded-full font-medium ${statusClass} mobile-badge">
                        ${statusLabel}
                    </span>
                </td>
                <!-- 3. 満点 -->
                <td class="border border-gray-300 p-1 sm:p-2 text-gray-700 font-medium whitespace-nowrap">
                    ${testPassScore(test.passScore)}
                </td>
                <!-- 4. ワーク -->
                <td class="border border-gray-300 p-1 sm:p-2">
                    ${workBtnHtml}
                </td>
                <!-- 5. ワーク解答 -->
                <td class="border border-gray-300 p-1 sm:p-2">
                    ${workAnsBtnHtml}
                </td>
                <!-- 6. テスト実施 -->
                <td class="border border-gray-300 p-1 sm:p-2">
                    ${testBtnHtml}
                </td>
            `;

            tbody.appendChild(tr);
        });

        // スコア表示用ヘルパー
        function testPassScore(score) {
            return score ? score : "-";
        }
    </script>
</body>
</html>

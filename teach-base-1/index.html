<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教職・専門教科 対策メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ヘッダーやアクセントのカラー */
        .header-bg { background-color: #005662; }
        /* 分野タブの洗練されたチップ型スタイル（ボタン同士の独立性を向上） */
        .tab-active { 
            background-color: #005662; 
            color: #ffffff; 
            border: 1px solid #005662;
            box-shadow: 0 1px 3px rgba(0, 86, 98, 0.2);
            font-weight: 700;
        }
        .tab-inactive { 
            background-color: #ffffff; 
            color: #475569; 
            border: 1px solid #e2e8f0;
            font-weight: 500;
        }
        .tab-inactive:hover { 
            background-color: #f8fafc; 
            color: #0f172a;
            border-color: #cbd5e1;
        }
        .status-active { background-color: #a0c832; } /* テスト受付中（黄緑） */
        .status-prep { background-color: #4bc0c8; }   /* テスト準備中（水色） */
        
        /* コンパクトかつ独立した教科ボタンスタイル */
        .course-btn-active {
            background-color: #005662;
            color: #ffffff;
            border: 1px solid #005662;
            box-shadow: 0 2px 4px rgba(0, 86, 98, 0.18);
            font-weight: 700;
        }
        .course-btn-inactive {
            background-color: #ffffff;
            color: #475569;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            font-weight: 600;
        }
        .course-btn-inactive:hover {
            color: #0f172a;
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }
        /* スクロールバーの非表示（モバイル横スクロール用） */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 本の立体風ジャケットのスタイル */
        .book-spine-shadow {
            box-shadow: inset 4px 0 6px -2px rgba(0, 0, 0, 0.35), 2px 4px 10px rgba(0, 0, 0, 0.15);
        }
        /* モバイルタッチ操作の最適化 */
        .touch-action-manipulation {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen p-3 sm:p-6 md:p-8 touch-action-manipulation">

    <div class="max-w-4xl mx-auto overflow-hidden">
        <div class="flex-grow pb-6">
            <!-- サイト最上部ヘッダー（タイトル＆キャッチコピー） -->
            <header class="mb-4 sm:mb-5 pb-3 border-b border-slate-200">
                <h1 class="text-lg sm:text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2" id="site-main-heading">
                    <span class="w-2 sm:w-2.5 h-5 sm:h-6 rounded bg-[#005662] inline-block shrink-0"></span>
                    教職・専門教科 対策メニュー
                </h1>
                <p class="text-[11px] sm:text-xs text-slate-400 mt-1 font-normal leading-relaxed pl-4 sm:pl-4.5 tracking-tight">
                    いつでもどこでも重いテキストを持ち歩かずに問題演習ができ、確認テストもオンラインで手軽に実施できます。
                </p>
            </header>

            <!-- 区分・教科の選択（スリム＆コンパクトな独立ボタングリッド） -->
            <div class="mb-4 pt-0.5">
                <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 pl-0.5 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#005662]"></span>
                    教科・対策区分の選択
                </div>
                <nav class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="course-switcher" aria-label="教科選択">
                    <button type="button" 
                            onclick="changeCourse('kyoshoku')" 
                            data-course="kyoshoku"
                            class="course-switch-btn course-btn-active relative px-2.5 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                        </svg>
                        <span class="text-xs sm:text-sm truncate">教職教養</span>
                    </button>

                    <button type="button" 
                            onclick="changeCourse('chugaku-syakai')" 
                            data-course="chugaku-syakai"
                            class="course-switch-btn course-btn-inactive relative px-2.5 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                        <span class="text-xs sm:text-sm truncate">中学社会</span>
                    </button>

                    <button type="button" 
                            onclick="changeCourse('koukou-chirekikoumin')" 
                            data-course="koukou-chirekikoumin"
                            class="course-switch-btn course-btn-inactive relative px-2.5 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        <span class="text-xs sm:text-sm truncate">高校社会</span>
                    </button>

                    <button type="button" 
                            onclick="changeCourse('chukou-kanzen')" 
                            data-course="chukou-kanzen"
                            class="course-switch-btn course-btn-inactive relative px-2.5 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138z" />
                        </svg>
                        <span class="text-xs sm:text-sm truncate">完全攻略</span>
                    </button>
                </nav>
            </div>

            <!-- タイトル表示エリア（題名のみにスッキリ化） -->
            <div class="mb-3.5 pb-2 border-b border-gray-300">
                <h1 class="text-lg sm:text-xl font-bold text-gray-800" id="main-title">
                    教職教養 対策メニュー
                </h1>
            </div>

            <!-- タブメニュー（独立したチップボタンで横スクロール） -->
            <div class="flex overflow-x-auto no-scrollbar gap-2 mb-3.5 pb-1.5 pt-0.5 sm:flex-wrap items-center" id="tabs-container">
                <!-- JavaScriptでタブが動的に生成されます -->
            </div>

            <!-- 教職教養基礎Ⅱ専用：復習問題 / PDF資料 切替サブタブ（モバイル折り返し防止） -->
            <div id="kiso2-subtabs-container" class="hidden mb-4 p-1 bg-slate-100/90 rounded-xl border border-slate-200 flex items-center max-w-sm gap-1">
                <button type="button" 
                        id="kiso2-subtab-tests" 
                        onclick="switchKiso2SubTab('tests')" 
                        class="flex-1 py-1.5 px-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 bg-white text-[#005662] shadow-xs whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    復習問題
                </button>
                <button type="button" 
                        id="kiso2-subtab-pdf" 
                        onclick="switchKiso2SubTab('pdf')" 
                        class="flex-1 py-1.5 px-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-1 text-slate-600 hover:text-slate-900 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                    </svg>
                    <span>PDF資料一覧</span>
                    <span class="px-1.5 py-0.2 text-[9px] font-extrabold rounded-full bg-red-100 text-red-600 shrink-0">全6教材</span>
                </button>
            </div>

            <!-- 教職教養基礎Ⅱ専用：PDF資料グリッド（6つのボタン） -->
            <div id="kiso2-pdf-grid-container" class="hidden mb-6">
                <div class="text-xs font-semibold text-slate-500 mb-2.5 flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    PDF教材一覧（閲覧・ダウンロード）
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5" id="kiso2-pdf-buttons">
                    <!-- JavaScriptで動的生成されます -->
                </div>
            </div>

            <!-- モバイル向け横スクロール案内ヒント（PCでは非表示） -->
            <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1.5 px-0.5 sm:hidden" id="mobile-scroll-hint">
                <span class="flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                    表は左右にスクロールできます
                </span>
                <span class="text-[10px] text-slate-400">右端: テスト実施</span>
            </div>

            <!-- テスト一覧テーブル（全画面幅で表形式を維持・横スクロール対応） -->
            <div class="overflow-x-auto rounded-lg border border-gray-300 shadow-2xs" id="table-container">
                <table class="w-full text-sm border-collapse text-center min-w-[620px]">
                    <thead class="bg-gray-100 text-gray-700 whitespace-nowrap">
                        <tr>
                            <th class="border-b border-r border-gray-300 p-2.5 sm:p-3 font-normal w-1/4">確認テスト</th>
                            <th class="border-b border-r border-gray-300 p-2.5 sm:p-3 font-normal w-20">PDF</th>
                            <th id="th-two-in-one" class="border-b border-r border-gray-300 p-2.5 sm:p-3 font-normal w-20">2in1</th>
                            <th class="border-b border-r border-gray-300 p-2.5 sm:p-3 font-normal">ステータス</th>
                            <th class="border-b border-r border-gray-300 p-2.5 sm:p-3 font-normal">合計点数</th>
                            <th class="border-b border-gray-300 p-2.5 sm:p-3 font-normal">テスト実施</th>
                        </tr>
                    </thead>
                    <tbody id="test-list-body" class="divide-y divide-gray-200">
                        <!-- ここにJavaScriptでリストが生成されます -->
                    </tbody>
                </table>
            </div>

            <!-- ページネーション -->
            <div class="bg-gray-200 p-2 mt-3 flex justify-center items-center text-xs sm:text-sm text-gray-600 gap-4 rounded-md" id="pagination-container">
                <span id="pagination-info">0件 (1/1)</span>
                <div class="flex gap-3">
                    <span class="text-gray-500">&lt;</span>
                    <span class="text-gray-700 font-bold">1</span>
                    <span class="text-gray-500">&gt;</span>
                </div>
            </div>

            <!-- 現在選択中の書籍セクション（モバイル最適化） -->
            <section class="mt-6 pt-5 border-t border-slate-200" aria-label="選択中の書籍情報">
                <div class="flex items-center mb-2.5">
                    <h2 class="text-xs sm:text-sm font-bold text-slate-700 flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#005662]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                        現在選択中の書籍
                    </h2>
                </div>

                <!-- 書籍情報カード本体（レスポンシブ） -->
                <div id="selected-book-card" class="bg-gradient-to-br from-slate-50 to-slate-100/70 border border-slate-200 rounded-xl p-3.5 sm:p-4 shadow-sm flex flex-col sm:flex-row items-center sm:items-start gap-3 sm:gap-4 transition-all">
                    <!-- 書籍カバー画像（JavaScriptで動的に更新） -->
                    <div id="book-cover-container" class="shrink-0 flex justify-center">
                        <!-- ここに書籍のブックジャケットが描画されます -->
                    </div>

                    <!-- 書籍詳細テキスト -->
                    <div class="flex-grow text-center sm:text-left space-y-1.5 w-full">
                        <div class="flex flex-wrap items-center justify-center sm:justify-start gap-1.5">
                            <span id="book-publisher-badge" class="px-2 py-0.5 rounded text-[10px] font-semibold bg-white border border-slate-200 text-slate-600 shadow-2xs">
                                東京アカデミー七賢出版
                            </span>
                            <span id="book-series-badge" class="px-2 py-0.5 rounded text-[10px] font-medium bg-slate-200/80 text-slate-700">
                                専門教養
                            </span>
                        </div>

                        <h3 id="book-title" class="text-sm sm:text-base font-bold text-slate-800 leading-snug">
                            書籍名
                        </h3>

                        <p id="book-description" class="text-xs text-slate-600 leading-relaxed">
                            書籍の説明文
                        </p>

                        <!-- 分野・特徴タグ一覧 -->
                        <div id="book-tags" class="flex flex-wrap items-center justify-center sm:justify-start gap-1 pt-1">
                            <!-- JSでタグ生成 -->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // =========================================================================
        // 【1. 書籍画像ファイル設定】
        // 画像ファイルをGitHub等に配置した後、各書籍のファイルパスを入力してください。
        // =========================================================================
        const BOOK_IMAGES = {
            kyoshoku_1:     '1tea-opensesame-2026.webp', // 教職教養Ⅰ [教育原理・教育法規] 
            kyoshoku_2:     '8122h1W2SBL._AC_UF1000,1000_QL80_.jpg', // 教職教養Ⅱ [教育史・教育心理] 
            kyoshoku_kiso2: 'shopping.webp', // オープンセサミシリーズ 2028年度 問題集 教職教養
            chugaku:        '261CTsyiGPxL._AC_UF1000,1000_QL80_.jpg', // ステップアップ問題集② 中学社会 
            koukou:         '361i4E4WYvFL.jpg', // ステップアップ問題集③ 高校社会 
            buildup:        '28BuildUp2.jpg'  // 中高社会の完全攻略 Build Up② 
        };

        // =========================================================================
        // 【2. 教職教養基礎Ⅱ：PDF資料一覧 Googleドライブリンク管理】
        // Googleドライブの共有リンク（「リンクを知っている全員が閲覧可」に設定）を
        // 以下の各項目の '#' と差し替えて貼り付けてください。
        // （'#' のままの場合は自動的に「準備中」ボタンになります）
        // =========================================================================
        const KISO2_PDF_URLS = {
            genri:    'https://drive.google.com/file/d/1F6TuMTbssOs1pGM4PebyTLFYGBnbHKch/view?usp=sharing', // 1 教育原理 の Googleドライブ共有URL
            seiyo:    'https://drive.google.com/file/d/1vhwE4hNHKetfJZ2voCes0A4AcX0-hoRF/view?usp=sharing', // 2 西洋教育史 の Googleドライブ共有URL
            nihon:    'https://drive.google.com/file/d/1NlWwhS5fBs0EeXhjkvaIJpQA7NYSKDuX/view?usp=sharing', // 3 日本教育史 の Googleドライブ共有URL
            shinri:   'https://drive.google.com/file/d/1ZBnobfLFLPVhQXWsAK0utcLXaYzFNAZy/view?usp=sharing', // 4 教育心理 の Googleドライブ共有URL
            houki:    'https://drive.google.com/file/d/1MfjjXda3a5VnejKji_Ilo6dzNPGF10EV/view?usp=sharing', // 5 教育法規 の Googleドライブ共有URL
            kaisetsu: 'https://drive.google.com/file/d/1K-QkWktrTpPoDanV_xUcAnUyf2yY_tDw/view?usp=sharing'  // 解答解説 の Googleドライブ共有URL
        };

        /**
         * 【テストデータ管理】
         * 教職教養、専門教科（中学社会・高校地歴公民・中高社会完全攻略）の全データを保持
         */
        const courseConfig = {
            'kyoshoku': {
                title: '教職教養 対策メニュー',
                categories: ['教職教養基礎Ⅱ', '教育原理', '教育心理', '教育法規', '西洋教育史', '日本教育史'],
                getBook: (category) => {
                    if (category === '教職教養基礎Ⅱ') {
                        return {
                            title: 'オープンセサミシリーズ 2028年度 問題集 教員採用試験対策 教職教養',
                            series: 'オープンセサミシリーズ 2028年度 問題集',
                            publisher: '東京アカデミー編 / 東京アカデミー七賢出版',
                            description: '本試験の出題傾向を徹底分析！得点力がアップする教職教養必須の問題集。復習問題と連動して実戦力を養成。',
                            tags: ['オープンセサミ', '問題集', '教職教養', '東京アカデミー七賢出版', '2028年度'],
                            actualImage: BOOK_IMAGES.kyoshoku_kiso2
                        };
                    }

                    const isBook1 = (category === '教育原理' || category === '教育法規');
                    if (isBook1) {
                        return {
                            title: 'オープンセサミシリーズ 参考書 教員採用試験対策 教職教養Ⅰ [教育原理 教育法規]',
                            series: 'オープンセサミシリーズ 2027年度 参考書',
                            publisher: '東京アカデミー編 / 東京アカデミー七賢出版',
                            description: '教育原理・教育法規の知識をすみずみまで徹底解説。確認テストと完全連動した必携参考書。',
                            tags: ['オープンセサミ', '教育原理', '教育法規', '東京アカデミー七賢出版'],
                            actualImage: BOOK_IMAGES.kyoshoku_1
                        };
                    } else {
                        return {
                            title: 'オープンセサミシリーズ 参考書 教員採用試験対策 教職教養Ⅱ [教育史 教育心理]',

        function init() {
            updateCourseButtons();
            renderTabs();
            renderTable(currentCategory);
            renderBookInfo();
            renderKiso2SubTabUI();
        }

        function changeCourse(newCourse) {
            currentCourse = newCourse;
            const config = courseConfig[newCourse];
            
            document.getElementById('main-title').textContent = config.title;
            
            currentCategory = config.categories[0];
            kiso2CurrentSubTab = 'tests';
            
            updateCourseButtons();
            renderTabs();
            renderTable(currentCategory);
            renderBookInfo();
            renderKiso2SubTabUI();
        }

        function updateCourseButtons() {
            const buttons = document.querySelectorAll('.course-switch-btn');
            buttons.forEach(btn => {
                const course = btn.getAttribute('data-course');
                if (course === currentCourse) {
                    btn.className = "course-switch-btn course-btn-active relative px-2.5 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all";
                } else {
                    btn.className = "course-switch-btn course-btn-inactive relative px-2.5 sm:px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all";
                }
            });
        }

        function renderBookInfo() {
            const config = courseConfig[currentCourse];
            const book = config.getBook(currentCategory);

            document.getElementById('book-title').textContent = book.title;
            document.getElementById('book-publisher-badge').textContent = book.publisher;
            document.getElementById('book-series-badge').textContent = book.series;
            document.getElementById('book-description').textContent = book.description;

            const tagsContainer = document.getElementById('book-tags');
            tagsContainer.innerHTML = '';
            book.tags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = "px-2 py-0.5 rounded-full text-[10px] font-medium bg-white/80 border border-slate-200 text-slate-600";
                tagEl.textContent = `#${tag}`;
                tagsContainer.appendChild(tagEl);
            });

            // 軽量プレースホルダー（CSSジャケット記述を削除し、軽量なカードへ置換）
            const defaultPlaceholderHtml = `
                <div class="w-24 sm:w-28 h-32 sm:h-36 bg-slate-100 border border-slate-300 rounded-md flex flex-col items-center justify-center p-2 text-center book-spine-shadow shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    <span class="text-[9px] font-bold text-slate-600 leading-tight">${book.title.slice(0, 18)}...</span>
                </div>
            `;

            const coverContainer = document.getElementById('book-cover-container');
            if (book.actualImage && book.actualImage !== '#') {
                const imgWrap = document.createElement('div');
                imgWrap.className = "relative w-24 sm:w-28 h-32 sm:h-36 rounded-md book-spine-shadow shrink-0 select-none overflow-hidden bg-white border border-slate-200 transform hover:scale-105 transition-transform duration-200";
                
                const img = document.createElement('img');
                img.src = book.actualImage;
                img.alt = book.title;
                img.className = "w-full h-full object-cover";
                img.onerror = function() {
                    coverContainer.innerHTML = defaultPlaceholderHtml;
                };
                
                imgWrap.appendChild(img);
                coverContainer.innerHTML = '';
                coverContainer.appendChild(imgWrap);
            } else {
                coverContainer.innerHTML = defaultPlaceholderHtml;
            }
        }

        function switchKiso2SubTab(subTab) {
            kiso2CurrentSubTab = subTab;
            renderKiso2SubTabUI();
        }

        function renderKiso2SubTabUI() {
            const isKiso2 = (currentCourse === 'kyoshoku' && currentCategory === '教職教養基礎Ⅱ');
            const subtabsContainer = document.getElementById('kiso2-subtabs-container');
            const pdfGridContainer = document.getElementById('kiso2-pdf-grid-container');
            const tableContainer = document.getElementById('table-container');
            const mobileScrollHint = document.getElementById('mobile-scroll-hint');
            const paginationContainer = document.getElementById('pagination-container');
            const btnTests = document.getElementById('kiso2-subtab-tests');
            const btnPdf = document.getElementById('kiso2-subtab-pdf');

            if (!isKiso2) {
                if (subtabsContainer) subtabsContainer.classList.add('hidden');
                if (pdfGridContainer) pdfGridContainer.classList.add('hidden');
                if (tableContainer) tableContainer.classList.remove('hidden');
                if (mobileScrollHint) mobileScrollHint.classList.remove('hidden');
                if (paginationContainer) paginationContainer.classList.remove('hidden');
                return;
            }

            // 教職教養基礎Ⅱの場合、サブタブを表示
            if (subtabsContainer) subtabsContainer.classList.remove('hidden');

            if (kiso2CurrentSubTab === 'tests') {
                // 復習問題タブアクティブ
                btnTests.className = "flex-1 py-1.5 px-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 bg-white text-[#005662] shadow-xs whitespace-nowrap";
                btnPdf.className = "flex-1 py-1.5 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-1 text-slate-600 hover:text-slate-900 whitespace-nowrap";
                
                if (pdfGridContainer) pdfGridContainer.classList.add('hidden');
                if (tableContainer) tableContainer.classList.remove('hidden');
                if (mobileScrollHint) mobileScrollHint.classList.remove('hidden');
                if (paginationContainer) paginationContainer.classList.remove('hidden');
            } else {
                // PDF資料タブアクティブ
                btnPdf.className = "flex-1 py-1.5 px-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-1 bg-white text-red-600 shadow-xs ring-1 ring-red-200 whitespace-nowrap";
                btnTests.className = "flex-1 py-1.5 px-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900 whitespace-nowrap";
                
                if (pdfGridContainer) {
                    pdfGridContainer.classList.remove('hidden');
                    renderKiso2PdfButtons();
                }
                if (tableContainer) tableContainer.classList.add('hidden');
                if (mobileScrollHint) mobileScrollHint.classList.add('hidden');
                if (paginationContainer) paginationContainer.classList.add('hidden');
            }
        }

        function renderKiso2PdfButtons() {
            const container = document.getElementById('kiso2-pdf-buttons');
            if (!container) return;
            container.innerHTML = '';

            const pdfData = getKiso2PdfData();
            pdfData.forEach(item => {
                const isReady = (item.pdfLink && item.pdfLink !== '#');
                const btn = document.createElement('a');
                btn.href = isReady ? item.pdfLink : 'javascript:void(0)';
                if (isReady) btn.target = '_blank';
                
                btn.className = isReady 
                    ? "flex items-center justify-between p-3.5 rounded-xl border border-red-200/90 bg-gradient-to-r from-white via-red-50/20 to-white hover:border-red-500 hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 group shadow-xs cursor-pointer"
                    : "flex items-center justify-between p-3.5 rounded-xl border-2 border-dashed border-red-200/60 bg-gradient-to-r from-white to-red-50/10 hover:border-red-400 hover:bg-red-50/20 transition-all group shadow-xs";

                btn.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${isReady ? 'bg-red-500 text-white shadow-xs group-hover:scale-105' : 'bg-red-100 text-red-600 group-hover:bg-red-200'} transition-transform duration-200">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div class="min-w-0 text-left">
                            <span class="text-xs sm:text-sm font-bold truncate block ${isReady ? 'text-slate-800 group-hover:text-red-700' : 'text-slate-700'}">
                                ${item.name}
                            </span>
                        </div>
                    </div>
                    <span class="text-[11px] font-black px-2.5 py-1 rounded-lg shrink-0 ${isReady ? 'bg-red-600 text-white shadow-xs group-hover:bg-red-700' : 'bg-red-50 text-red-600 border border-red-200'} transition-colors">
                        ${isReady ? '開く ↗' : '準備中'}
                    </span>
                `;
                container.appendChild(btn);
            });
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            const categories = courseConfig[currentCourse].categories;

            categories.forEach(category => {
                const button = document.createElement('button');
                const isActive = category === currentCategory;
                
                button.className = `shrink-0 px-3.5 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all ${isActive ? 'tab-active' : 'tab-inactive'}`;
                button.textContent = category;
                
                button.onclick = () => {
                    currentCategory = category;
                    renderTabs();
                    renderTable(category);
                    renderBookInfo();
                    renderKiso2SubTabUI();
                };
                
                tabsContainer.appendChild(button);
            });
        }

        function renderTable(category) {
            const tbody = document.getElementById('test-list-body');
            tbody.innerHTML = '';

            // 2in1列の表示判定（教職教養基礎Ⅱ、完全攻略では非表示）
            const showTwoInOne = (category !== '教職教養基礎Ⅱ' && currentCourse !== 'chukou-kanzen');
            const thTwoInOne = document.getElementById('th-two-in-one');
            if (thTwoInOne) {
                thTwoInOne.style.display = showTwoInOne ? '' : 'none';
            }

            let filteredData = [];
            if (currentCourse === 'chukou-kanzen') {
                if (category === '全項目') {
                    filteredData = allTestsData.filter(test => test.course === currentCourse);
                } else if (category === '本編（要点・典型問題）') {
                    filteredData = allTestsData.filter(test => test.course === currentCourse && test.subCategory === 'main');
                } else if (category === '合格トレーニング') {
                    filteredData = allTestsData.filter(test => test.course === currentCourse && test.subCategory === 'training');
                }
            } else {
                filteredData = allTestsData.filter(test => test.course === currentCourse && test.category === category);
            }

            if (filteredData.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="${showTwoInOne ? 6 : 5}" class="border border-gray-300 p-6 text-gray-400">登録されているテストデータはありません</td>`;
                tbody.appendChild(tr);
                document.getElementById('pagination-info').textContent = '0件 (1/1)';
                return;
            }

            filteredData.forEach(test => {
                const isTestActive = test.status === "active";
                const isPdfActive = test.pdfStatus === "active";
                const isTwoInOneActive = (test.twoInOneStatus === "active");
                
                const statusLabel = isTestActive ? "テスト受付中" : "テスト準備中";
                const statusClass = isTestActive ? "status-active" : "status-prep";
                
                const linkTagOpen = isTestActive 
                    ? `<a href="${test.link}" class="text-blue-600 underline hover:text-blue-800 font-bold py-1 inline-block">` 
                    : `<span class="text-gray-400 underline cursor-not-allowed py-1 inline-block">`;
                const linkTagClose = isTestActive ? `</a>` : `</span>`;

                const pdfHtml = isPdfActive
                    ? `<a href="${test.pdfLink}" target="_blank" class="text-red-500 hover:text-red-700 font-bold flex items-center justify-center gap-1 py-1.5 px-2 rounded hover:bg-red-50 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        PDF
                       </a>`
                    : `<span class="text-gray-300 flex items-center justify-center gap-1 py-1.5 px-2 cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        PDF
                       </span>`;

                let twoInOneTd = '';
                if (showTwoInOne) {
                    const twoInOneHtml = isTwoInOneActive
                        ? `<a href="${test.twoInOneLink}" target="_blank" class="text-orange-500 hover:text-orange-700 font-bold flex items-center justify-center gap-1 py-1.5 px-2 rounded hover:bg-orange-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                            </svg>
                            2in1
                           </a>`
                        : `<span class="text-gray-300 flex items-center justify-center gap-1 py-1.5 px-2 cursor-not-allowed">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                            </svg>
                            2in1
                           </span>`;
                    twoInOneTd = `<td class="border-r border-gray-300 p-2 whitespace-nowrap">${twoInOneHtml}</td>`;
                }

                const btnHtml = isTestActive
                    ? `<a href="${test.link}" class="inline-block border border-gray-400 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 px-3.5 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition shadow-2xs">テスト実施</a>`
                    : `<button disabled class="border border-gray-200 bg-gray-50 text-gray-300 px-3.5 sm:px-4 py-1.5 rounded-lg text-xs cursor-not-allowed">テスト実施</button>`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="border-r border-gray-300 p-2.5 text-left pl-3 sm:pl-4 whitespace-nowrap">
                        ${linkTagOpen}${test.name}${linkTagClose}
                    </td>
                    <td class="border-r border-gray-300 p-2 whitespace-nowrap">
                        ${pdfHtml}
                    </td>
                    ${twoInOneTd}
                    <td class="border-r border-gray-300 p-2 whitespace-nowrap">
                        <span class="inline-block text-white text-xs px-2.5 py-0.5 rounded font-medium ${statusClass}">
                            ${statusLabel}
                        </span>
                    </td>
                    <td class="border-r border-gray-300 p-2 text-gray-600 whitespace-nowrap text-xs sm:text-sm">
                        ${test.totalScore}
                    </td>
                    <td class="p-2 whitespace-nowrap">
                        ${btnHtml}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('pagination-info').textContent = `${filteredData.length}件 (1/1)`;
        }

        window.onload = init;
    </script>
</body>
</html>

                    ["①のリーダーの場合である。", "②のリーダーの場合である。", "③のリーダーの場合である。", "有意な差はみられない。"],
                    ["①のリーダーの場合である。", "②のリーダーの場合である。", "③のリーダーの場合である。", "有意な差はみられない。"],
                    ["①のリーダーの場合である。", "②のリーダーの場合である。", "③のリーダーの場合である。", "有意な差はみられない。"]
                ],
                answer: ["自由放任", "①のリーダーの場合である。", "③のリーダーの場合である。", "②のリーダーの場合である。"],
                displayAnswer: "(1) 自由放任\n(2) ①のリーダーの場合である。\n(3) ③のリーダーの場合である。\n(4) ②のリーダーの場合である。",
                explanation: "よく引用される有名な実験なので，結果の概要を知っておくとよい。集団の生産性の面では専制的リーダーはよいようにみえるが，長期的には民主的なリーダーのほうが優れているのである。"
            },
            {
                id: 5,
                point: 4,
                pointPerItem: 1,
                inputCount: 4,
                ordered: true,
                labels: ["(1)", "(2)", "(3)", "(4)"],
                text: `次の説明に最も近い語句を語群より選べ。\n\n【語群】\nア. ホーン効果　イ. ピグマリオン効果　ウ. ハロー効果\nエ. 対比効果　　オ. 天井効果`,
                subQuestions: [
                    { text: "(1) 他人について認知するとき、あるよい面を知っていると、それが影響して、結果として歪んだ評価をもたらすことがある。", inputIndices: [0] },
                    { text: "(2) 評価者である教師が特定の児童・生徒に何らかの期待をもつと、実際の働きかけが変わって、結果として期待した方向に児童・生徒が変化することがある。", inputIndices: [1] },
                    { text: "(3) テスト問題が易しすぎて満点に得点分布が集中し、学習成果の個人差を反映した適正な評価が困難になることがある。", inputIndices: [2] },
                    { text: "(4) 評価基準となるべき教育目標ではなく、評価者自身や他の評価対象が基準になってしまい、特定の評価者への評価が不当に高くなったり低くなったりすることがある。", inputIndices: [3] }
                ],
                options: [
                    ["ア. ホーン効果", "イ. ピグマリオン効果", "ウ. ハロー効果", "エ. 対比効果", "オ. 天井効果"],
                    ["ア. ホーン効果", "イ. ピグマリオン効果", "ウ. ハロー効果", "エ. 対比効果", "オ. 天井効果"],
                    ["ア. ホーン効果", "イ. ピグマリオン効果", "ウ. ハロー効果", "エ. 対比効果", "オ. 天井効果"],
                    ["ア. ホーン効果", "イ. ピグマリオン効果", "ウ. ハロー効果", "エ. 対比効果", "オ. 天井効果"]
                ],
                answer: ["ウ. ハロー効果", "イ. ピグマリオン効果", "オ. 天井効果", "エ. 対比効果"],
                displayAnswer: "(1) ウ. ハロー効果\n(2) イ. ピグマリオン効果\n(3) オ. 天井効果\n(4) エ. 対比効果",
                explanation: "評価に関連する現象には様々なものがあるが、特にハロー効果(光背効果、後光効果)とピグマリオン効果(教師期待効果)は頻出である。言いかえのある名称については、いずれで出題されても対応できるよう押さえておくこと。"
            }
        ];

        // 状態変数
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {}; 

        // フォントサイズ切り替え用の設定
        const fontSizes = ['normal', 'small', 'xsmall', 'large'];
        let currentFontSizeIndex = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const startScreen = document.getElementById('start-screen');
            const testScreen = document.getElementById('test-screen');
            const resultScreen = document.getElementById('result-screen');
            const questionContent = document.getElementById('question-content');
            const answerContainer = document.getElementById('answer-container');
            const questionNavList = document.getElementById('question-nav-list');
            const confirmModal = document.getElementById('confirm-modal');
            const drawerOverlay = document.getElementById('drawer-overlay');
            const drawerMenu = document.getElementById('drawer-menu');
            const drawerList = document.getElementById('drawer-list');

            function openDrawer() {
                drawerMenu.classList.remove('-translate-x-full');
                drawerOverlay.classList.remove('hidden');
            }

            function closeDrawer() {
                drawerMenu.classList.add('-translate-x-full');
                drawerOverlay.classList.add('hidden');
            }

            function startTest() {
                questions = [...originalQuestions];
                currentQuestionIndex = 0;
                userAnswers = {};
                
                startScreen.classList.add('hidden');
                resultScreen.classList.add('hidden');
                testScreen.classList.remove('hidden');
                testScreen.classList.add('flex');

                renderNavList();
                renderQuestion();
            }

            function renderNavList() {
                questionNavList.innerHTML = '';
                drawerList.innerHTML = '';

                questions.forEach((_, index) => {
                    const navItem = document.createElement('div');
                    navItem.className = `p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base ${index === currentQuestionIndex ? 'bg-emerald-100 border-emerald-400 theme-text' : 'bg-gray-200 border-gray-300 hover:bg-gray-300'}`;
                    navItem.innerText = `【問題${index + 1}】`;
                    
                    navItem.addEventListener('click', () => {
                        if (currentQuestionIndex !== index) {
                            saveAnswer();
                            currentQuestionIndex = index;
                            renderQuestion();
                        }
                    });
                    questionNavList.appendChild(navItem);

                    const li = document.createElement('li');
                    li.className = `p-3 mb-1 rounded cursor-pointer transition fs-base ${index === currentQuestionIndex ? 'bg-emerald-100 font-bold theme-text border border-emerald-400' : 'bg-gray-200 border border-gray-300 hover:bg-gray-300 text-gray-700'}`;
                    li.innerHTML = `<div class="text-center">【問題${index + 1}】</div>`;
                    
                    li.addEventListener('click', () => {
                        if (currentQuestionIndex !== index) {
                            saveAnswer();
                            currentQuestionIndex = index;
                            renderQuestion();
                        }
                        closeDrawer();
                    });
                    drawerList.appendChild(li);
                });
            }

            function createSelectElement(q, i) {
                const select = document.createElement('select');
                select.className = 'answer-input multi-input shadow-sm appearance-none border border-gray-400 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-1 theme-ring bg-white cursor-pointer fs-base';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                if (q.inputCount === 1) {
                    defaultOption.text = "選択してください";
                } else {
                    let prefix = q.labels ? q.labels[i] : (i+1);
                    defaultOption.text = `（${prefix}）を選択してください`;
                }
                defaultOption.disabled = true;
                defaultOption.selected = true;
                select.appendChild(defaultOption);

                q.options[i].forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.text = opt;
                    if (userAnswers[q.id] && userAnswers[q.id][i] === opt) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });
                return select;
            }

            function renderQuestion() {
                const q = questions[currentQuestionIndex];
                document.getElementById('question-number').innerText = `【問題${currentQuestionIndex + 1}】（${q.point}点）`;
                document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${questions.length}`;

                questionContent.innerHTML = '';
                answerContainer.innerHTML = '';

                if (q.text) {
                    const p = document.createElement('div');
                    p.className = 'mb-6 leading-relaxed fs-lg text-gray-800 whitespace-pre-wrap';
                    p.innerHTML = q.text;
                    questionContent.appendChild(p);
                }

                if (q.subQuestions && q.subQuestions.length > 0) {
                    answerContainer.classList.add('hidden');

                    q.subQuestions.forEach((sub, i) => {
                        let subText = typeof sub === 'string' ? sub : sub.text;
                        let inputIndices = typeof sub === 'string' ? [i] : sub.inputIndices;

                        const subP = document.createElement('p');
                        subP.className = 'mb-2 leading-relaxed whitespace-pre-wrap fs-lg text-gray-800';
                        subP.innerText = subText;
                        questionContent.appendChild(subP);

                        inputIndices.forEach(idx => {
                            const selectWrap = document.createElement('div');
                            selectWrap.className = 'mb-4 bg-gray-50 p-4 border rounded';
                            const label = document.createElement('label');
                            label.className = 'block font-bold text-gray-700 mb-2 fs-sm';
                            let prefix = q.labels ? q.labels[idx] : (idx+1);
                            label.innerText = (q.inputCount === 1) ? '解答を選択してください：' : `（${prefix}）を選択してください：`;
                            selectWrap.appendChild(label);
                            const select = createSelectElement(q, idx);
                            selectWrap.appendChild(select);
                            questionContent.appendChild(selectWrap);
                        });
                    });
                } else {
                    answerContainer.classList.remove('hidden');
                    for(let i = 0; i < q.inputCount; i++) {
                        const selectWrap = document.createElement('div');
                        selectWrap.className = 'mb-3';
                        const select = createSelectElement(q, i);
                        selectWrap.appendChild(select);
                        answerContainer.appendChild(selectWrap);
                    }
                }

                Array.from(questionNavList.children).forEach((el, idx) => {
                    el.className = `p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base ${idx === currentQuestionIndex ? 'bg-emerald-100 border-emerald-400 theme-text' : 'bg-gray-200 border-gray-300 hover:bg-gray-300'}`;
                });
                Array.from(drawerList.children).forEach((li, idx) => {
                    li.className = `p-3 mb-1 rounded cursor-pointer transition fs-base ${idx === currentQuestionIndex ? 'bg-emerald-100 font-bold theme-text border border-emerald-400' : 'bg-gray-200 border border-gray-300 hover:bg-gray-300 text-gray-700'}`;
                });

                document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
                if (currentQuestionIndex === questions.length - 1) {
                    document.getElementById('next-btn').classList.add('hidden');
                    document.getElementById('finish-btn').classList.remove('hidden');
                } else {
                    document.getElementById('next-btn').classList.remove('hidden');
                    document.getElementById('finish-btn').classList.add('hidden');
                }

                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0; 
                    document.documentElement.scrollTop = 0;
                }, 10);
            }

            function saveAnswer() {
                const q = questions[currentQuestionIndex];
                if (q.inputCount) {
                    const inputs = testScreen.querySelectorAll('.answer-input');
                    userAnswers[q.id] = Array.from(inputs).map(input => input.value);
                }
            }

            function executeScoring() {
                testScreen.classList.add('hidden');
                testScreen.classList.remove('flex');
                resultScreen.classList.remove('hidden');
                confirmModal.classList.add('hidden');

                let score = 0;
                let totalPoints = 0;
                const resultContainer = document.getElementById('result-list');
                resultContainer.innerHTML = '';

                questions.forEach((q, index) => {
                    totalPoints += q.point;
                    let earnedPoint = 0;
                    const userAnsArray = userAnswers[q.id] || Array(q.inputCount).fill("");
                    
                    q.answer.forEach((correctWord, i) => {
                        if (userAnsArray[i] === correctWord) earnedPoint += q.pointPerItem;
                    });
                    
                    score += earnedPoint;
                    let markHtml = earnedPoint === q.point ? '<span class="text-red-600 font-bold mr-2 fs-xl">○</span>' : earnedPoint > 0 ? '<span class="text-yellow-600 font-bold mr-2 fs-xl">△</span>' : '<span class="text-blue-600 font-bold mr-2 fs-xl">×</span>';

                    let subListText = "";
                    if (q.subQuestions) {
                        subListText = q.subQuestions.map(sq => {
                            let text = typeof sq === 'string' ? sq : sq.text;
                            return `<p class="mb-2 fs-lg text-gray-800 font-medium">${text}</p>`;
                        }).join("");
                    }

                    const itemHtml = `
                        <div class="border border-gray-300 rounded shadow-sm bg-white overflow-hidden">
                            <div class="bg-emerald-50 px-4 py-2 border-b border-gray-300 text-gray-800 font-bold flex items-center fs-base">
                                ${markHtml} 【問題${index + 1}】（${q.point}点）
                            </div>
                            <div class="p-4 md:p-6">
                                <div class="mb-4 leading-relaxed fs-lg text-gray-800 whitespace-pre-wrap">${q.text}</div>
                                <div class="mb-6">${subListText}</div>
                                <table class="w-full border-collapse">
                                    <tbody>
                                        <tr><th class="w-1/3 md:w-1/4 theme-bg text-white p-2 border border-gray-300 text-left fs-sm">正解</th><td class="p-2 border border-gray-300 font-bold whitespace-pre-wrap fs-sm">${q.displayAnswer}</td></tr>
                                        <tr><th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">学習者解答</th><td class="p-2 border border-gray-300 whitespace-pre-wrap fs-sm ${earnedPoint === q.point ? '' : 'text-red-600 font-bold'}">${userAnsArray.map((ans, idx) => (q.inputCount > 1 ? `(${q.labels ? q.labels[idx] : (idx+1)}) ` : '') + (ans || '未選択')).join('\n')}</td></tr>
                                        ${q.explanation ? `<tr><th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">解説</th><td class="p-2 border border-gray-300 text-gray-700 whitespace-pre-wrap fs-sm">${q.explanation}</td></tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    resultContainer.insertAdjacentHTML('beforeend', itemHtml);
                });

                document.getElementById('total-score').innerText = `${score}点 / ${totalPoints}点`;
                setTimeout(() => { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; }, 10);
            }

            document.getElementById('font-size-btn').addEventListener('click', () => {
                currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
                const scaleMap = {'normal': 1, 'small': 0.85, 'xsmall': 0.7, 'large': 1.15};
                document.documentElement.style.setProperty('--font-scale', scaleMap[fontSizes[currentFontSizeIndex]]);
            });

            document.getElementById('mobile-menu-btn').addEventListener('click', openDrawer);
            document.getElementById('close-menu-btn').addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);
            document.getElementById('start-btn').addEventListener('click', startTest);
            document.getElementById('next-btn').addEventListener('click', () => { saveAnswer(); currentQuestionIndex++; renderQuestion(); });
            document.getElementById('prev-btn').addEventListener('click', () => { saveAnswer(); currentQuestionIndex--; renderQuestion(); });
            document.getElementById('finish-btn').addEventListener('click', () => { saveAnswer(); confirmModal.classList.remove('hidden'); });
            document.getElementById('modal-cancel-btn').addEventListener('click', () => confirmModal.classList.add('hidden'));
            document.getElementById('modal-ok-btn').addEventListener('click', executeScoring);
            document.getElementById('retry-btn').addEventListener('click', () => { window.location.href = "https://n-kyozai.github.io/ununipa.ac.jp/teach-base-1/index.html"; });
        });
    </script>
</body>
</html>

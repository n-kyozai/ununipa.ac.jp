<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育原理 復習問題（第5回）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 画像に合わせた深緑色をテーマカラーに設定 */
        .theme-bg { background-color: #005c42; }
        .theme-bg-hover:hover { background-color: #004531; }
        .theme-text { color: #005c42; }
        .theme-border { border-color: #005c42; }
        .theme-ring:focus { 
            --tw-ring-color: #005c42; 
            border-color: #005c42; 
        }

        /* フォントサイズ手動切り替え用 */
        :root {
            --font-scale: 0.85; /* デフォルトを一段階縮小 */
        }
        .fs-base { font-size: calc(1rem * var(--font-scale)) !important; line-height: calc(1.5rem * var(--font-scale)) !important; }
        .fs-lg { font-size: calc(1.125rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-xl { font-size: calc(1.25rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-2xl { font-size: calc(1.5rem * var(--font-scale)) !important; line-height: calc(2rem * var(--font-scale)) !important; }
        .fs-5xl { font-size: calc(3rem * var(--font-scale)) !important; line-height: calc(1) !important; }
        .fs-sm { font-size: calc(0.875rem * var(--font-scale)) !important; line-height: calc(1.25rem * var(--font-scale)) !important; }

        /* サイドバー用カスタムスクロールバー */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10 fs-base flex flex-col">

    <!-- ドロワーメニュー用オーバーレイ (モバイル用) -->
    <div id="drawer-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity"></div>

    <!-- ドロワーメニュー本体 (モバイル用) -->
    <nav id="drawer-menu" class="fixed inset-y-0 left-0 w-64 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col md:hidden">
        <div class="theme-bg text-white p-4 flex justify-between items-center">
            <span class="font-bold text-lg fs-base">問題一覧</span>
            <button id="close-menu-btn" class="p-1 hover:bg-white hover:bg-opacity-20 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <ul id="drawer-list" class="flex-1 overflow-y-auto p-2 custom-scrollbar">
            <!-- JSで生成 -->
        </ul>
    </nav>

    <!-- スタート画面 -->
    <div id="start-screen" class="max-w-5xl mx-auto p-4 pt-8 w-full">
        <div class="bg-white border border-gray-300 shadow-sm mb-6">
            <table class="w-full border-collapse">
                <tbody>
                    <tr><th class="w-1/3 md:w-1/4 theme-bg text-white p-3 border border-gray-300 text-left fs-sm">テストグループ</th><td class="p-3 border border-gray-300 fs-sm">教職教養基礎</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">テスト名</th><td class="p-3 border border-gray-300 font-bold fs-sm">教育原理 復習問題（第5回）</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">満点</th><td class="p-3 border border-gray-300 fs-sm">30点</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">コース</th><td class="p-3 border border-gray-300 fs-sm">教育原理</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">問題表示区分</th><td class="p-3 border border-gray-300 fs-sm">一問題表示</td></tr>
                    <tr><th class="theme-bg text-white p-3 border border-gray-300 text-left fs-sm">問題出題形式</th><td class="p-3 border border-gray-300 fs-sm">同一</td></tr>
                </tbody>
            </table>
        </div>
        <div class="text-center mt-8 flex justify-center gap-4">
            <a href="https://n-kyozai.github.io/ununipa.ac.jp/teach-base-1/index.html" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded shadow transition duration-200 inline-block fs-base">テスト一覧へ</a>
            <button id="start-btn" class="theme-bg theme-bg-hover text-white font-bold py-3 px-12 rounded shadow transition duration-200 fs-base">テスト開始</button>
        </div>
    </div>

    <!-- テスト画面 -->
    <div id="test-screen" class="hidden max-w-5xl mx-auto p-4 flex-col md:flex-row gap-6 w-full">
        <!-- 左側：問題リスト (PC用) -->
        <div class="hidden md:block w-48 shrink-0">
            <div id="question-nav-list" class="flex flex-col gap-1">
                <!-- JSで生成 -->
            </div>
        </div>

        <!-- 右側：問題エリア -->
        <div class="flex-grow">
            <!-- ヘッダー部分 -->
            <div class="flex justify-between items-center mb-4 bg-white p-3 rounded shadow-sm border border-gray-300">
                <div class="flex items-center gap-2">
                    <!-- モバイル用メニュー開閉ボタン -->
                    <button id="mobile-menu-btn" class="md:hidden text-gray-700 hover:text-gray-900 focus:outline-none p-1 border border-gray-300 rounded bg-gray-50 hover:bg-gray-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <div class="font-bold text-gray-700 fs-base ml-1">教育原理 復習問題（第5回）</div>
                </div>
                
                <div class="flex items-center gap-2 sm:gap-3">
                    <!-- フォントサイズ切り替えボタン -->
                    <button id="font-size-btn" class="border border-gray-400 bg-white rounded px-2 py-1 flex items-center justify-center font-bold text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none" style="font-size: 14px; line-height: 1.2;">
                        ぁあ
                    </button>
                </div>
            </div>
            
            <div class="border border-gray-300 rounded shadow-sm bg-white mb-6">
                <div id="question-number" class="bg-emerald-50 px-4 py-3 border-b border-gray-300 text-gray-800 font-bold fs-base">
                    <!-- 問題番号 -->
                </div>
                <div class="p-6">
                    <!-- 問題文と、文ごとの解答欄が展開されるエリア -->
                    <div id="question-content" class="mb-4"></div>

                    <!-- 従来通り、問題文の下にまとめて解答欄を置く場合のエリア -->
                    <div class="bg-gray-50 p-4 border rounded hidden" id="answer-container"></div>
                </div>
            </div>

            <div class="flex justify-between items-center border-t pt-4">
                <button id="prev-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded transition disabled:opacity-50 disabled:cursor-not-allowed fs-base">前へ</button>
                <div class="flex items-center">
                    <span id="progress-text" class="mr-6 text-gray-600 font-bold fs-base"></span>
                    <button id="next-btn" class="theme-bg theme-bg-hover text-white font-bold py-2 px-6 rounded transition fs-base">次へ</button>
                    <button id="finish-btn" class="hidden bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-2 px-6 rounded shadow transition fs-base">テスト提出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 採点結果画面 -->
    <div id="result-screen" class="hidden max-w-5xl mx-auto p-4 w-full">
        <h2 class="font-bold mb-6 text-gray-800 border-b-2 theme-border pb-2 fs-2xl">採点結果</h2>
        
        <div class="bg-white border border-gray-300 rounded shadow-sm p-6 mb-8 text-center">
            <p class="text-gray-600 mb-2 fs-lg">あなたの得点</p>
            <p id="total-score" class="font-bold theme-text mb-2 fs-5xl">0点 / 30点</p>
        </div>

        <div id="result-list" class="space-y-8">
            <!-- JSで結果を生成 -->
        </div>

        <div class="text-center mt-12 mb-8">
            <button id="retry-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-12 rounded shadow transition duration-200 fs-base">テスト一覧へ戻る</button>
        </div>
    </div>

    <!-- 確認モーダル -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-auto">
            <p class="mb-6 text-center font-bold text-gray-800 fs-lg">テストを提出して採点しますか？</p>
            <div class="flex justify-center gap-4">
                <button id="modal-cancel-btn" class="px-6 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 transition font-bold fs-base">いいえ</button>
                <button id="modal-ok-btn" class="px-6 py-2 bg-yellow-400 text-gray-900 rounded hover:bg-yellow-500 transition font-bold fs-base">はい</button>
            </div>
        </div>
    </div>

    <script>
        // 教育原理05.pdf に基づく第5回の問題データ
        const originalQuestions = [
            { 
                id: 1, 
                point: 10,
                pointPerItem: 2,
                inputCount: 5,
                ordered: true,
                labels: ["A", "B", "C", "D", "E"],
                text: `道徳教育の目標や推進体制等に関する次の文の（　）に適語を入れよ。`, 
                subQuestions: [
                    { text: "(1) 小・中学校における道徳教育は、特別の教科である道徳を（ A ）として学校の教育活動全体を通じて行うものである。", inputIndices: [0] },
                    { text: "(2) 道徳教育を進めるに当たっては、人間尊重の精神と（ B ）に対する畏敬の念を具体的な生活の中に生かすよう留意する。", inputIndices: [1] },
                    { text: "(3) 各学校において道徳教育を進めるため、校長の方針の下に（ C ）を中心に、全教師が協力して道徳教育を展開する。", inputIndices: [2] },
                    { text: "(4) 高等学校においては、公民科の「公共」及び「倫理」並びに（ D ）が、人間としての在り方生き方に関する中核的な指導の場面である。", inputIndices: [3] },
                    { text: "(5) 特別の教科 道徳の評価は、他の児童生徒との比較ではなく、児童生徒がいかに成長したかを積極的に受け止めて認め、励ます（ E ）として記述式で行う。", inputIndices: [4] }
                ],
                options: [
                    ["要", "中心", "基盤"], // A
                    ["生命", "自然", "伝統"], // B
                    ["道徳教育推進教師", "教務主任", "学年主任"], // C
                    ["特別活動", "総合的な探究の時間", "ホームルーム活動"], // D
                    ["個人内評価", "目標準拠評価", "相対評価"] // E
                ],
                answer: ["要", "生命", "道徳教育推進教師", "特別活動", "個人内評価"],
                displayAnswer: "A. 要\nB. 生命\nC. 道徳教育推進教師\nD. 特別活動\nE. 個人内評価",
                explanation: "学校における道徳教育は、道徳科を「要」として教育活動全体で行うこと、評価は数値による評価を行わず「個人内評価」として記述式で行うこと、推進体制の中心が「道徳教育推進教師」であることは教員採用試験における最重要ポイントです。"
            },
            {
                id: 2,
                point: 12,
                pointPerItem: 2,
                inputCount: 6,
                ordered: true,
                labels: ["A", "B", "C", "D", "E", "F"],
                text: `「特別の教科 道徳（道徳科）」の目標に関する次の文の（　）に適語を入れよ。`,
                subQuestions: [
                    { text: "道徳科の目標は、「道徳教育の目標に基づき、よりよく生きるための基盤となる（ A ）を養うため、道徳的諸価値についての理解を基に、自己を見つめ、物事を広い視野から（ B ）に考え、（ C ）についての考えを深める学習を通して、道徳的な（ D ）、（ E ）、（ F ）と態度を育てる」と示されている。", inputIndices: [0, 1, 2, 3, 4, 5] }
                ],
                options: [
                    ["道徳性", "人間性", "社会性"], // A
                    ["多面的・多角的", "批判的・論理的", "総合的・横断的"], // B
                    ["人間としての生き方", "将来の進路", "社会の在り方"], // C
                    ["判断力", "思考力", "表現力"], // D
                    ["心情", "感情", "共感"], // E
                    ["実践意欲", "達成意欲", "向上意欲"] // F
                ],
                answer: ["道徳性", "多面的・多角的", "人間としての生き方", "判断力", "心情", "実践意欲"],
                displayAnswer: "A. 道徳性\nB. 多面的・多角的\nC. 人間としての生き方\nD. 判断力\nE. 心情\nF. 実践意欲",
                explanation: "道徳科特有の目標として「多面的・多角的に考える」という視点や、育成を目指す「道徳的判断力」「道徳的心情」「道徳的実践意欲と態度」という3つのキーワードは必ず暗記しておきましょう。"
            },
            {
                id: 3,
                point: 8,
                pointPerItem: 2,
                inputCount: 4,
                ordered: true,
                labels: ["A", "B", "C", "D"],
                text: `小・中学校の「特別の教科 道徳」において示される内容の4つの視点に関する次の文の（　）に適語を入れよ。`,
                subQuestions: [
                    { text: "道徳科の内容は、次の4つの視点から分類整理されている。\nA. 主として（ A ）に関すること\nB. 主として（ B ）に関すること\nC. 主として集団や（ C ）との関わりに関すること\nD. 主として生命や（ D ）、崇高なものとの関わりに関すること", inputIndices: [0, 1, 2, 3] }
                ],
                options: [
                    ["自分自身", "基本的生活習慣", "善悪の判断"], // A
                    ["人との関わり", "家族との関わり", "友人との関わり"], // B
                    ["社会", "地域", "国家"], // C
                    ["自然", "宇宙", "環境"] // D
                ],
                answer: ["自分自身", "人との関わり", "社会", "自然"],
                displayAnswer: "A. 自分自身\nB. 人との関わり\nC. 社会\nD. 自然",
                explanation: "道徳科の内容項目は、A「自分自身」、B「人との関わり」、C「集団や社会との関わり」、D「生命や自然、崇高なものとの関わり」の4つの視点に分類されています。どの内容項目がどの視点に属するかを整理して理解しておくことが重要です。"
            }
        ];

        // 状態変数
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {}; 

        // フォントサイズ切り替え用の設定
        const fontSizes = ['normal', 'small', 'xsmall', 'large'];
        let currentFontSizeIndex = 1;

        // DOMContentLoaded イベントで初期化とイベントリスナーの登録を確実に行う
        document.addEventListener('DOMContentLoaded', () => {
            // DOM要素の取得
            const startScreen = document.getElementById('start-screen');
            const testScreen = document.getElementById('test-screen');
            const resultScreen = document.getElementById('result-screen');
            const questionContent = document.getElementById('question-content');
            const answerContainer = document.getElementById('answer-container');
            const questionNavList = document.getElementById('question-nav-list');
            const confirmModal = document.getElementById('confirm-modal');
            const drawerOverlay = document.getElementById('drawer-overlay');
            const drawerMenu = document.getElementById('drawer-menu');
            const drawerList = document.getElementById('drawer-list');

            // --- 関数定義 ---
            // モバイル用メニューの開閉イベント
            function openDrawer() {
                drawerMenu.classList.remove('-translate-x-full');
                drawerOverlay.classList.remove('hidden');
            }

            function closeDrawer() {
                drawerMenu.classList.add('-translate-x-full');
                drawerOverlay.classList.add('hidden');
            }

            // テスト開始処理
            function startTest() {
                questions = [...originalQuestions];
                currentQuestionIndex = 0;
                userAnswers = {};
                
                startScreen.classList.add('hidden');
                resultScreen.classList.add('hidden');
                testScreen.classList.remove('hidden');
                testScreen.classList.add('flex');

                renderNavList();
                renderQuestion();
            }

            // 左側の問題ナビゲーションとドロワーメニューの生成
            function renderNavList() {
                questionNavList.innerHTML = '';
                drawerList.innerHTML = '';

                questions.forEach((_, index) => {
                    // PC用
                    const navItem = document.createElement('div');
                    navItem.className = `p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base ${index === currentQuestionIndex ? 'bg-emerald-100 border-emerald-400 theme-text' : 'bg-gray-200 border-gray-300 hover:bg-gray-300'}`;
                    navItem.innerText = `【問題${index + 1}】`;
                    
                    navItem.addEventListener('click', () => {
                        if (currentQuestionIndex !== index) {
                            saveAnswer();
                            currentQuestionIndex = index;
                            renderQuestion();
                        }
                    });
                    questionNavList.appendChild(navItem);

                    // モバイル用（ドロワーメニュー内）
                    const li = document.createElement('li');
                    li.className = `p-3 mb-1 rounded cursor-pointer transition fs-base ${index === currentQuestionIndex ? 'bg-emerald-100 font-bold theme-text border border-emerald-400' : 'bg-gray-200 border border-gray-300 hover:bg-gray-300 text-gray-700'}`;
                    li.innerHTML = `<div class="text-center">【問題${index + 1}】</div>`;
                    
                    li.addEventListener('click', () => {
                        if (currentQuestionIndex !== index) {
                            saveAnswer();
                            currentQuestionIndex = index;
                            renderQuestion();
                        }
                        closeDrawer(); // 選択後に閉じる
                    });
                    drawerList.appendChild(li);
                });
            }

            // セレクトボックス生成
            function createSelectElement(q, i) {
                const select = document.createElement('select');
                select.className = 'answer-input multi-input shadow-sm appearance-none border border-gray-400 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-1 theme-ring bg-white cursor-pointer fs-base';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                if (q.inputCount === 1 || !q.ordered) {
                    defaultOption.text = "選択してください";
                } else {
                    let prefix = q.labels ? q.labels[i] : '①②③④⑤⑥⑦⑧⑨⑩'[i];
                    defaultOption.text = `（${prefix}）を選択してください`;
                }
                defaultOption.disabled = true;
                defaultOption.selected = true;
                select.appendChild(defaultOption);

                q.options[i].forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.text = opt;
                    if (userAnswers[q.id] && userAnswers[q.id][i] === opt) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });
                return select;
            }

            // 問題の表示
            function renderQuestion() {
                const q = questions[currentQuestionIndex];
                document.getElementById('question-number').innerText = `【問題${currentQuestionIndex + 1}】（${q.point}点）`;
                document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${questions.length}`;

                questionContent.innerHTML = '';
                answerContainer.innerHTML = '';

                if (q.text) {
                    const p = document.createElement('div');
                    p.className = 'mb-6 leading-relaxed fs-lg text-gray-800 whitespace-pre-wrap';
                    p.innerHTML = q.text;
                    questionContent.appendChild(p);
                }

                if (q.subQuestions) {
                    answerContainer.classList.add('hidden');

                    q.subQuestions.forEach((sub, i) => {
                        let subText = typeof sub === 'string' ? sub : sub.text;
                        let inputIndices = typeof sub === 'string' ? [i] : sub.inputIndices;

                        const subP = document.createElement('p');
                        subP.className = 'mb-2 leading-relaxed whitespace-pre-wrap fs-lg text-gray-800';
                        subP.innerText = subText;
                        questionContent.appendChild(subP);

                        inputIndices.forEach(idx => {
                            const selectWrap = document.createElement('div');
                            selectWrap.className = 'mb-4 bg-gray-50 p-4 border rounded';
                            
                            const label = document.createElement('label');
                            label.className = 'block font-bold text-gray-700 mb-2 fs-sm';
                            
                            let prefix = q.labels ? q.labels[idx] : '①②③④⑤⑥⑦⑧⑨⑩'[idx];
                            let labelText = (!q.ordered || q.inputCount === 1) ? '解答を選択してください：' : `（${prefix}）を選択してください：`;
                            label.innerText = labelText;
                            selectWrap.appendChild(label);

                            const select = createSelectElement(q, idx);
                            selectWrap.appendChild(select);
                            
                            questionContent.appendChild(selectWrap);
                        });
                    });
                } else {
                    if (q.inputCount > 0) {
                        answerContainer.classList.remove('hidden');
                        const label = document.createElement('label');
                        label.className = 'block font-bold text-gray-700 mb-2 fs-sm';
                        label.innerText = '解答を選択してください：';
                        answerContainer.appendChild(label);

                        for(let i = 0; i < q.inputCount; i++) {
                            const selectWrap = document.createElement('div');
                            selectWrap.className = 'mb-3';
                            const select = createSelectElement(q, i);
                            selectWrap.appendChild(select);
                            answerContainer.appendChild(selectWrap);
                        }
                    } else {
                        answerContainer.classList.add('hidden');
                    }
                }

                // ナビゲーションの色更新
                Array.from(questionNavList.children).forEach((el, idx) => {
                    if (idx === currentQuestionIndex) {
                        el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base bg-emerald-100 border-emerald-400 theme-text';
                    } else {
                        el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base bg-gray-200 border-gray-300 hover:bg-gray-300';
                    }
                });
                Array.from(drawerList.children).forEach((li, idx) => {
                    if (idx === currentQuestionIndex) {
                        li.className = 'p-3 mb-1 rounded cursor-pointer transition fs-base bg-emerald-100 font-bold theme-text border border-emerald-400';
                    } else {
                        li.className = 'p-3 mb-1 rounded cursor-pointer transition fs-base bg-gray-200 border border-gray-300 hover:bg-gray-300 text-gray-700';
                    }
                });

                // ボタン制御
                document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
                if (currentQuestionIndex === questions.length - 1) {
                    document.getElementById('next-btn').classList.add('hidden');
                    document.getElementById('finish-btn').classList.remove('hidden');
                } else {
                    document.getElementById('next-btn').classList.remove('hidden');
                    document.getElementById('finish-btn').classList.add('hidden');
                }

                // スクロールリセット
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0; 
                    document.documentElement.scrollTop = 0;
                }, 10);
            }

            function saveAnswer() {
                const q = questions[currentQuestionIndex];
                if (q.inputCount) {
                    const inputs = testScreen.querySelectorAll('.multi-input');
                    userAnswers[q.id] = Array.from(inputs).map(input => input.value);
                }
            }

            function executeScoring() {
                testScreen.classList.add('hidden');
                testScreen.classList.remove('flex');
                resultScreen.classList.remove('hidden');
                confirmModal.classList.add('hidden');

                let score = 0;
                let totalPoints = 0;
                const resultContainer = document.getElementById('result-list');
                resultContainer.innerHTML = '';

                questions.forEach((q, index) => {
                    totalPoints += q.point;
                    let earnedPoint = 0;
                    let isCorrect = false;
                    let displayUserAnswer = "";

                    if (q.inputCount) {
                        const userAnsArray = userAnswers[q.id] || Array(q.inputCount).fill("");
                        let matchCount = 0;

                        if (q.ordered) {
                            q.answer.forEach((correctWord, i) => {
                                if (userAnsArray[i] === correctWord) {
                                    matchCount++;
                                }
                            });
                        } else {
                            const normalizedUserAns = [...new Set(userAnsArray.filter(ans => ans !== ''))];
                            q.answer.forEach(correctWord => {
                                if (normalizedUserAns.includes(correctWord)) {
                                    matchCount++;
                                }
                            });
                        }
                        
                        earnedPoint = matchCount * q.pointPerItem;
                        isCorrect = earnedPoint === q.point; 

                        displayUserAnswer = userAnsArray.map((ans, idx) => {
                            const prefix = (q.inputCount > 1 && q.ordered) ? (q.labels ? q.labels[idx] : `①②③④⑤⑥⑦⑧⑨⑩`[idx]) + " " : "";
                            return ans.trim() === "" ? `${prefix}<span class='text-gray-400'>未選択</span>` : `${prefix}${ans}`;
                        }).join('\n');
                    }
                    
                    score += earnedPoint;

                    let markHtml = '';
                    if (earnedPoint === q.point) {
                        markHtml = '<span class="text-red-600 font-bold mr-2 fs-xl">○</span>';
                    } else if (earnedPoint > 0) {
                        markHtml = '<span class="text-yellow-600 font-bold mr-2 fs-xl">△</span>';
                    } else {
                        markHtml = '<span class="text-blue-600 font-bold mr-2 fs-xl">×</span>';
                    }

                    const explanationHtml = q.explanation ? q.explanation : '';
                    
                    let fullTextHtml = `<div class="mb-6 leading-relaxed fs-lg text-gray-800 whitespace-pre-wrap">${q.text}</div>`;
                    if (q.subQuestions) {
                        const subList = q.subQuestions.map(sq => {
                            let text = typeof sq === 'string' ? sq : sq.text;
                            return `<p class="mb-2 text-gray-800 whitespace-pre-wrap fs-lg">${text}</p>`;
                        }).join('');
                        fullTextHtml += `<div class="mb-6">${subList}</div>`;
                    }

                    const itemHtml = `
                        <div class="border border-gray-300 rounded shadow-sm bg-white overflow-hidden">
                            <div class="bg-emerald-50 px-4 py-2 border-b border-gray-300 text-gray-800 font-bold flex items-center fs-base">
                                ${markHtml}
                                【問題${index + 1}】（${q.point}点）
                            </div>
                            <div class="p-4 md:p-6">
                                ${fullTextHtml}
                                <table class="w-full border-collapse">
                                    <tbody>
                                        <tr>
                                            <th class="w-1/3 md:w-1/4 theme-bg text-white p-2 border border-gray-300 text-left fs-sm">正解</th>
                                            <td class="p-2 border border-gray-300 font-bold whitespace-pre-wrap fs-sm">${q.displayAnswer}</td>
                                        </tr>
                                        <tr>
                                            <th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">学習者解答</th>
                                            <td class="p-2 border border-gray-300 whitespace-pre-wrap fs-sm ${isCorrect ? '' : (earnedPoint > 0 ? 'text-yellow-700 font-bold' : 'text-red-600 font-bold')}">${displayUserAnswer}</td>
                                        </tr>
                                        <tr>
                                            <th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">点数</th>
                                            <td class="p-2 border border-gray-300 fs-sm">${earnedPoint}点／${q.point}点</td>
                                        </tr>
                                        ${explanationHtml ? `
                                        <tr>
                                            <th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">問題解説</th>
                                            <td class="p-2 border border-gray-300 text-gray-700 whitespace-pre-wrap leading-relaxed fs-sm">${explanationHtml}</td>
                                        </tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    resultContainer.insertAdjacentHTML('beforeend', itemHtml);
                });

                document.getElementById('total-score').innerText = `${score}点 / ${totalPoints}点`;

                // 採点画面に切り替わった直後に画面の一番上へスクロールさせる
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0; 
                    document.documentElement.scrollTop = 0;
                }, 10);
            }

            // --- イベントリスナーの登録 ---
            
            // フォントサイズ変更
            document.getElementById('font-size-btn').addEventListener('click', () => {
                currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
                const scaleMap = {
                    'normal': 1,
                    'small': 0.85,
                    'xsmall': 0.7,
                    'large': 1.15
                };
                document.documentElement.style.setProperty('--font-scale', scaleMap[fontSizes[currentFontSizeIndex]]);
            });

            // ドロワー関連
            document.getElementById('mobile-menu-btn').addEventListener('click', openDrawer);
            document.getElementById('close-menu-btn').addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            // テスト進行関連
            document.getElementById('start-btn').addEventListener('click', startTest);
            
            document.getElementById('retry-btn').addEventListener('click', () => {
                window.location.href = "https://n-kyozai.github.io/ununipa.ac.jp/teach-base-1/index.html";
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                saveAnswer();
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    renderQuestion();
                }
            });

            document.getElementById('prev-btn').addEventListener('click', () => {
                saveAnswer();
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    renderQuestion();
                }
            });

            testScreen.addEventListener('change', (e) => {
                if (e.target.classList.contains('answer-input')) {
                    saveAnswer();
                }
            });

            // 提出モーダル関連
            document.getElementById('finish-btn').addEventListener('click', () => {
                saveAnswer();
                confirmModal.classList.remove('hidden');
            });
            document.getElementById('modal-cancel-btn').addEventListener('click', () => {
                confirmModal.classList.add('hidden');
            });
            document.getElementById('modal-ok-btn').addEventListener('click', () => {
                executeScoring();
            });
            
        }); // DOMContentLoaded の終了
    </script>
</body>
</html>
